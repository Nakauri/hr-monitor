      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const files = sessionsByDate[iso] || [];
      // Duration-weighted avg HR across the day's sessions — more representative than
      // picking one session's average or using morning-only resting HR.
      let weightedHR = 0, totalDur = 0, totalPalp = 0, totalWarn = 0, totalShifts = 0, totalFlush = 0, totalChills = 0;
      const { start: dayStartMs, end: dayEndMs } = dayWindow(iso);
      const inDay = (s, arr, k) => {
        if (!arr || !s.startEpoch) return 0;
        let n = 0;
        for (const e of arr) {
          const t = e[k || 't'];
          if (t == null) continue;
          const ep = s.startEpoch + t * 60000;
          if (ep >= dayStartMs && ep < dayEndMs) n++;

        return n;
      };
      for (const fn of files) {
        const s = sessionsIndex[fn];
        if (!s) continue;
        const slice = s.byDay && s.byDay[iso];
        const dur = slice ? slice.durationMin : s.duration;
        const hrAvg = slice ? slice.hrAvg : s.hrAvg;
        if (dur > 0) {
          weightedHR += hrAvg * dur;

        totalWarn += inDay(s, s.warnSegs, 'start');

        totalChills += inDay(s, s.chillsWindows, 'start');
      }
      const avgHR = totalDur > 0 ? Math.round(weightedHR / totalDur) : null;
      cols.push({ iso, date: d, dow: dowNames[i], files, avgHR, totalPalp, totalWarn, totalShifts, totalFlush, totalChills, totalDur });
    }

    const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
    const weekTitle = `${weekStart.toLocaleString(undefined, { month: 'short', day: 'numeric' })} to ${sameMonth ? weekEnd.getDate() : weekEnd.toLocaleString(undefined, { month: 'short', day: 'numeric' })}, ${weekEnd.getFullYear()}`;
    const weekFiles = cols.reduce((acc, c) => acc.concat(c.files), []);

    el.innerHTML = `
      <div class="cal-header ui">
        ${dateNavHTML('week', { title: weekTitle, prevLabel: 'Previous week', nextLabel: 'Next week' })}
        <button class="btn cal-today-btn" id="week-today" type="button">This week</button>
        ${metricSwitchHTML()}
        <div class="cal-legend-strip">
          <div class="chart-legend-item"><span class="legend-swatch" style="background: #7DB8E8;"></span>Low</div>
          <div class="chart-legend-item"><span class="legend-swatch" style="background: #B8D97E;"></span>Normal</div>
          <div class="chart-legend-item"><span class="legend-swatch" style="background: #F0C75E;"></span>Elevated</div>
          <div class="chart-legend-item"><span class="legend-swatch" style="background: #E89858;"></span>High</div>
          <div class="chart-legend-item"><span class="legend-swatch" style="background: #E24B4A;"></span>Critical</div>
        </div>
      </div>
      ${buildAggregateReport('Weekly', weekFiles)}
      <div class="week-grid">
        ${cols.map(c => {
          const hasData = c.files.length > 0;
          const headline = computeHeadline(headlineMetric, c.files, c.iso);
          const isToday = c.iso === todayStr;
          return `
            <div class="week-col ${hasData ? 'has-sessions strip' : 'empty'} ${isToday ? 'today' : ''}" data-date="${c.iso}" style="${hasData ? `--strip-c: ${headline.color};` : ''}">
              <div class="week-col-head">
                <span class="week-dow">${c.dow}</span>
                <span class="week-date">${c.date.getDate()}</span>
              </div>
              ${hasData ? `
                <div>
                  <div class="week-col-hr" style="color: ${headline.color};">${headline.value ?? '—'}${headline.unit === '%' ? '<span style="font-size: 14px;">%</span>' : ''}</div>
                  <div class="week-col-hr-label">${headline.label}</div>
                </div>
                <div class="week-col-spark"><canvas data-spark="${c.iso}"></canvas></div>
                <div class="week-col-stats">
                  <div class="week-col-stat"><span class="week-col-stat-label">Sess</span><span>${c.files.length}</span></div>
                  <div class="week-col-stat"><span class="week-col-stat-label">Palp</span><span style="color: ${c.totalPalp ? 'var(--warn-palp)' : 'var(--text-dim)'};">${c.totalPalp}</span></div>
                  <div class="week-col-stat"><span class="week-col-stat-label">Flush</span><span style="color: ${c.totalFlush ? '#E8A858' : 'var(--text-dim)'};">${c.totalFlush}</span></div>
                  <div class="week-col-stat"><span class="week-col-stat-label">Chill</span><span style="color: ${c.totalChills ? '#85B7EB' : 'var(--text-dim)'};">${c.totalChills}</span></div>

    wireAggregateReport(el);
    wireMetricSwitch(el, () => renderWeek(weekArg));

    // Wire nav
    wireDateNav('week', { prev: () => setHash('week/' + isoAddDays(weekStartStr, -7)), next: () => setHash('week/' + isoAddDays(weekStartStr, 7)), shown: weekStartStr });
    document.getElementById('week-today').addEventListener('click', () => {
      setHash('week/' + todayStr);
    });
    el.querySelectorAll('.week-col.has-sessions').forEach(col => {
      col.addEventListener('click', () => {
        setHash('day/' + col.dataset.date);
      });
    });

    // Sparklines: mini HR trace per day, aggregated across sessions
    for (const col of cols) {
      if (!col.files.length) continue;
      const canvas = el.querySelector(`canvas[data-spark="${col.iso}"]`);
      if (!canvas) continue;
      drawDaySparkline(canvas, col.files, col.morningHR);
    }
  }

  // Destroy any existing Chart bound to this canvas before creating a new
  // one. Re-render-on-same-canvas otherwise leaks the prior instance.
  function freshChart(canvas, config) {
    if (!canvas) return null;
    try { Chart.getChart(canvas)?.destroy(); } catch (e) {}
    return new Chart(canvas.getContext('2d'), config);
  }

  async function drawDaySparkline(canvas, files, morningHR) {
    // Build a single-day 24-hr HR trace by stitching all sessions' HR series
    // (downsampled) on a shared 24-hr x-axis. Fast-read only - uses cached summaries
    // plus re-parses for HR data on demand.
    const points = [];
    for (const fn of files) {
      try {
        const text = await readSessionText(fn);
        const meta = parseSessionFilename(fn);
        const startHr = meta.date.getHours() + meta.date.getMinutes() / 60;
        const { rows, header } = parseCSV(text);
        const idx = {};
        header.forEach((h, i) => idx[h.trim()] = i);
        // Downsample to ~30 points per session
        const stride = Math.max(1, Math.floor(rows.length / 30));
        const elapsedMin = rowElapsedMinFn(rows, idx);
        for (let i = 0; i < rows.length; i += stride) {
          const t = elapsedMin(rows[i]);
          const h = parseFloat(rows[i][idx.hr_bpm]);
          if (!isNaN(t) && !isNaN(h)) points.push({ x: startHr + t / 60, y: h });
        }
      } catch (e) {}
    }
    points.sort((a, b) => a.x - b.x);
    const hrStage = getHRStage(morningHR);
    const color = STAGE_COLORS[hrStage];
    freshChart(canvas, {
      type: 'line',
      data: { datasets: [{ data: points, borderColor: color, backgroundColor: color + '20', tension: 0, pointRadius: 0, borderWidth: 1.2, fill: true }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { type: 'linear', min: 0, max: 24, display: false }, y: { display: false, grace: '10%' } },
      },
    });
  }

  // ===== All-time trends =====
  let allGranularity = 'day'; // 'session' | 'day' | 'week' | 'month'

  // Return a bucket key ('YYYY-MM-DD' etc.) for a session given the current granularity.
  // Prefer the CSV epoch_ms-derived local date over meta.isoDate (filename Z-parser
  // shifts early-AM Android sessions to the previous local day).
  function bucketKey(s, meta, gran) {
    const dateKey = sessionLocalDateKey(s, meta) || meta.isoDate;
    if (gran === 'session') return dateKey + ' ' + meta.isoTime;
    if (gran === 'day') return dateKey;
    if (gran === 'week') {
      const d = new Date(dayWindow(dateKey).start);
      d.setDate(d.getDate() - d.getDay()); // Sunday
      return localDateLabel(d.getTime());
    }
    if (gran === 'month') return dateKey.slice(0, 7);
    return dateKey;
  }

  // Aggregate per-session values into buckets by granularity, choosing reducer per metric.
  function aggregateBuckets(allFilenames, gran, valueFn, reducer) {
    const buckets = new Map(); // key -> array of values
    for (const fn of allFilenames) {
      const s = sessionsIndex[fn]; const meta = parseSessionFilename(fn);
      if (!s || !meta) continue;
      const v = valueFn(s, meta);
      if (v == null) continue;
      const k = bucketKey(s, meta, gran);
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push(v);
    }
    const ordered = Array.from(buckets.keys()).sort();
    return ordered.map(k => ({ x: k, y: reducer(buckets.get(k)) }));
  }
  const reduceAvg = arr => Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
  const reduceSum = arr => arr.reduce((a, b) => a + b, 0);
  const reduceAvg1 = arr => +(arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);

  // S34 Trends widgets: one layout { order, hidden, size } in localStorage; the grid reflows, hidden cards take no cell.
  const TREND_WIDGETS = [
    { id: 'hr', name: 'Heart rate trend', canvas: 'all-morning-hr', wrap: 'all-chart-wrap', size: 'half' },
    { id: 'rmssd', name: 'HRV average', canvas: 'all-rmssd-roll', wrap: 'all-chart-wrap', size: 'half' },
    { id: 'warn', name: 'Warnings', canvas: 'all-warn-bar', wrap: 'all-chart-wrap', size: 'half' },
    { id: 'palp', name: 'Palpitations by hour', canvas: 'all-palp-hour', wrap: 'all-polar-wrap', size: 'half' },
    { id: 'symp', name: 'High HR with low HRV', canvas: 'all-sympathetic', wrap: 'all-chart-wrap', size: 'full' },
    { id: 'events', name: 'Events', canvas: 'all-auto-events', wrap: 'all-chart-wrap', size: 'full' },
  ];
  const TRENDS_LAYOUT_KEY = 'aorti_trends_layout_v1';
  let trendsLayout = null, widgetsSheet = null;
  function loadTrendsLayout() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(TRENDS_LAYOUT_KEY) || 'null'); } catch (e) {}
    const ids = TREND_WIDGETS.map(w => w.id);
    const order = (saved && Array.isArray(saved.order) ? saved.order.filter(id => ids.includes(id)) : []);
    ids.forEach(id => { if (!order.includes(id)) order.push(id); });
    const hidden = (saved && Array.isArray(saved.hidden) ? saved.hidden.filter(id => ids.includes(id)) : []);
    const size = {};
    TREND_WIDGETS.forEach(w => { const v = saved && saved.size && saved.size[w.id]; size[w.id] = v === 'full' || v === 'half' ? v : w.size; });
    return { order: [...new Set(order)], hidden, size };
  }
  function saveTrendsLayout() {

  }
  const trendsChartOf = (id) => {
    const w = TREND_WIDGETS.find(x => x.id === id);

  };
  // Puts the cards in layout order and applies shown and size; resizeIds get one chart.resize() each.
  function applyTrendsLayout(save, resizeIds) {
    if (!trendsLayout) trendsLayout = loadTrendsLayout();
    const grid = document.getElementById('all-grid');
    const resize = new Set(resizeIds || []);
    if (grid) {
      // A half card left alone in its row (next shown card is full, or none) widens to fill it.
      const shown = trendsLayout.order.filter(id => !trendsLayout.hidden.includes(id));
      const fill = new Set();
      let lone = null;
      shown.forEach(id => {
        if (trendsLayout.size[id] === 'full') { if (lone) fill.add(lone); lone = null; }
        else lone = lone ? null : id;

        const card = grid.querySelector(`.all-card[data-w="${id}"]`);

        grid.appendChild(card);
        card.hidden = trendsLayout.hidden.includes(id);

    if (n) n.textContent = ' · ' + (TREND_WIDGETS.length - trendsLayout.hidden.length);

  }
  const ICO_UP = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>';
  const ICO_DOWN = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';
  function paintWidgetRows(box) {
    if (!box) return;
    const active = document.activeElement && box.contains(document.activeElement) ? document.activeElement : null;
    const row = active && active.closest('.widget-row');
    const focusKey = row ? { w: row.dataset.w, act: active.dataset.act, size: active.dataset.size } : null;
    const L = trendsLayout, last = L.order.length - 1;
    box.innerHTML = L.order.map((id, i) => {
      const w = TREND_WIDGETS.find(x => x.id === id);
      const shown = !L.hidden.includes(id), size = L.size[id];
      return `<div class="widget-row" data-w="${id}">
        <button type="button" class="chip layer-chip" data-act="show" aria-pressed="${shown}"><span class="lbl">${w.name}</span></button>
        <div class="segmented" role="group" aria-label="${w.name} width">${[['half', 'Half'], ['full', 'Full']].map(([v, l]) => `<button type="button" data-act="size" data-size="${v}" aria-pressed="${size === v}">${l}</button>`).join('')}</div>
        <button type="button" class="btn icon" data-act="up" aria-label="Move ${w.name} up"${i === 0 ? ' disabled' : ''}>${ICO_UP}</button>
        <button type="button" class="btn icon" data-act="down" aria-label="Move ${w.name} down"${i === last ? ' disabled' : ''}>${ICO_DOWN}</button>
      </div>`;
    }).join('');
    if (focusKey) {
      const sel = (act) => `.widget-row[data-w="${focusKey.w}"] [data-act="${act}"]` + (focusKey.size ? `[data-size="${focusKey.size}"]` : '');
      let t = box.querySelector(sel(focusKey.act));
      if (t && t.disabled) t = box.querySelector(sel(focusKey.act === 'up' ? 'down' : 'up'));
      try { if (t) t.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  function widgetRowsEl() {
    const box = document.createElement('div');
    box.className = 'layer-rows widget-rows ui';
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-act]');
      const row = b && b.closest('.widget-row');
      if (!row || b.disabled) return;
      const id = row.dataset.w, L = trendsLayout;
      if (b.dataset.act === 'show') {

        if (L.size[id] === b.dataset.size) return;

      } else {
        const i = L.order.indexOf(id), j = b.dataset.act === 'up' ? i - 1 : i + 1;
        if (j < 0 || j >= L.order.length) return;
        [L.order[i], L.order[j]] = [L.order[j], L.order[i]];
        applyTrendsLayout(true);
      }
    });
    paintWidgetRows(box);
    return box;
  }
  function openWidgetsSheet() {
    if (widgetsSheet && !widgetsSheet.closed) return;
    const anchor = document.getElementById('widgets-open');
    const phone = phoneTools();
    const sheet = UI.sheet({
      title: 'Widgets', className: phone ? 'layers-sheet widgets-sheet' : 'layers-pop widgets-pop', body: widgetRowsEl(),
      onClose: () => {
        const a = document.getElementById('widgets-open');

  // ===== Session detail view =====

  const LS_AUTONOMIC = 'hrv_viewer_autonomic_on';
  function isAutonomicOn() {

  let activeQuadrants = { 'low-high': false, 'high-high': false, 'low-low': false, 'high-low': false };

  // Walk through paired HR + RMSSD samples, classify each point into a quadrant,
  // and merge adjacent same-quadrant points into time ranges for chart overlays.
  function computeQuadrantRanges(data) {
    const out = { 'low-high': [], 'high-high': [], 'low-low': [], 'high-low': [] };
    if (!data.rmssd.length || !data.hr.length) return out;
    // Iterate RMSSD (coarser sampling) and find nearest HR value for each.
    // Thresholds match classifyQuadrant / summarizeCSV so quadrant overlays on
    // the chart align with the percentage numbers in the interpretation panel.
    let hrIdx = 0;
    const rr = data.rmssd;
    const hr = data.hr;
    const t = QUADRANT_THRESH;
    let cur = null;
    for (const p of rr) {
      // Advance hrIdx to the sample nearest in time
      while (hrIdx + 1 < hr.length && Math.abs(hr[hrIdx + 1].x - p.x) <= Math.abs(hr[hrIdx].x - p.x)) hrIdx++;
      const hrVal = hr[hrIdx].y;
      const hrLow = hrVal < t.hrLow, hrHigh = hrVal > t.hrHigh;
      const rmLow = p.y < t.hrvLow,  rmHigh = p.y > t.hrvHigh;
      let key = null;
      if (hrLow && rmHigh) key = 'low-high';
      else if (hrHigh && rmHigh) key = 'high-high';
      else if (hrLow && rmLow) key = 'low-low';
      else if (hrHigh && rmLow) key = 'high-low';
      // Neutral samples (middle zone) don't render as an overlay band.
      if (!key) { if (cur) { out[cur.key].push({ start: cur.start, end: cur.end }); cur = null; } continue; }
      if (cur && cur.key === key && p.x - cur.end <= 0.5) {
        cur.end = p.x;
      } else {
        if (cur) out[cur.key].push({ start: cur.start, end: cur.end });
        cur = { key, start: p.x, end: p.x };
      }
    }
    if (cur) out[cur.key].push({ start: cur.start, end: cur.end });
    // Discard ranges shorter than 5 sec (0.083 min) to avoid chart clutter
    for (const k of Object.keys(out)) {
      out[k] = out[k].filter(r => r.end - r.start >= 0.083);
    }
    return out;
  }

  const QUAD_OVERLAY_COLORS = {

    'high-high': { fill: 'rgba(93,202,165,0.12)', border: 'rgba(93,202,165,0.35)' },

  // One explorer at a time: the ids inside it (session-chart, marker-list, ...) are page-unique.
  function clearExplorer(keepHost) {

  // opts.host: element to render into (default #view-session); opts.head and opts.foot wrap the explorer.
  async function renderSession(filenameEncoded, opts) {
    opts = opts || {};

    // Virtual day sessions: renderDay builds the summary into virtualSessions first.
    let s = sessionsIndex[filename];

  // Marks store (S9): viewer-made marks and reversals beside the recordings, applied at display time.
  let marksPage = null;
  let marksVersion = 0;
  const marksMemo = new WeakMap();
  async function marksInit() {
    if (marksPage || !window.AortiMarksDrive) return;
    try {
      marksPage = await window.AortiMarksDrive.attachPage({
        idb: window.indexedDB || null,
        persist: navigator.storage && navigator.storage.persist ? () => navigator.storage.persist() : null,
        driveFetch,
        rootId: () => driveFolderId,
        rootIds: () => driveRootIds.slice(),
        canSync: marksCanSync,
        locks: navigator.locks || null,
        read: true,
      });

      marksPage.store.onChange(marksChanged);
      marksChanged();
      // An explorer drawn before the store opened lacks its viewer marks and edit controls.
      if (currentSummary && document.getElementById('session-chart')) route();
      if (driveAccessToken && driveFolderId) marksSyncPass().then((moved) => { if (moved) routeUnlessEditing(); });
    } catch (e) { console.warn('[marks] init failed', e && e.message); }
  }
  // The monitor's Drive sync setting holds for marks on the web too (driveSyncOn there); the app always syncs.
  function marksCanSync() {
    if (!(driveAccessToken && driveFolderId)) return false;
    if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return true;
    try { return localStorage.getItem('hr_monitor_drive_sync') !== '0'; } catch (e) { return true; }
  }
  function marksChanged() {
    marksVersion++;
    const st = marksPage ? marksPage.drive.status() : null;
    cloud.marks = !!(st && st.dirty && st.locks && !st.blocked && marksCanSync());
    paintCloud();
  }
  // After driveSync resolves, never inside it; a failure here never reaches the sync result.
  async function marksSyncPass() {
    if (!marksPage) return false;
    try {
      const r = await marksPage.drive.sync();
      return !!(r && r.changed);
    } catch (e) {
      console.warn('[marks] sync failed', e && e.message);
      return false;
    }
  }
  // Minutes on a view's axis start at its origin: the day window, or the recording's first epoch.
  function marksScope(s) {
    if (s.__virtualDay) {
      const w = dayWindow(s.__virtualDay);
      return { originEp: w.start, fromEp: w.start, toEp: w.end };
    }
    let origin = null;
    for (const p of (s.hr || [])) if (p && p.ep != null && Number.isFinite(p.t)) { origin = p.ep - p.t * 60000; break; }
    if (origin == null) origin = sessionStartEpoch(s, parseSessionFilename(s.filename || ''));
    return { originEp: origin, fromEp: origin, toEp: origin + (s.duration || 0) * 60000 };
  }
  // The events and sleep windows a view shows: reversed rows hidden, viewer marks added.
  function viewMarks(s) {
    const raw = (s && s.events) || [];
    if (!marksPage || !s) return { events: raw, sleep: [], hidden: 0 };
    // Another account signed in: records() is empty, so none of the stored marks apply.
    const blocked = marksPage.drive.status().blocked;
    const hit = marksMemo.get(s);
    if (hit && hit.v === marksVersion && hit.raw === raw && hit.blocked === blocked) return hit.out;
    const out = AortiMarks.applyMarks(raw, marksPage.drive.records(), marksScope(s));
    marksMemo.set(s, { v: marksVersion, raw, blocked, out });
    return out;
  }

  // Auto-poll Drive while an in-session view is open. driveSync already
  // skips unchanged files via modifiedTime, so repeat polls are cheap.
  // Lets the user open a session that's still being recorded on the phone
  // and watch it update without manually tapping Sync. Stops on route out.
  let autoPollTimer = null;
  const AUTO_POLL_INTERVAL_MS = 60000;
  function startAutoPoll() {
    clearAutoPoll();
    autoPollTimer = setInterval(() => {
      autoPollTick().catch(e => console.warn('[auto-poll] failed', e));
    }, AUTO_POLL_INTERVAL_MS);
  }
  // Drive first, then the phone's recent hours (the open hour in the app); at most one reload per tick.
  let autoPollBusy = false;
  async function autoPollTick() {
    if (autoPollBusy) return;
    autoPollBusy = true;
    try {
      let reload = false;

          if (r && r.changed) reload = true;
        } catch (e) { console.warn('[auto-poll] driveSync failed', e); }

    } finally {
      autoPollBusy = false;
    }
  }
  function clearAutoPoll() {
    if (autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer = null; }
  }

  // Posture + sleep overrides — stored per session in localStorage so the user can
  // correct bad data in the viewer without rewriting the CSV.
  function loadOverrides() {
    try { return JSON.parse(localStorage.getItem('hrv_viewer_overrides') || '{}'); } catch (e) { return {}; }
  }
  function saveOverrides(o) { try { localStorage.setItem('hrv_viewer_overrides', JSON.stringify(o)); } catch (e) {} }
  function getOverride(filename, key) {
    const all = loadOverrides();

  }
  function setOverride(filename, key, value) {
    const all = loadOverrides();

  }

  function getEffectivePostureSpans(s) {
    const override = currentSummary && getOverride(currentSummary.filename, 'posture');
    if (override) return override;
    return s.postureSpans;
  }

  function getEffectiveSleepWindows(s) {
    const override = currentSummary && getOverride(currentSummary.filename, 'sleep');
    const base = override || s.sleepWindows;

  // Auto-detect sleep windows: sustained >=30 min of low HR + high RMSSD.
  // "Low HR" = within 5 bpm of the session's resting baseline (or bottom quartile).
  // "High RMSSD" = above the session median.
  function detectSleepWindows(s, hrSeries, rmssdSeries) {
    if (!hrSeries || !hrSeries.length || !rmssdSeries || !rmssdSeries.length) return [];
    // Math.min(...arr.map(...)) on a long-session series spreads thousands of
    // arguments per call. Manual reduction is allocation-free and skips the
    // null gap markers that would otherwise coerce to 0 and corrupt restBase.
    let computedMin = Infinity;
    for (const p of hrSeries) {
      const v = p.v;
      if (v == null || isNaN(v)) continue;
      if (v < computedMin) computedMin = v;
    }
    const restBase = s.restingHR || (isFinite(computedMin) ? computedMin : 0);
    const rmssdVals = rmssdSeries.map(p => p.v).sort((a, b) => a - b);
    const rmssdMedian = rmssdVals[Math.floor(rmssdVals.length / 2)];
    // Walk samples; a sample "looks like sleep" if HR <= restBase+5 AND RMSSD >= median.
    // Match RMSSD to HR by nearest-time.
    let rmIdx = 0;
    const spans = [];
    let cur = null;
    for (const p of hrSeries) {
      while (rmIdx + 1 < rmssdSeries.length && Math.abs(rmssdSeries[rmIdx + 1].t - p.t) <= Math.abs(rmssdSeries[rmIdx].t - p.t)) rmIdx++;
      const rmVal = rmssdSeries[rmIdx] ? rmssdSeries[rmIdx].v : null;
      const isSleep = p.v <= restBase + 5 && rmVal != null && rmVal >= rmssdMedian;
      if (isSleep) {
        if (!cur) cur = { start: p.t, end: p.t };
        else cur.end = p.t;
      } else if (cur) {
        if (cur.end - cur.start >= 30) spans.push(cur);
        cur = null;
      }
    }
    if (cur && cur.end - cur.start >= 30) spans.push(cur);
    // Keep longest only (per user request — single dominant sleep window)
    spans.sort((a, b) => (b.end - b.start) - (a.end - a.start));
    return spans.length ? [spans[0]] : [];
  }

  // Noteworthy-moments detector — surface windows where HR or HRV sustained a
  // meaningful departure from the session's own baseline. Purely statistical:
  // we take the session-wide median + MAD (median absolute deviation, which is
  // robust to outliers) and flag windows where the rolling median is >kMad
  // standard-ish units away, with a floor so trivial shifts don't trigger.
  //
  // Returns up to 5 windows: { start, end, kind, metric, sessionMedian,
  // windowMedian, delta, direction } sorted by |delta| desc. `kind` is 'hr_low'
  // / 'hr_high' / 'hrv_low' / 'hrv_high' so the report can speak about each
  // deviation in the appropriate direction.
  function detectNoteworthyMoments(hrSeries, rmssdSeries) {
    const out = [];
    if (!hrSeries || hrSeries.length < 20) return out;
    // K_MAD was 1.5 — too loose. At 1.5 MADs, any sleep-vs-wake comparison
    // on an overnight session is statistically "noteworthy" and the top-5
    // list reads as "you were asleep between X and Y." 2.5 is the standard
    // robust-z significance threshold and surfaces real excursions only.
    // HR / HRV floors also raised so drifts that are within normal
    // physiological range don't reach the report.
    const WINDOW_MIN = 3;             // rolling-window length (minutes)
    const MIN_HR_DELTA = 15;          // floor in bpm (was 10)
    const MIN_RMSSD_DELTA_PCT = 0.45; // floor for HRV deviations (was 0.35)
    const K_MAD = 2.5;                // robust-z threshold (was 1.5)
    const seriesScan = (series, key, minDelta, minDeltaIsPct) => {
      if (!series || series.length < 20) return;
      const vals = series.map(p => p.v).filter(v => isFinite(v));
      if (!vals.length) return;
      const median = medianOf(vals);
      const mad = medianOf(vals.map(v => Math.abs(v - median))) || 1;
      const windows = [];
      let cur = null;
      for (let i = 0; i < series.length; i++) {
        // Walk a rolling-median over a WINDOW_MIN-long tail ending at series[i].
        const endT = series[i].t;
        const startT = endT - WINDOW_MIN;
        // Find a reasonable slice — binary search would be faster but the data
        // size here is small enough that a linear scan is clearer to read.
        let j = i;
        while (j > 0 && series[j - 1].t >= startT) j--;
        if (i - j < 10) continue; // need enough samples for a stable median
        const sliceVals = [];
        for (let k = j; k <= i; k++) sliceVals.push(series[k].v);
        const wMedian = medianOf(sliceVals);
        const diff = wMedian - median;
        const absDiff = Math.abs(diff);
        const zish = absDiff / mad; // rough robust-z
        const floor = minDeltaIsPct ? Math.max(minDelta * median, 1) : minDelta;
        const significant = zish >= K_MAD && absDiff >= floor;
        if (significant) {
          const direction = diff > 0 ? 'high' : 'low';
          if (cur && cur.direction === direction) {
            cur.end = endT;
            cur.windowMedian = wMedian; // update to most recent
            if (absDiff > Math.abs(cur.delta)) cur.delta = diff;
          } else {
            if (cur) windows.push(cur);
            cur = { start: startT, end: endT, direction, delta: diff, sessionMedian: median, windowMedian: wMedian, metric: key };
          }
        } else if (cur) {
          windows.push(cur);
          cur = null;
        }
      }
      if (cur) windows.push(cur);
      // Merge: drop windows shorter than 90 sec (too fleeting to surface).
      for (const w of windows) {
        if (w.end - w.start < 1.5) continue;
        out.push(Object.assign({ kind: key + '_' + w.direction }, w));
      }
    };
    seriesScan(hrSeries, 'hr', MIN_HR_DELTA, false);
    seriesScan(rmssdSeries, 'hrv', MIN_RMSSD_DELTA_PCT, true);
    // Rank by largest |delta| relative to baseline (percent), keep top 5.
    out.sort((a, b) => Math.abs(b.delta / b.sessionMedian) - Math.abs(a.delta / a.sessionMedian));
    return out.slice(0, 5);
  }
  function medianOf(values) {
    const s = values.slice().sort((a, b) => a - b);
    const n = s.length;
    if (!n) return 0;
    return n % 2 ? s[(n - 1) >> 1] : (s[n / 2 - 1] + s[n / 2]) / 2;
  }

  function sameWindows(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    return a.every((w, i) => w === b[i] || JSON.stringify(w) === JSON.stringify(b[i]));
  }
  function wireChillsSlider() {
    const slider = document.getElementById('chills-tune-slider');
    const label = document.getElementById('chills-tune-value');
    if (!slider || !label) return;
    // Detector returns ALL candidate events (using permissive defaults baked
    // into detectChillsWindows). The slider then filters that pool by each
    // event's `ratio` field — guaranteed to scale visible count even on
    // sessions where every event is intense enough to pass the gates.
    // detectChillsWindows expects {t,v} (summary shape); currentData uses
    // {x,y,ep} (loadFullSession shape).
    const toDetectorShape = (arr) => (arr || []).map(p => ({ t: p.x, v: p.y }));
    const filterByRatio = (events, threshold) =>
      (events || []).filter(e => (typeof e.ratio === 'number' ? e.ratio : Infinity) >= threshold);
    const saved = parseFloat(localStorage.getItem('hrv_viewer_chills_ratio') || '2.5');
    slider.value = saved;
    label.textContent = saved.toFixed(1) + '×';
    if (currentData && currentSummary) {
      // One candidate pool per data object; the slider filters it. Ratio 1.0 keeps the gate permissive.
      if (currentSummary._chillsFor !== currentData) {
        currentSummary._chillsAll = detectChillsWindows(toDetectorShape(currentData.hr), 1.0, toDetectorShape(currentData.rmssd));
        currentSummary._chillsFor = currentData;
      }
      const shown = currentSummary.chillsWindows;
      currentSummary.chillsWindows = filterByRatio(currentSummary._chillsAll, saved);
      if (!sameWindows(shown, currentSummary.chillsWindows)) {
        renderInsight(currentSummary);
        renderMarkerList(currentSummary);
        drawSessionChart(currentSummary, currentData);
      }
    }
    let debounce;
    slider.addEventListener('input', () => {
      const v = parseFloat(slider.value);
      label.textContent = v.toFixed(1) + '×';
      localStorage.setItem('hrv_viewer_chills_ratio', v.toString());
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        if (!currentSummary || !currentSummary._chillsAll) return;
        currentSummary.chillsWindows = filterByRatio(currentSummary._chillsAll, v);
        renderInsight(currentSummary);
        renderMarkerList(currentSummary);
        drawSessionChart(currentSummary, currentData);
      }, 80);
    });
  }

  // ===== Tag management (localStorage-backed, per-session) =====
  function loadTags() {
    try { return JSON.parse(localStorage.getItem('hrv_viewer_tags') || '{}'); } catch (e) { return {}; }
  }
  function saveTags(all) {
    try { localStorage.setItem('hrv_viewer_tags', JSON.stringify(all)); } catch (e) {}
  }
  function renderTagsChips(filename) {
    const all = loadTags();
    const mine = all[filename] || [];
    const container = document.getElementById('tags-current');
    container.innerHTML = mine.map(t => `<span class="chip-removable" data-tag="${escape(t)}">${escape(t)}<button type="button" class="tag-x" data-remove="${escape(t)}" aria-label="Remove ${escape(t)}">${UI.icon('close')}</button></span>`).join('');
    container.querySelectorAll('.tag-x').forEach(x => {
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        const t = x.dataset.remove;
        const all = loadTags();
        all[filename] = (all[filename] || []).filter(tag => tag !== t);
        saveTags(all);
        renderTagsChips(filename);
      });
    });
  }
  function addTag(filename, tag) {
    tag = tag.trim();
    if (!tag) return;
    const all = loadTags();
    if (!all[filename]) all[filename] = [];
    if (!all[filename].includes(tag)) all[filename].push(tag);
    saveTags(all);
    renderTagsChips(filename);
  }
  function wireTags(filename) {
    renderTagsChips(filename);
    const input = document.getElementById('tag-input');
    input.value = '';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { addTag(filename, input.value); input.value = ''; }
    });
  }

  function resizeAllViewerCharts() {
    // Force every Chart.js instance in the page to pick up its new container size.
    try { if (currentChart) currentChart.resize(); } catch(e) {}
    try { if (currentStrip) currentStrip(); } catch(e) {}
    // Chart.js registry holds refs to every active chart — resize them all.
    if (Chart && Chart.instances) {
      for (const id of Object.keys(Chart.instances)) {
        try { Chart.instances[id].resize(); } catch (e) {}
      }
    }
  }

  // ===== Day report (S44) BEGIN =====
  // REPORT-SPEC page 1 plus moment pages two per page, built from the Day view's memoised day (buildDaySession), never a
  // re-parse. Sleep is not validated (S13), so one Whole day column; gap causes wait for S14, so gaps list times only.
  // Web prints the pages (the browser saves a PDF); the app draws the same pages to canvases for native-pdf.js.
  const RPT_ZONES = [70, 90, 110, 130];
  const RPT_ZC = ['var(--rp-z1)', 'var(--rp-z2)', 'var(--rp-z3)', 'var(--rp-z4)', 'var(--rp-z5)'];
  const RPT_DIGIT_Y = 0.33; // SVG digit baseline offset as a share of font size (mocks/report.js, measured from pixels)
  const RPT_W = 688;
  let rptUid = 0;

  function rptPad(n) { return (n < 10 ? '0' : '') + n; }
  function rptEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function rptDur(min) { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? h + ' h' + (m ? ' ' + m + ' min' : '') : m + ' min'; }
  function rptPlural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  // Colours that are tokens go to style, so SVG resolves var() everywhere, rasterised pages included.
  function rptEl(tag, attrs, inner) {
    let s = '<' + tag, style = '';
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (typeof v === 'string' && v.startsWith('var(') && (k === 'fill' || k === 'stroke' || k === 'stop-color')) style += k + ':' + v + ';';
      else s += ' ' + k + '="' + v + '"';
    }
    if (style) s += ' style="' + style + '"';
    return s + (inner == null ? '/>' : '>' + inner + '</' + tag + '>');
  }
  // The person's line prints only when they set it (Settings > Thresholds); unset lines do not print.
  function rptLine() {
    try {
      const saved = JSON.parse(localStorage.getItem(LS_QUADRANT_THRESH) || 'null');
      if (saved && saved.customized && Number.isFinite(QUADRANT_THRESH.hrHigh)) return QUADRANT_THRESH.hrHigh;
    } catch (e) {}
    return null;
  }

  // The day the report covers: the Day view's day, a recording's start day, otherwise the latest day with data.
  function rptDayIso() {
    const { view, arg } = parseHash();
    if (view === 'day' && arg && sessionsByDate[arg]) return arg;
    if (view === 'session' && arg && sessionsIndex[arg] && sessionsIndex[arg].startEpoch) {
      const k = sessionLocalDateKey(sessionsIndex[arg], parseSessionFilename(arg));
      if (sessionsByDate[k]) return k;
    }
    const keys = Object.keys(sessionsByDate).filter(k => (sessionsByDate[k] || []).length).sort();
    return keys.length ? keys[keys.length - 1] : null;
  }

  // Minute bins of a {x, y} series over the day.
  function rptBin(points, n) {
    const sum = new Array(n).fill(0), cnt = new Array(n).fill(0);
    for (const p of points || []) {
      if (!p || p.y == null || !isFinite(p.y) || !isFinite(p.x)) continue;
      const i = Math.floor(p.x);
      if (i < 0 || i >= n) continue;
      sum[i] += p.y; cnt[i]++;
    }
    return sum.map((s, i) => cnt[i] ? s / cnt[i] : null);
  }
  function rptAt(arr, m, reach) {
    m = Math.round(m);
    for (let d = 0; d <= (reach || 0); d++) {
      if (arr[m + d] != null) return Math.round(arr[m + d]);
      if (d && arr[m - d] != null) return Math.round(arr[m - d]);
    }
    return null;
  }
  function rptMean(arr, a, b) { let s = 0, n = 0; for (let m = Math.max(0, a); m <= Math.min(arr.length - 1, b); m++) if (arr[m] != null) { s += arr[m]; n++; } return n ? s / n : null; }
  function rptMedian(vals) { const s = vals.slice().sort((p, q) => p - q), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; }
  function rptWindow(d, a, b) {
    let peak = null, low = null, lowHrv = null;
    for (let m = Math.max(0, a); m <= Math.min(d.n - 1, b); m++) {
      const v = d.hr[m], w = d.hrv[m];
      if (v != null) { if (!peak || v > peak.v) peak = { m, v: Math.round(v) }; if (!low || v < low.v) low = { m, v: Math.round(v) }; }
      if (w != null && (!lowHrv || w < lowHrv.v)) lowHrv = { m, v: Math.round(w) };
    }
    return { peak, low, lowHrv };
  }

  // Everything the report prints for one day, from the memoised Day build plus marks.
  async function rptModel(iso) {
    const summary = await buildDaySession(iso);
    const entry = virtualSessions['day:' + iso];
    if (!summary || !entry) return null;
    // The Day build's own window: every point carries x = minutes from the day start and its epoch.
    const p0 = (entry.data.hr || []).find(p => p && p.ep != null && isFinite(p.x));
    if (!p0) return null;
    const dayStart = Math.round(p0.ep - p0.x * 60000), n = Math.round(summary.duration), dayEnd = dayStart + n * 60000;
    const d = { iso, n, dayStart, dayEnd, summary, line: rptLine(), personal: isAutonomicOn() };
    d.hr = rptBin(entry.data.hr, n);
    d.hrv = rptBin(entry.data.rmssd, n);
    for (const g of summary.connGaps || []) for (let m = Math.ceil(g.start); m < Math.floor(g.end); m++) if (m >= 0 && m < n) { d.hr[m] = null; d.hrv[m] = null; }
    d.clock = (m) => { if (m >= n) return '24:00'; const t = new Date(dayStart + Math.round(m) * 60000); return rptPad(t.getHours()) + ':' + rptPad(t.getMinutes()); };

    d.first = d.hr.findIndex(v => v != null);
    d.last = d.hr.length - 1 - d.hr.slice().reverse().findIndex(v => v != null);
    d.gaps = (summary.connGaps || []).filter(g => g.end - g.start >= 1 && g.end > d.first && g.start < d.last).map(g => [Math.max(0, g.start), Math.min(n, g.end)]);
    const files = (summary.__sourceFiles || []).map(fn => sessionsIndex[fn]).filter(Boolean);
    d.beganBefore = files.filter(s => s.startEpoch && s.startEpoch < dayStart).map(s => s.startEpoch).sort((p, q) => p - q)[0] || null;
    d.runsOn = files.some(s => s.startEpoch && s.duration && s.startEpoch + s.duration * 60000 > dayEnd + 60000);
    // Marks: symptom taps are moments, context and note marks are ticks.
    d.taps = []; d.ticks = [];
    for (const e of viewMarks(summary).events || []) {
      if (!isFinite(e.t) || e.t < 0 || e.t >= n) continue;
      const pm = parseMark(e.label);
      if (pm.kind === 'symptom') d.taps.push({ m: Math.round(e.t), kind: 'Symptom', label: pm.label });
      else d.ticks.push({ m: Math.round(e.t), word: (pm.label || 'Note').toLowerCase() });
    }
    // Standing taps: the posture log's switches to standing; a span clipped at the day start is not a tap.
    const spans = (summary.postureSpans || []).slice().sort((p, q) => p.start - q.start);
    spans.forEach((sp, i) => {
      if (sp.posture !== 'standing' || sp.start < 0.5 || sp.start >= n) return;
      const prev = spans[i - 1];
      if (!prev || prev.posture === 'standing' || sp.start - prev.end > 1) return;
      d.taps.push({ m: Math.min(n - 1, Math.round(sp.start)), kind: 'Standing', from: prev.posture });
    });
    d.taps.sort((p, q) => p.m - q.m);
    d.moments = rptMoments(d);
    return d;
  }

  function rptStanding(d, t) {
    const b0 = rptMean(d.hr, t - 5, t - 1), base = b0 != null ? Math.round(b0) : rptAt(d.hr, t, 2);
    const baseHrv = rptMean(d.hrv, t - 5, t - 1);
    const w = rptWindow(d, t, t + 10);
    const at = (k) => rptAt(d.hr, t + k, 1);
    let held = 0;
    if (base != null) for (let k = 1; k <= 10; k++) { const v = d.hr[Math.round(t) + k]; if (v != null && v - base >= 30) held++; }
    let end = null;
    if (w.peak && base != null) for (let m = w.peak.m + 1; m < Math.min(d.n, t + 90); m++) if (d.hr[m] != null && d.hr[m] <= base + 10) { end = { m, v: Math.round(d.hr[m]) }; break; }
    return { t, base, baseHrv: baseHrv == null ? null : Math.round(baseHrv), r1: at(1), r3: at(3), r5: at(5), r10: at(10), peak: w.peak, lowHrv: w.lowHrv, held, met: held > 0, end };
  }

  // Slots per REPORT-SPEC: up to 2 Standing, up to 2 Symptom (largest HR change), 1 Rise or Above line; Calm waits for
  // validated sleep. Overlaps merge; page slots go Symptom and Standing first, cap 6; numbers follow time.
  function rptMoments(d) {
    const list = [];
    d.taps.map(t => t.kind === 'Standing' ? { a: t.m - 5, b: t.m + 10, t: t.m, taps: [t] } : { a: t.m - 10, b: t.m + 20, t: t.m, taps: [t] })
      .sort((p, q) => p.a - q.a).forEach(w => {
        const last = list[list.length - 1];
        if (last && w.a <= last.b) { last.b = Math.max(last.b, w.b); last.taps.push(...w.taps); last.t = Math.min(last.t, w.t); }
        else list.push(w);
      });
    const free = (a, b) => !list.some(x => x.a <= b && a <= x.b);
    if (d.line != null) {
      let best = null, s = -1;
      for (let m = 0; m <= d.n; m++) {
        const up = m < d.n && d.hr[m] != null && d.hr[m] > d.line;
        if (up && s < 0) s = m;
        if (!up && s >= 0) { if (m - s >= 10 && (!best || m - s > best.e - best.s)) best = { s, e: m }; s = -1; }
      }
      const b1 = best ? Math.min(best.e + 20, best.s + 110) : 0;
      if (best && free(best.s - 10, b1)) list.push({ kind: 'Above line', s: best.s, e: best.e, t: best.s, a: best.s - 10, b: b1, taps: [] });
    }

      const rises = (d.summary.hrDeltas || []).filter(h => h.direction === 'rise' && h.start >= 0 && h.start < d.n && free(h.start - 10, h.start + 20))
        .sort((p, q) => q.delta - p.delta || p.start - q.start);
      if (rises[0]) list.push({ kind: 'Rise', t: rises[0].start, a: rises[0].start - 10, b: rises[0].start + 20, taps: [] });
    }
    list.forEach(x => {
      x.a = Math.max(0, Math.round(x.a)); x.b = Math.min(d.n - 1, Math.round(x.b));
      x.taps.sort((p, q) => p.m - q.m);
      if (!x.kind) x.kind = [...new Set(x.taps.map(t => t.kind))].join(' · ');
      x.slot = x.taps.some(t => t.kind === 'Symptom') ? 'Symptom' : x.taps.some(t => t.kind === 'Standing') ? 'Standing' : 'RS';
      rptDescribe(d, x);
    });
    const cap = { Standing: 2, Symptom: 2, RS: 1 };
    const rank = { Symptom: 0, Standing: 0, RS: 1 };
    const pick = list.slice().sort((p, q) => rank[p.slot] - rank[q.slot] || q.change - p.change || p.t - q.t);

  // Page 1 chart: HR zone-coloured, HRV dashed beneath, one clock axis, gaps hatched, the person's line if set.
  function rptDayChart(d, listed) {

    if (rest.length) {
      const byKind = {};
      rest.forEach(x => { (byKind[x.kind] = byKind[x.kind] || []).push(d.clock(x.t)); });
      h += '<p class="more">Also on this day: ' + Object.keys(byKind).map(k => k.toLowerCase() + ' at ' + byKind[k].join(', ')).join('; ') + '.</p>';
    }
    // One Whole day column: sleep is not validated yet (S13), so no Awake and Asleep split.
    const vals = d.hr.filter(v => v != null), hv = d.hrv.filter(v => v != null);
    let lo = null, hi = null;
    d.hr.forEach((v, m) => { if (v == null) return; if (!lo || v < lo.v) lo = { m, v }; if (!hi || v > hi.v) hi = { m, v }; });
    const above = d.line != null ? vals.filter(v => v > d.line).length : null;
    h += '<h2 class="sec">Summary</h2><table class="t sum"><thead><tr><th></th><th class="r">Whole day</th></tr></thead><tbody>' +
      '<tr><td>Recorded</td><td class="r num">' + rptDur(d.recorded) + '</td></tr>' +
      (lo ? '<tr><td>Lowest, bpm</td><td class="r num">' + Math.round(lo.v) + ' <span class="dim">at ' + d.clock(lo.m) + '</span></td></tr>' : '') +
      (vals.length ? '<tr><td>Typical (median), bpm</td><td class="r num">' + Math.round(rptMedian(vals)) + '</td></tr>' : '') +
      (hi ? '<tr><td>Highest, bpm</td><td class="r num">' + Math.round(hi.v) + ' <span class="dim">at ' + d.clock(hi.m) + '</span></td></tr>' : '') +
      (above != null ? '<tr><td>Above your line, ' + d.line + ' bpm</td><td class="r num">' + rptDur(above) + (vals.length ? ' <span class="dim">' + Math.round(above / vals.length * 100) + '%</span>' : '') + '</td></tr>' : '') +
      (hv.length ? '<tr><td>HRV typical (median), ms</td><td class="r num">' + Math.round(rptMedian(hv)) + '</td></tr>' : '') +
      '</tbody></table>';
    const met = stands.some(x => x.stand.met);
    const note = d.personal && met ? '<sup>1</sup> Adult POTS heart rate rule: a rise of 30 bpm or more within 10 min of standing.' : null;
    return h + rptFoot(note);
  }

  function rptLocator(d, x) {
    const W = RPT_W, G = 30, PW = W - G - 4, xOf = (m) => G + m / d.n * PW, hid = 'rlx' + (++rptUid);
    let s = '<defs>' + rptHatch(hid) + '</defs>';
    s += rptEl('rect', { x: G, y: 2, width: PW, height: 10, fill: 'var(--rp-paper)', stroke: 'var(--rp-rule)', 'stroke-width': 0.75 });
    rptGapsAll(d).forEach(g => { s += rptEl('rect', { x: xOf(g[0]).toFixed(1), y: 2, width: Math.max(2, xOf(g[1]) - xOf(g[0])).toFixed(1), height: 10, fill: 'url(#' + hid + ')' }); });
    const x0 = xOf(x.a), w = Math.max(4, xOf(x.b) - x0);
    s += rptEl('rect', { x: x0.toFixed(1), y: 0, width: w.toFixed(1), height: 14, fill: 'var(--rp-ink)', 'fill-opacity': 0.12, stroke: 'var(--rp-ink)', 'stroke-width': 1.5 });
    rptHourTicks(d, 6).forEach(m => { s += rptEl('text', { x: xOf(m).toFixed(1), y: 24, 'text-anchor': m === 0 ? 'start' : m === d.n ? 'end' : 'middle', class: 'ax' }, d.clock(m)); });
    s += rptEl('text', { x: G - 4, y: 11, 'text-anchor': 'end', class: 'ax' }, '24 h');
    return '<svg width="' + W + '" height="28" viewBox="0 0 ' + W + ' 28" role="img" aria-label="Window in the day">' + s + '</svg>';
  }

  function rptMomentChart(d, x, ax) {
    const W = RPT_W, G = 30, PW = W - G - 4, a = x.a, b = x.b, xOf = (m) => G + (m - a) / Math.max(1, b - a) * PW;
    const hrT = 20, hrH = 136, hrB = hrT + hrH, vT = hrB + 8, vH = 46, vB = vT + vH, H = vB + 18;
    const yOf = (v) => hrB - (v - ax.bot) / (ax.top - ax.bot) * hrH, vOf = (v) => vB - Math.min(v, ax.vtop) / ax.vtop * vH;
    const gid = 'rmg' + (++rptUid), hid = 'rmh' + rptUid;
    let s = '<defs>' + rptZoneGrad(gid, yOf) + rptHatch(hid) + '</defs>';
    if (x.kind === 'Above line') {
      const s0 = Math.max(a, x.s), s1 = Math.min(b, x.e);
      if (s1 > s0) s += rptEl('rect', { x: xOf(s0).toFixed(1), y: hrT, width: (xOf(s1) - xOf(s0)).toFixed(1), height: hrH, fill: 'none', stroke: 'var(--rp-ink-3)', 'stroke-width': 0.75, 'stroke-dasharray': '2 2' });
    }
    rptGapsAll(d).forEach(g => { const g0 = Math.max(a, g[0]), g1 = Math.min(b, g[1]); if (g1 > g0) s += rptEl('rect', { x: xOf(g0).toFixed(1), y: hrT, width: (xOf(g1) - xOf(g0)).toFixed(1), height: hrH, fill: 'url(#' + hid + ')' }); });
    const ticks = []; for (let v = Math.ceil((ax.bot + 1) / 20) * 20; v < ax.top; v += 20) ticks.push(v);
    ticks.forEach(v => { s += rptEl('line', { x1: G, x2: G + PW, y1: yOf(v).toFixed(1), y2: yOf(v).toFixed(1), stroke: 'var(--rp-grid)', 'stroke-width': 0.75 }); });
    ticks.concat([ax.top]).forEach(v => { s += rptEl('text', { x: G - 4, y: (yOf(v) + 3).toFixed(1), 'text-anchor': 'end', class: 'ax' }, v); });
    s += rptEl('text', { x: G - 4, y: hrB + 3, 'text-anchor': 'end', class: 'ax' }, 'bpm');
    rptHrvTicks(ax.vtop).forEach(v => { s += rptEl('line', { x1: G, x2: G + PW, y1: vOf(v), y2: vOf(v), stroke: 'var(--rp-grid)', 'stroke-width': 0.75 }); s += rptEl('text', { x: G - 4, y: vOf(v) + 3, 'text-anchor': 'end', class: 'ax' }, v); });
    s += rptEl('text', { x: G - 4, y: vB + 3, 'text-anchor': 'end', class: 'ax' }, 'ms');
    s += rptEl('rect', { x: G, y: hrT, width: PW, height: hrH, fill: 'none', stroke: 'var(--rp-rule)', 'stroke-width': 0.75 });
    s += rptEl('rect', { x: G, y: vT, width: PW, height: vH, fill: 'none', stroke: 'var(--rp-rule)', 'stroke-width': 0.75 });
    rptTrace(d.hrv, a, b, xOf, vOf).forEach(p => { s += rptEl('path', { d: p, fill: 'none', stroke: 'var(--rp-hrv)', 'stroke-width': 1.1, 'stroke-dasharray': '3 2' }); });
    rptTrace(d.hr, a, b, xOf, yOf).forEach(p => { s += rptEl('path', { d: p, fill: 'none', stroke: 'url(#' + gid + ')', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }); });
    if (d.line != null && d.line > ax.bot && d.line < ax.top) {
      s += rptEl('line', { x1: G, x2: G + PW, y1: yOf(d.line).toFixed(1), y2: yOf(d.line).toFixed(1), stroke: 'var(--rp-ink)', 'stroke-width': 0.9, 'stroke-dasharray': '4 3' });
      s += rptLabelBox(G + 6, yOf(d.line) - 3, 'Your line ' + d.line, 'start');
    }
    s += rptEl('rect', { x: G + 1, y: vT + 1, width: 74, height: 12, fill: 'var(--rp-paper)', 'fill-opacity': 0.85 }) + rptEl('text', { x: G + 4, y: vT + 10, class: 'ax-b' }, 'HRV (RMSSD)');
    const mk = d.taps.filter(t => t.m >= a && t.m <= b).map(t => ({ m: t.m, kind: t.kind })).concat(d.ticks.filter(c => c.m >= a && c.m <= b).map(c => ({ m: c.m, kind: 'ctx', word: c.word })));
    let lastX = -999;
    mk.sort((p, q) => p.m - q.m).forEach(q => {
      const px = xOf(q.m);
      s += rptEl('line', { x1: px.toFixed(1), x2: px.toFixed(1), y1: hrT, y2: hrB, stroke: 'var(--rp-hatch)', 'stroke-width': 0.75, 'stroke-dasharray': '1 2' });
      if (q.kind === 'Symptom') s += rptDiamond(px, 9, 4.5); else if (q.kind === 'Standing') s += rptSquare(px, 9, 3.6); else s += rptEl('line', { x1: px.toFixed(1), x2: px.toFixed(1), y1: 4, y2: 14, stroke: 'var(--rp-ink)', 'stroke-width': 1.25 });
      if (px - lastX > 70) { s += rptEl('text', { x: (px + 7).toFixed(1), y: 12, class: 'callout' }, rptEsc(q.kind === 'ctx' ? q.word : q.kind + ' ' + d.clock(q.m))); lastX = px; }
    });
    const startM = x.stand ? x.stand.t : (x.s != null ? x.s : x.t);
    const standEnd = x.stand && x.stand.end && x.stand.end.m <= b;
    const endM = standEnd ? x.stand.end.m : x.back != null && x.back <= b ? x.back : null;
    const pts = [];
    if (x.start != null) pts.push({ m: startM, v: d.hr[Math.round(startM)] != null ? d.hr[Math.round(startM)] : x.start, t: 'start ' + x.start, dy: 14 });
    if (x.peak && x.peak.v != null) pts.push({ m: x.peak.m, v: x.peak.v, t: 'peak ' + x.peak.v + ' at ' + d.clock(x.peak.m), dy: -7 });
    if (endM != null && d.hr[endM] != null) pts.push({ m: endM, v: d.hr[endM], t: standEnd ? 'end of rise ' + Math.round(d.hr[endM]) + ' at ' + d.clock(endM) : 'under ' + d.line + ' at ' + d.clock(endM), dy: -7 });
    pts.forEach(p => {
      if (p.m < a || p.m > b) return;
      const px = xOf(p.m), py = yOf(p.v);
      s += rptEl('circle', { cx: px.toFixed(1), cy: py.toFixed(1), r: 2.6, fill: 'var(--rp-paper)', stroke: 'var(--rp-ink)', 'stroke-width': 1.25 });
      s += rptLabelBox(px, py + p.dy, p.t, px > G + PW - 90 ? 'end' : px < G + 40 ? 'start' : 'middle');
    });
    const step = b - a > 60 ? 15 : b - a > 45 ? 10 : 5;
    for (let m = Math.ceil(a / step) * step; m <= b; m += step) {
      const px = xOf(m);
      s += rptEl('line', { x1: px.toFixed(1), x2: px.toFixed(1), y1: vB, y2: vB + 3, stroke: 'var(--rp-ink-3)', 'stroke-width': 0.75 });
      s += rptEl('text', { x: px.toFixed(1), y: vB + 13, 'text-anchor': px > G + PW - 14 ? 'end' : px < G + 14 ? 'start' : 'middle', class: 'ax' }, d.clock(m));
    }
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Moment ' + x.n + '">' + s + '</svg>';
  }

  function rptTimeline(d, x) {
    const rows = [];
    if (x.start != null) rows.push([x.t, 'HR ' + x.start + (x.startHrv != null ? ' · HRV ' + x.startHrv + ' ms' : '')]);
    if (x.peak.v != null && x.peak.m !== x.t) {
      const drop = x.startHrv && x.lowHrv.v != null ? Math.round((x.startHrv - x.lowHrv.v) / x.startHrv * 100) : null;
      const hrvBit = x.lowHrv.m === x.peak.m && drop != null && drop > 0 ? ' · HRV ' + x.lowHrv.v + ' ms, down ' + drop + '%' : '';
      rows.push([x.peak.m, 'Peak ' + x.peak.v + ' bpm, up ' + (x.peak.v - (x.start || x.peak.v)) + hrvBit]);
      if (x.lowHrv.m !== x.peak.m && drop != null && drop > 0) rows.push([x.lowHrv.m, 'HRV ' + x.lowHrv.v + ' ms, down ' + drop + '%']);
    }
    if (x.back != null && x.back <= x.b + 30) rows.push([x.back, 'Under ' + d.line + ' bpm']);
    x.taps.filter(t => t.kind === 'Symptom').forEach(t => rows.push([t.m, 'Symptom tap']));
    d.ticks.forEach(c => { if (c.m >= x.a && c.m <= x.b) rows.push([c.m, rptEsc(c.word.charAt(0).toUpperCase() + c.word.slice(1))]); });
    rows.sort((p, q) => p[0] - q[0]);
    return '<div class="timeline">' + rows.map(r => '<span class="tm">' + d.clock(r[0]) + '</span><span>' + r[1] + '</span>').join('') + '</div>';
  }

  function rptMomentBlock(d, x, ax) {
    let h = '<div class="moment" data-n="' + x.n + '">';
    h += '<div class="mhead">' + rptMn(x.n, { big: true }) + '<span class="kind">' + rptEsc(x.kind) + '</span><span class="when">' + x.when + '</span><a class="back" href="#rpg1">Page 1</a></div>';
    const sub = x.taps.map(t => t.kind + ' tap ' + d.clock(t.m));
    sub.push('Window ' + d.clock(x.a) + ' to ' + d.clock(x.b));
    h += '<p class="msub">' + sub.join(' · ') + '</p>';
    h += '<div class="chart">' + rptLocator(d, x) + '</div><div class="chart" style="margin-top:4px">' + rptMomentChart(d, x, ax) + '</div>';
    if (x.stand) {
      const r = x.stand, dl = (v) => v == null || r.base == null ? '' : '<span class="d">' + (v - r.base >= 0 ? 'up ' : 'down ') + Math.abs(v - r.base) + '</span>';
      const cell = (v) => '<td>' + (v == null ? '<span class="d">no reading</span>' : v + dl(v)) + '</td>';
      const base = 'Baseline' + (r.from ? ', ' + rptEsc(r.from) : '') + ', 5 min';
      if (d.personal) {
        h += '<table class="readouts"><thead><tr><th>' + base + '</th><th>1 min</th><th>3 min</th><th>5 min</th><th>10 min</th><th>Peak</th><th>30 or more above baseline</th></tr></thead><tbody><tr>' +
          '<td>' + (r.base == null ? '<span class="d">no reading</span>' : r.base) + '</td>' + [r.r1, r.r3, r.r5, r.r10].map(cell).join('') +
          '<td>' + (r.peak ? r.peak.v + dl(r.peak.v) + '<span class="d">at ' + d.clock(r.peak.m) + '</span>' : '') + '</td><td>' + r.held + ' of 10 min' + (r.met ? '<sup>1</sup>' : '') + '</td></tr></tbody></table>';
      } else {
        h += '<table class="readouts"><thead><tr><th>' + base + '</th><th>Peak</th><th>End of rise</th></tr></thead><tbody><tr><td>' + (r.base == null ? '<span class="d">no reading</span>' : r.base) + '</td>' +
          '<td>' + (r.peak ? r.peak.v + dl(r.peak.v) + '<span class="d">at ' + d.clock(r.peak.m) + '</span>' : '') + '</td>' +
          '<td>' + (r.end ? r.end.v + '<span class="d">at ' + d.clock(r.end.m) + '</span>' : '') + '</td></tr></tbody></table>';
      }
    } else h += rptTimeline(d, x);
    if (x.note) h += '<p class="mnote"><span class="lab">Note</span>' + rptEsc(x.note) + '</p>';
    return h + '</div>';
  }

  // All pages as HTML for one listing; page numbers filled in last.
  function rptPagesHtml(d, keep) {
    const { listed, rest } = rptListed(d, keep);
    const z = listed.filter(x => x.zoom);
    const pageOf = (x) => 2 + Math.floor(x.zi / 2);
    const pages = [rptPage('rpg1', rptPage1(d, listed, rest, pageOf))];
    if (z.length) {
      let lo = Infinity, hi = 0;
      z.forEach(x => { const w = rptWindow(d, x.a, x.b); if (w.low) lo = Math.min(lo, w.low.v); if (w.peak) hi = Math.max(hi, w.peak.v); });
      const vtop = Math.max(...z.map(x => rptHrvTop(d.hrv, x.a, x.b)));
      const ax = { bot: Math.max(30, Math.floor((lo - 4) / 10) * 10), top: Math.max(110, Math.ceil((hi + 1) / 5) * 5), vtop };
      for (let i = 0; i < z.length; i += 2) {
        let inner = rptRunhead(d);
        if (i === 0) inner += '<p class="axisnote">HR ' + ax.bot + ' to ' + ax.top + ' bpm and HRV 0 to ' + ax.vtop + ' ms on every moment</p>';
        inner += rptMomentBlock(d, z[i], ax) + (z[i + 1] ? rptMomentBlock(d, z[i + 1], ax) : '');
        const st = (z[i].stand && z[i].stand.met) || (z[i + 1] && z[i + 1].stand && z[i + 1].stand.met);
        pages.push(rptPage('rpg' + (2 + i / 2), inner + rptFoot(st && d.personal ? '<sup>1</sup> Rise of 30 bpm or more within 10 min of standing.' : null)));
      }
    }
    const total = pages.length;
    return pages.map((p, i) => p.replace('%%N%%', i + 1).replace('%%M%%', total)).join('');
  }

  // Room left between page 1's content and its footer, in CSS px.
  function rptRoom(pg) {
    const foot = pg.querySelector('.foot'), top = pg.getBoundingClientRect().top;
    let bottom = 0;
    pg.querySelectorAll('*').forEach(el => {
      if (foot.contains(el)) return;
      const r = el.getBoundingClientRect();
      if (r.width || r.height) bottom = Math.max(bottom, r.bottom - top);
    });
    return foot.getBoundingClientRect().top - top - bottom;
  }

  // Builds the pages into #report-print and fits page 1: moments without a page drop to one text line, latest first.
  async function rptPrepare(iso) {
    const d = await rptModel(iso);
    if (!d) return null;
    d.longDate = new Date(d.dayStart).toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    d.shortDate = new Date(d.dayStart).toLocaleDateString('en-CA', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    let host = document.getElementById('report-print');
    if (!host) { host = document.createElement('div'); host.id = 'report-print'; host.className = 'rpt'; host.setAttribute('aria-hidden', 'true'); document.body.appendChild(host); }
    host.hidden = false;
    try { await document.fonts.load("600 12px 'Work Sans'"); await document.fonts.load("400 12px 'Work Sans'"); await document.fonts.ready; } catch (e) {}
    let keep = d.moments.filter(x => !x.zoom).length;
    for (;;) {
      host.innerHTML = rptPagesHtml(d, keep);
      const room = rptRoom(host.querySelector('#rpg1'));
      if (room >= 8) break;
      if (keep === 0) { console.warn('[report] page 1 runs into its footer by', 8 - room, 'px'); break; }
      keep--;
    }
    return { d, host, count: host.querySelectorAll('.page').length, zoomed: d.moments.filter(x => x.zoom).length };
  }
  function rptClear() {
    const host = document.getElementById('report-print');
    if (host) { host.innerHTML = ''; host.hidden = true; }
    document.body.classList.remove('rpt-printing');
  }

  // ---------- Web: the print view; the browser saves it as a PDF ----------
  let rptTitle = null;
  async function rptDownload(iso) {
    rptBusy = true;
    try {
      const prep = await rptPrepare(iso);
      if (!prep) { UI.notice({ kind: 'error', text: 'No recording on this day.' }); return; }
      rptPrint(iso);
    } finally {
      rptBusy = false;
    }
  }
  function rptPrint(iso) {
    if (rptTitle == null) rptTitle = document.title;
    document.title = 'aorti day report ' + iso;
    document.body.classList.add('rpt-printing');
    window.print();
  }
  function rptAfterPrint() {
    if (!document.body.classList.contains('rpt-printing')) return;
    if (rptTitle != null) { document.title = rptTitle; rptTitle = null; }
    rptClear();
  }

  // ---------- App: the same pages drawn to canvases for native-pdf.js and the share sheet ----------
  let rptFontCss = null;
  async function rptFontFaces() {
    if (rptFontCss != null) return rptFontCss;
    const files = ['assets/fonts/WorkSans-latin.woff2', 'assets/fonts/WorkSans-latin-ext.woff2'];
    const faces = [];
    for (const f of files) {
      try {
        const res = await fetch(f);
        if (!res.ok) continue;
        const buf = new Uint8Array(await res.arrayBuffer());
        let bin = '';
        for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        faces.push("@font-face{font-family:'Work Sans';font-weight:100 900;src:url(data:font/woff2;base64," + btoa(bin) + ") format('woff2');}");
      } catch (e) {}
    }
    if (faces.length) rptFontCss = faces.join('');
    return faces.join('');
  }
  function rptSheetCss() {
    const out = [];
    for (const sh of document.styleSheets) {
      if (!sh.href || !/report\.css(\?|$)/.test(sh.href)) continue;
      try { for (const r of sh.cssRules) out.push(r.cssText); } catch (e) {}
    }
    return out.join('\n');
  }
  // One page as a 2x US Letter PNG (1224 x 1584), through an SVG foreignObject of the page's own markup.
  async function rptRaster(pageEl, css) {
    const wrap = document.createElement('div');
    wrap.className = 'rpt';
    const style = document.createElement('style');
    style.textContent = css;
    wrap.appendChild(style);
    wrap.appendChild(pageEl.cloneNode(true));
    const xhtml = new XMLSerializer().serializeToString(wrap);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056"><foreignObject x="0" y="0" width="816" height="1056">' + xhtml + '</foreignObject></svg>';
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    // The image's own document loads the embedded font after decode; redraw until the running head has ink.
    let c = null;
    for (let i = 0; i < 12; i++) {
      const img = new Image();
      img.src = src;
      await img.decode();
      if (i) await new Promise(r => setTimeout(r, 120));
      c = window.__aortiNativePdf.newPage(false);
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, 612, 792);
      if (rptHasInk(g)) break;
      if (i === 11) throw new Error('pdf_font_not_drawn');
      c.width = 0; c.height = 0;
    }
    const url = c.toDataURL('image/png');
    c.width = 0; c.height = 0;
    // native-pdf.js encodes a page through toDataURL and width/height; one canvas lives at a time, PNG strings stay.
    return { toDataURL: () => url, width: 1224, height: 1584 };
  }
  // Dark pixels in the running head band (first 70 CSS px), where every page prints text.
  function rptHasInk(g) {
    const px = g.getImageData(96, 60, 1032, 30).data;
    let dark = 0;
    for (let i = 0; i < px.length; i += 4) if (px[i] < 120 && px[i + 3] > 0) dark++;
    return dark > 40;
  }
  function rptNativeOk() { return !!(window.__aortiNativePdf && window.__aortiNativePdf.available && window.__aortiNativePdf.available()); }
  function rptNativeSave() { return rptNativeOk() && typeof window.__aortiNativePdf.canSave === 'function' && window.__aortiNativePdf.canSave(); }
  // mode 'share': the system share sheet. mode 'save': the same pages, then the system "Save as" screen (S48).
  async function rptShare(iso, mode) {

      prep = await rptPrepare(iso);
      if (!prep) { UI.notice({ kind: 'error', text: 'No recording on this day.' }); return; }
      const css = (await rptFontFaces()) + rptSheetCss();
      const pages = [];
      for (const pg of prep.host.querySelectorAll('.page')) pages.push(await rptRaster(pg, css));
      const opts = { pages, filename: 'aorti-day-' + iso + '.pdf', moments: prep.zoomed, week: false };
      if (save) {
        const r = await window.__aortiNativePdf.save(opts);
        if (r && r.saved) UI.notice({ kind: 'info', text: 'Saved' });
      } else {
        await window.__aortiNativePdf.print({ ...opts, share: true });
      }
      rptClear();
    } catch (e) {
      console.warn('[report] native PDF failed', e);
      UI.notice({ kind: 'error', text: save ? 'Could not save the PDF. Try again.' : 'Could not make the PDF. Try again.' });

    } finally {
      rptBusy = false;
    }
  }

  // ---------- Share menu: a menu on the laptop, a sheet on the phone ----------
  let rptMenuState = null, rptBusy = false, rptOpening = false;

    rptMenuState = null;
    document.removeEventListener('pointerdown', st.outside, true);
    if (st.sheet) st.sheet.close('done'); else st.el.remove();

    if (btn) btn.setAttribute('aria-expanded', 'false');
    if (focusBtn && btn) btn.focus({ preventScroll: true });
  }
  async function rptOpenMenu() {
    const btn = document.getElementById('export-report');
    if (rptMenuState) { rptCloseMenu(true); return; }
    if (rptBusy) { UI.toast('Making the report'); return; }
    if (rptOpening) return;
    const iso = rptDayIso();
    if (!iso) return;
    let count = 1;
    rptOpening = true;
    try { const d = await rptModel(iso); if (d) count = rptPageCount(d); } catch (e) { console.warn('[report] count failed', e); } finally { rptOpening = false; }
    const native = rptNativeOk();
    const m0 = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    const label = new Date(+m0[1], +m0[2] - 1, +m0[3], 12).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    // App: Save to phone first (Khal 2026-10-12: Share only offered Discord and email), then Share report.
    const items = native
      ? (rptNativeSave() ? [['save', 'Save to phone', '<path d="M12 3v12M7 10l5 5 5-5M5 20h14"/>']] : [])
        .concat([['share', 'Share report', '<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>']])

    const head = '<div class="share-menu-head" id="share-menu-head"><span>Day report, ' + rptEsc(label) + '</span><span class="share-menu-count" data-pages="' + count + '">' + rptPlural(count, 'page') + '</span></div>';
    const itemsHtml = items.map(([act, text, path]) => '<button type="button" role="menuitem" data-act="' + act + '" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + path + '</svg><span>' + text + '</span></button>').join('');
    const run = (act) => {

      if (act === 'share' || act === 'save') rptShare(iso, act); else rptDownload(iso).catch(e => { console.warn('[report] print failed', e); UI.notice({ kind: 'error', text: 'Could not build the report.' }); rptClear(); });
    };

      sheet = UI.sheet({ title: 'Share with my doctor', className: 'share-sheet', body: '<div class="menu share-menu" id="share-menu" role="menu" aria-labelledby="share-menu-head">' + head + itemsHtml + '</div>',
        onClose: (why) => { if (why !== 'done' && rptMenuState) { const st = rptMenuState; rptMenuState = null; document.removeEventListener('pointerdown', st.outside, true); btn.setAttribute('aria-expanded', 'false'); } } });
      el = sheet.root.querySelector('#share-menu');
    } else {
      el = document.createElement('div');
      el.className = 'menu share-menu';
      el.id = 'share-menu';
      el.setAttribute('role', 'menu');
      el.setAttribute('aria-labelledby', 'share-menu-head');
      el.innerHTML = head + itemsHtml;
      document.body.appendChild(el);
      const r = btn.getBoundingClientRect();
      el.style.top = Math.round(r.bottom + 4) + 'px';
      el.style.right = Math.max(8, Math.round(window.innerWidth - r.right)) + 'px';
    }
    const buttons = [...el.querySelectorAll('[role="menuitem"]')];
    buttons.forEach(b => b.addEventListener('click', () => run(b.dataset.act)));
    el.addEventListener('keydown', (e) => {
      const i = buttons.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const k = e.key === 'ArrowDown' ? 1 : -1; buttons[(i + k + buttons.length) % buttons.length].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); buttons[0].focus(); }
      else if (e.key === 'End') { e.preventDefault(); buttons[buttons.length - 1].focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); rptCloseMenu(true); }
      else if (e.key === 'Tab' && !sheet) rptCloseMenu(false);
