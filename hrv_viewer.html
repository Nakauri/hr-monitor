      const hrOk = m >= baseHR + MIN_HR_DELTA;
      let rmssdOk = true;
      if (rmssd && rmssdBaseline) {
        const rNow = nearestRmssdAt(rmssd, hr[i].t, rmssdHint);
        // Find baseline RMSSD at the same hint point.
        const baseRmssd = rmssdBaseline[rmssdHint.idx];
        rmssdOk = (rNow != null && baseRmssd != null) ? (rNow < baseRmssd * RMSSD_SUPPR) : false;
      }
      const isChill = stdOk && hrOk && rmssdOk;
      if (isChill) {
        if (!cur) cur = { start: hr[i].t, end: hr[i].t, maxStd: s, ratio: s / (medStd || 1), kind: 'sympathetic' };
        else { cur.end = hr[i].t; if (s > cur.maxStd) { cur.maxStd = s; cur.ratio = s / (medStd || 1); } }
      } else if (cur) {
        if (cur.end - cur.start >= MIN_DURATION && cur.start >= lastEmit + COOLDOWN) {
          out.push(cur); lastEmit = cur.end;
        }
        cur = null;
      }
    }
    if (cur && cur.end - cur.start >= MIN_DURATION && cur.start >= lastEmit + COOLDOWN) {
      out.push(cur);
    }

    // Vagal-burst pass — sharp RMSSD rise above trailing baseline.
    // Gates: ratio ≥2.5× baseline AND ≥+20 ms absolute; ≥5 s sustained;
    // ≤2 min length cap; 2-min cooldown.
    if (rmssd && rmssdBaseline) {
      const VAGAL_RATIO = 2.5;
      const VAGAL_ABS_DELTA = 20;
      const VAGAL_MIN_DURATION = 5 / 60;   // 5 seconds in minutes
      const VAGAL_MAX_DURATION = 2;        // 2 min cap
      const VAGAL_COOLDOWN = 2;
      let vagalCur = null;
      let vagalLastEmit = -Infinity;
      for (let i = 0; i < rmssd.length; i++) {
        const rNow = rmssd[i].v;
        const rBase = rmssdBaseline[i];
        if (rNow == null || rBase == null || rBase <= 0) {
          if (vagalCur && vagalCur.end - vagalCur.start >= VAGAL_MIN_DURATION
              && vagalCur.start >= vagalLastEmit + VAGAL_COOLDOWN) {
            out.push(vagalCur); vagalLastEmit = vagalCur.end;
          }
          vagalCur = null;
          continue;
        }
        const isVagal = rNow >= rBase * VAGAL_RATIO && rNow - rBase >= VAGAL_ABS_DELTA;
        if (isVagal) {
          if (!vagalCur) {
            vagalCur = { start: rmssd[i].t, end: rmssd[i].t, peakRmssd: rNow, baseRmssd: rBase, ratio: rNow / (rBase || 1), kind: 'vagal' };
          } else {
            vagalCur.end = rmssd[i].t;
            if (rNow > vagalCur.peakRmssd) { vagalCur.peakRmssd = rNow; vagalCur.ratio = rNow / (vagalCur.baseRmssd || 1); }
            // Close early if burst is running longer than VAGAL_MAX_DURATION
            if (vagalCur.end - vagalCur.start > VAGAL_MAX_DURATION) {
              if (vagalCur.start >= vagalLastEmit + VAGAL_COOLDOWN) {
                out.push(vagalCur); vagalLastEmit = vagalCur.end;
              }
              vagalCur = null;
            }
          }
        } else if (vagalCur) {
          if (vagalCur.end - vagalCur.start >= VAGAL_MIN_DURATION
              && vagalCur.start >= vagalLastEmit + VAGAL_COOLDOWN) {
            out.push(vagalCur); vagalLastEmit = vagalCur.end;
          }
          vagalCur = null;
        }
      }
      if (vagalCur && vagalCur.end - vagalCur.start >= VAGAL_MIN_DURATION
          && vagalCur.start >= vagalLastEmit + VAGAL_COOLDOWN) {
        out.push(vagalCur);
      }
    }

    return out;
  }

  // Bump to make every cached summary reparse (legacy index and the v2 sess:/prec: caches).
  const SUMMARY_SCHEMA_V = 16;
  function summarizeCSV(filename, text) {
    const { rows, header } = parseCSV(text);
    if (!rows.length) {
      // Mid-upload: file has headers but no data rows yet (mobile is
      // sending a resumable PATCH that hasn't trickled data through).
      // Return a ghost stub instead of null so the file shows up in the
      // calendar as a placeholder. needsReparse picks it up via the
      // __incomplete flag and replaces it with a real summary once rows
      // arrive on the next sync cycle. Other null-return paths below
      // (no valid HR, future-dated) remain — those are genuinely invalid
      // states that won't fix themselves.
      return {
        filename,
        __incomplete: true,
        __schemaV: SUMMARY_SCHEMA_V,
        startEpoch: deriveFileStartEpoch(filename),
        duration: 0,
        hrCount: 0,
        hrAvg: 0, hrMax: 0, hrMin: 0,
        rmssdAvg: null, rmssdMin: null,
        palpCount: 0, warnCount: 0,
        events: [], warnings: [], connections: [], postureLog: [],
        hr: [], rmssd: [], sdnnMatch: [], sdnn5min: [], sdnnFullSeries: [],
        palpTimes: [],
      };
    }
    const idx = {};
    header.forEach((h, i) => idx[h.trim()] = i);

    const hr = [];          // {t, v}
    const rmssd = [];       // {t, v}
    const sdnnMatch = [];   // {t, v}
    const sdnn5min = [];    // {t, v}
    const sdnnFullSeries = []; // {t, v} — running session SDNN per row
    const palpTimes = [];   // [t, t, ...]
    const events = [];      // {t, label}
    const warnings = [];    // {t, type}
    const connections = []; // {t, type}
    const postureLog = [];  // {t, posture}

    const fileStartEpoch = deriveFileStartEpoch(filename);
    const hasEpochCol = idx.epoch_ms != null;
    function epochFor(t, row) {
      // Prefer the CSV's epoch_ms column when present (post-schema-bump writer).
      // Fall back to filename-derived start + elapsed time_min for older files.
      if (hasEpochCol && row[idx.epoch_ms] !== '') {
        const e = parseFloat(row[idx.epoch_ms]);
        if (!isNaN(e)) return e;
      }
      return fileStartEpoch + t * 60000;
    }
    // Insert a null break-point when consecutive rows are more than
    // GAP_MIN minutes apart. With spanGaps:false on the chart, this
    // renders as a visible gap instead of a long straight line across
    // a silent window. Prevents the "flat at 100 bpm for 13 min" look
    // that was really a BLE / pause gap.
    const GAP_MIN = 10 / 60; // 10 seconds
    let lastT = null;
    const elapsedMin = rowElapsedMinFn(rows, idx);
    for (const r of rows) {
      const t = elapsedMin(r);
      if (isNaN(t)) continue;
      if (lastT != null && t - lastT > GAP_MIN) {
        hr.push({ t: t - 0.001, v: null });
        rmssd.push({ t: t - 0.001, v: null });
      }
      lastT = t;
      const ep = epochFor(t, r);
      const h = r[idx.hr_bpm] !== '' ? parseFloat(r[idx.hr_bpm]) : null;
      if (h != null && !isNaN(h)) hr.push({ t, v: h, ep });
      const rm = r[idx.rmssd_ms] !== '' ? parseFloat(r[idx.rmssd_ms]) : null;
      // RMSSD <= 0 is a missing value, not a reading.
      if (rm != null && !isNaN(rm) && rm > 0) rmssd.push({ t, v: rm, ep });
      if (idx.sdnn_match_ms != null) {
        const v = r[idx.sdnn_match_ms] !== '' ? parseFloat(r[idx.sdnn_match_ms]) : null;
        if (v != null && !isNaN(v) && v > 0) sdnnMatch.push({ t, v, ep });
      }
      if (idx.sdnn_5min_ms != null) {
        const v = r[idx.sdnn_5min_ms] !== '' ? parseFloat(r[idx.sdnn_5min_ms]) : null;
        if (v != null && !isNaN(v) && v > 0) sdnn5min.push({ t, v, ep });
      }
      if (idx.sdnn_full_ms != null) {
        const v = r[idx.sdnn_full_ms] !== '' ? parseFloat(r[idx.sdnn_full_ms]) : null;
        if (v != null && !isNaN(v) && v > 0) sdnnFullSeries.push({ t, v, ep });
      }
      if (r[idx.palpitation] === '1') palpTimes.push(t);
      if (r[idx.event] && r[idx.event] !== '') events.push({ t, label: r[idx.event], ep });
      if (r[idx.warning] && r[idx.warning] !== '') warnings.push({ t, type: r[idx.warning] });
      if (r[idx.connection] && r[idx.connection] !== '') {
        // Normalize: native Android writes past tense ("connected" /
        // "disconnected"); web writes present tense ("connect" / "disconnect").
        // Canonicalize so everything downstream can match a single string.
        const raw = r[idx.connection];
        const ct = raw === 'disconnected' ? 'disconnect'
                 : raw === 'connected' ? 'connect'
                 : raw;
        connections.push({ t, type: ct });
      }
      if (idx.posture != null && r[idx.posture] && r[idx.posture] !== '') postureLog.push({ t, posture: r[idx.posture] });
    }

    if (!hr.length) return null;

    // Authoritative session start time. Prefer the first row's epoch_ms
    // (UTC ms) because the filename's wall-clock portion can be in the
    // device's local time (Android) OR UTC (web) depending on which
    // surface wrote it. epoch_ms is unambiguous across both. The day
    // view reads this so sessions land in the correct hour regardless
    // of how the filename was stamped.
    const startEpoch = (hr[0] && hr[0].ep) ? hr[0].ep : fileStartEpoch;

    // Drop null gap-markers before averaging. Without the filter, reduce
    // treats null as 0 and divides by the inflated length — sessions with
    // BLE gaps end up with hrAvg pulled toward zero (or 0 outright when
    // every row is a gap marker).
    const hrVals = hr.map(p => p.v).filter(v => v != null);
    const rmssdVals = rmssd.map(p => p.v).filter(v => v != null);
    const sdnnMatchVals = sdnnMatch.map(p => p.v);
    const sdnn5minVals = sdnn5min.map(p => p.v);

    // Max/min with timestamps. Skip null gap-marker entries — without this,
    // null < anyNumber returns true (null coerces to 0) so hrMin gets set to
    // {v: null}, which downstream renders as "null bpm" in summary cards.
    let maxHR = null, minHR = null;
    for (const p of hr) {
      if (p.v == null) continue;
      if (maxHR == null || p.v > maxHR.v) maxHR = p;
      if (minHR == null || p.v < minHR.v) minHR = p;
    }
    if (maxHR == null) maxHR = { t: 0, v: 0 };
    if (minHR == null) minHR = { t: 0, v: 0 };
    let maxRM = null, minRM = null;
    if (rmssd.length) {
      for (const p of rmssd) {
        if (p.v == null) continue;
        if (maxRM == null || p.v > maxRM.v) maxRM = p;
        if (minRM == null || p.v < minRM.v) minRM = p;
      }
    }

    // Palpitation clustering: consecutive palps within 0.5 min -> one cluster
    const palpClusters = [];
    let cur = null;
    for (const t of palpTimes) {
      if (!cur) { cur = { start: t, end: t, count: 1 }; }
      else if (t - cur.end <= 0.5) { cur.end = t; cur.count++; }
      else { palpClusters.push(cur); cur = { start: t, end: t, count: 1 }; }
    }
    if (cur) palpClusters.push(cur);

    // Warning segments: group same-type warnings within 1 min. Filter out
    // single-event spans (< 5s sustained) since the monitor currently fires
    // on single-reading threshold crossings — a stray 131 bpm beat shouldn't
    // render as a warning stripe across the chart. Real physiological
    // crossings keep firing across multiple consecutive samples.
    const warnSegsRaw = [];
    for (const w of warnings) {
      const last = warnSegsRaw[warnSegsRaw.length - 1];
      if (last && last.type === w.type && w.t - last.end <= 1) last.end = w.t;
      else warnSegsRaw.push({ type: w.type, start: w.t, end: w.t });
    }
    const WARN_MIN_DURATION = 5 / 60; // 5 seconds in minutes
    const warnSegs = warnSegsRaw.filter(seg => (seg.end - seg.start) >= WARN_MIN_DURATION);

    // Connection gaps (disconnect -> next connect). For an open gap at end of
    // session, clamp end to at least start — otherwise a disconnect that fired
    // AFTER the last HR sample produces a negative "gap" which inflates uptime
    // past 100%.
    const rawGaps = [];
    const lastHRT = hr.length ? hr[hr.length - 1].t : 0;
    for (let i = 0; i < connections.length; i++) {
      if (connections[i].type === 'disconnect') {
        const next = connections.find((c, j) => j > i && c.type === 'connect');
        const start = connections[i].t;
        const end = next ? next.t : Math.max(start, lastHRT);
        rawGaps.push({ start, end });
      }
    }
    // Trim any gap against actual HR data presence. A disconnect event that
    // somehow fired while HR samples were still arriving (buggy firmware,
    // spurious state change, recovered-instantly reconnect without a matching
    // connect row) should not mask regions with real data.
    const connGaps = mergeGaps(trimGapsByData(rawGaps, hr).concat(dataJumpGaps(hr)));
    const gapTotalMin = connGaps.reduce((s, g) => s + Math.max(0, g.end - g.start), 0);

    // Resting HR proxy: the LOWEST 5-min rolling mean across the session. Unlike
    // "morning HR" this works for non-24 / odd schedules — it finds the calmest
    // stretch regardless of when in the day the session happened. Skip null
    // gap-markers; they coerce to 0 in arithmetic and pull the average down.
    const ROLL_MIN = 5;
    let restingHR = null;
    for (let i = 0; i < hr.length; i++) {
      if (hr[i].v == null) continue;
      const windowVals = [];
      for (let j = i; j < hr.length && hr[j].t - hr[i].t <= ROLL_MIN; j++) {
        if (hr[j].v != null) windowVals.push(hr[j].v);
      }
      if (windowVals.length < 10) continue;
      const m = windowVals.reduce((a, b) => a + b, 0) / windowVals.length;
      if (restingHR == null || m < restingHR) restingHR = m;
    }
    restingHR = restingHR != null ? Math.round(restingHR) : null;

    // Time in tachycardia (HR > 100). Denominator is real samples only;
    // gap-markers count as neither tachy nor not-tachy.
    const realHrCount = hrVals.length;
    const tachy = realHrCount > 0 ? hr.filter(p => p.v != null && p.v > 100).length / realHrCount : 0;

    // HR delta events — sustained rises/drops of >=20 bpm within any window up to
    // 10 min (POTS tilt-test criterion is 30 bpm in 10 min of standing). The
    // earlier 3-min window missed anything slower than ~8 bpm/min. We also smooth
    // HR with a 5-beat mean first so single-beat noise doesn't trigger false events.
    const smHR = [];
    for (let i = 0; i < hr.length; i++) {
      if (hr[i].v == null) { smHR.push({ t: hr[i].t, v: null }); continue; }
      let sum = 0, n = 0;
      for (let j = Math.max(0, i - 2); j < Math.min(hr.length, i + 3); j++) {
        if (hr[j].v == null) continue;
        sum += hr[j].v; n++;
      }
      smHR.push({ t: hr[i].t, v: n > 0 ? sum / n : null });
    }
    // Sympathetic flush detector. Sustained HR rise + RMSSD drop, mirrors
    // the POTS tilt-test criterion (≥30 bpm sustained over 10 min).
    // All five gates required:
    //   1. Smoothed peak HR ≥ max(baseline + 25, 100 bpm).
    //   2. Onset: HR rose ≥20 bpm from 5-min trailing baseline in 2 min before peak.
    //   3. Sustain: smoothed HR stays ≥(baseline + 20) for ≥60 sec after peak.
    //   4. RMSSD drops ≥30% vs trailing baseline during event.
    //   5. 15-min cooldown between events.
    const flushes = [];
    const FLUSH_PEAK_FLOOR = 100;
    const FLUSH_DELTA_MIN = 20;          // rise from baseline
    const FLUSH_ONSET_WIN = 2.0;         // peak must occur within 2 min of rise
    const FLUSH_SUSTAIN_MIN = 1.0;       // HR stays elevated for ≥60s after peak
    const FLUSH_SUSTAIN_DELTA = 20;      // "elevated" = baseline + 20
    const FLUSH_RMSSD_DROP = 0.30;
    const FLUSH_COOLDOWN_MIN = 15;
    const FLUSH_EDGE_MIN = 1;
    const FLUSH_BASELINE_MIN = 5;        // 5-min trailing baseline

    const hrBaselineSeries = rollingTrailingMean(hr, FLUSH_BASELINE_MIN);
    const rmssdBaselineSeries = rollingTrailingMean(rmssd, FLUSH_BASELINE_MIN);
    const hrLastT = hr.length ? hr[hr.length - 1].t : 0;
    let lastFlush = -Infinity;
    const rmssdHint = { idx: 0 };

    for (let i = 0; i < smHR.length; i++) {
      const cur = smHR[i];
      if (cur.v == null) continue;
      if (cur.t < FLUSH_EDGE_MIN || cur.t > hrLastT - FLUSH_EDGE_MIN) continue;
      if (cur.t < lastFlush + FLUSH_COOLDOWN_MIN) continue;

      const baseHR = hrBaselineSeries[i];
      if (baseHR == null) continue;

      const peakFloor = Math.max(FLUSH_PEAK_FLOOR, baseHR + 25);
      if (cur.v < peakFloor) continue;
      if (cur.v - baseHR < FLUSH_DELTA_MIN) continue;

      // Onset: at some point in the last FLUSH_ONSET_WIN minutes, smoothed
      // HR was within 5 bpm of baseline. That tells us the rise is recent,
      // not that HR has been elevated for 30 min already.
      let onsetOk = false;
      for (let j = i - 1; j >= 0 && cur.t - smHR[j].t <= FLUSH_ONSET_WIN; j--) {
        if (smHR[j].v != null && smHR[j].v <= baseHR + 5) { onsetOk = true; break; }
      }
      if (!onsetOk) continue;

      // Sustain: smoothed HR stays at least (baseline + FLUSH_SUSTAIN_DELTA)
      // for FLUSH_SUSTAIN_MIN minutes after the peak. Any dip below that
      // floor kills the candidate — real sympathetic surges don't flicker.
      let sustainReached = false;
      let lastSustainT = cur.t;
      let sustainBroken = false;
      for (let j = i + 1; j < smHR.length && smHR[j].t <= cur.t + FLUSH_SUSTAIN_MIN + 0.5; j++) {
        if (smHR[j].v == null) continue;
        if (smHR[j].v < baseHR + FLUSH_SUSTAIN_DELTA) { sustainBroken = true; break; }
        lastSustainT = smHR[j].t;
        if (smHR[j].t >= cur.t + FLUSH_SUSTAIN_MIN) { sustainReached = true; break; }
      }
      if (sustainBroken || !sustainReached) continue;

      // RMSSD: trailing baseline vs nearest during-event value.
      const rNow = nearestRmssdAt(rmssd, cur.t, rmssdHint);
      const rBase = rmssdBaselineSeries[rmssdHint.idx];
      if (rNow == null || rBase == null || rBase <= 0) continue;
      const rDropPct = (rBase - rNow) / rBase;
      if (rDropPct < FLUSH_RMSSD_DROP) continue;

      // Onset start: walk backward again to the actual crossing point, so
      // the span on the chart reflects when the rise BEGAN.
      let onsetStart = cur.t;
      for (let j = i - 1; j >= 0 && cur.t - smHR[j].t <= FLUSH_ONSET_WIN; j--) {
        if (smHR[j].v != null && smHR[j].v <= baseHR + 5) { onsetStart = smHR[j].t; break; }
      }

      flushes.push({
        start: onsetStart,
        end: lastSustainT,
        t: cur.t,
        hrDelta: Math.round(cur.v - baseHR),
        rmssdDropPct: Math.round(rDropPct * 100),
        peak: Math.round(cur.v),
        baseline: Math.round(baseHR),
      });
      lastFlush = cur.t;
    }

    // Chills/shivering volatility (extracted for re-run in the viewer).
    // rmssd passed so the detector can verify concurrent vagal withdrawal —
    // real shivering is a sympathetic event, not just statistical variance.
    const chillsWindows = detectChillsWindows(hr, 2.5, rmssd);

    const hrDeltas = [];
    // Thresholds are user-configurable (settings panel). Defaults match the
    // clinical POTS criterion: ≥30 bpm rise within 10 minutes (of standing).
    // 20 bpm is a more sensitive non-clinical default if the user prefers to
    // surface smaller jumps. The 3-bpm "stable" tolerance and 2-minute
    // cooldown between flags stay fixed — they just de-noise the detector.
    const DELTA_THRESH = getHrShiftSettings().threshold;
    const WIN_MIN = getHrShiftSettings().windowMin;
    const COOLDOWN = 2;
    let lastFlagAt = -Infinity;
    for (let i = 1; i < smHR.length; i++) {
      const cur = smHR[i];
      // Skip null gap-markers — without this, `null < rangeMin` coerces to
      // `0 < rangeMin` and rangeMin gets pulled to 0, producing fake
      // "82 → 0" / "0 → 89" deltas across BLE drops.
      if (cur.v == null) continue;
      if (cur.t < lastFlagAt + COOLDOWN) continue;
      let rangeMin = cur.v, rangeMax = cur.v;
      let minT = cur.t, maxT = cur.t;
      for (let j = i - 1; j >= 0 && cur.t - smHR[j].t <= WIN_MIN; j--) {
        if (smHR[j].v == null) continue;
        if (smHR[j].v < rangeMin) { rangeMin = smHR[j].v; minT = smHR[j].t; }
        if (smHR[j].v > rangeMax) { rangeMax = smHR[j].v; maxT = smHR[j].t; }
      }
      if (cur.v - rangeMin >= DELTA_THRESH && cur.v >= rangeMax - 3) {
        hrDeltas.push({ start: minT, end: cur.t, startHR: Math.round(rangeMin), endHR: Math.round(cur.v), delta: Math.round(cur.v - rangeMin), direction: 'rise' });
        lastFlagAt = cur.t;
      } else if (rangeMax - cur.v >= DELTA_THRESH && cur.v <= rangeMin + 3) {
        hrDeltas.push({ start: maxT, end: cur.t, startHR: Math.round(rangeMax), endHR: Math.round(cur.v), delta: Math.round(cur.v - rangeMax), direction: 'drop' });
        lastFlagAt = cur.t;
      }
    }

    // Per-calendar-day breakdown for sessions that span midnight. Each
    // local date the session touches gets its own slice (avg HR, max/min,
    // tachy %, count + min epoch / max epoch). Month + week views read
    // s.byDay[iso] so a 39-hour session reports its Saturday slice
    // (e.g. 1.5 h, 12% tachy) on the Saturday cell instead of the
    // file-wide 14% tachy.
    const byDay = {};
    {
      const buckets = new Map();
      const ymdLocal = (ms) => dayKeyOf(ms);
      for (const p of hr) {
        if (p.v == null || p.ep == null) continue;
        const k = ymdLocal(p.ep);
        let b = buckets.get(k);
        if (!b) {
          b = { hrSum: 0, hrCount: 0, tachyCount: 0, hrMax: -Infinity, hrMin: Infinity, startMs: p.ep, endMs: p.ep, palpCount: 0 };
          buckets.set(k, b);
        }
        b.hrSum += p.v;
        b.hrCount++;
        if (p.v > 100) b.tachyCount++;
        if (p.v > b.hrMax) b.hrMax = p.v;
        if (p.v < b.hrMin) b.hrMin = p.v;
        if (p.ep < b.startMs) b.startMs = p.ep;
        if (p.ep > b.endMs) b.endMs = p.ep;
      }
      // Per-day palp count from absolute palp times.
      for (const t of palpTimes) {
        const ep = (hr[0] && hr[0].ep) ? hr[0].ep + (t - hr[0].t) * 60000 : startEpoch + t * 60000;
        const k = ymdLocal(ep);
        const b = buckets.get(k);
        if (b) b.palpCount++;
      }
      for (const [k, b] of buckets) {
        if (!b.hrCount) continue;
        byDay[k] = {
          hrAvg: Math.round(b.hrSum / b.hrCount),
          hrMax: b.hrMax,
          hrMin: b.hrMin,
          tachyPct: Math.round((b.tachyCount / b.hrCount) * 100),
          durationMin: Math.max(0.0001, (b.endMs - b.startMs) / 60000),
          hrCount: b.hrCount,
          palpCount: b.palpCount,
        };
      }
    }
    // Sanity-check: a session that claims to extend more than a minute into
    // the future is either a clock-skew artifact or a contaminated file
    // (writer dumped stale state.hrSeries into a fresh filename). Refusing
    // the summary here keeps the bad file out of sessionsIndex + the
    // sessionsByDate buckets, so it can't paint phantom days in the calendar.
    const summaryDuration = hr[hr.length - 1].t;
    const summaryEndMs = startEpoch + summaryDuration * 60000;
    const nowMs = Date.now();
    if (startEpoch > nowMs + 60000 || summaryEndMs > nowMs + 60000) {
      console.warn('[summarizeCSV] rejecting summary with future epoch',
        { filename, startEpoch, duration: summaryDuration, endMs: summaryEndMs, nowMs });
      return null;
    }
    const summary = {
      filename,
      startEpoch,
      hrCount: hr.length,
      duration: summaryDuration,
      hrAvg: hrVals.length ? Math.round(hrVals.reduce((s, v) => s + v, 0) / hrVals.length) : 0,
      hrMax: maxHR,
      hrMin: minHR,
      rmssdAvg: rmssdVals.length ? Math.round(rmssdVals.reduce((s, v) => s + v, 0) / rmssdVals.length) : null,
      sdnnMatchAvg: sdnnMatchVals.length ? Math.round(sdnnMatchVals.reduce((s, v) => s + v, 0) / sdnnMatchVals.length) : null,
      sdnn5minAvg: sdnn5minVals.length ? Math.round(sdnn5minVals.reduce((s, v) => s + v, 0) / sdnn5minVals.length) : null,
      sdnnFull: sdnnFullSeries.length ? Math.round(sdnnFullSeries[sdnnFullSeries.length - 1].v) : null,
      rmssdMax: maxRM,
      rmssdMin: minRM,
      restingHR,
      palpCount: palpTimes.length,
      palpClusters,
      warnCount: warnSegs.length,
      warnSegs,
      events,
      connGaps,
      gapTotalMin,
      tachyPct: Math.round(tachy * 100),
      hrDeltas,
      flushes,
      chillsWindows,
      byDay,
      // Bump whenever summarizeCSV's output shape or logic changes. Forces a
      // re-parse of cached sessionsIndex entries that were produced by older
      // code — otherwise bug fixes in the summarize path never reach past
      // sessions already in the cache.
      __schemaV: SUMMARY_SCHEMA_V,
    };
    // Per-session quadrant percentages — how much of the session was spent in each
    // autonomic zone. Useful for cross-session POTS-severity trends.
    // Pair HR + RMSSD, classify each RMSSD sample, sum durations.
    const quadPct = { 'low-high': 0, 'high-high': 0, 'low-low': 0, 'high-low': 0 };
    if (rmssd.length && hr.length) {
      let hrIdx = 0;
      // Pull live user thresholds so quadPct matches whatever the user has
      // customized in the kebab editors. Cached summaries may lag by one render
      // cycle after a threshold change; invalidateQuadrantCache() clears them.
      const t = QUADRANT_THRESH;
      const quadCounts = { 'low-high': 0, 'high-high': 0, 'low-low': 0, 'high-low': 0, 'neutral': 0 };
      for (const p of rmssd) {
        while (hrIdx + 1 < hr.length && Math.abs(hr[hrIdx + 1].t - p.t) <= Math.abs(hr[hrIdx].t - p.t)) hrIdx++;
        const hrVal = hr[hrIdx].v;
        const hrLow = hrVal < t.hrLow, hrHigh = hrVal > t.hrHigh;
        const rmLow = p.v < t.hrvLow,  rmHigh = p.v > t.hrvHigh;
        let key = 'neutral';
        if (hrLow && rmHigh) key = 'low-high';
        else if (hrHigh && rmHigh) key = 'high-high';
        else if (hrLow && rmLow) key = 'low-low';
        else if (hrHigh && rmLow) key = 'high-low';
        quadCounts[key]++;
      }
      const total = rmssd.length;
      for (const k of Object.keys(quadCounts)) quadPct[k] = Math.round((quadCounts[k] / total) * 100);
    }
    summary.quadPct = quadPct;
    // Posture: convert change points into contiguous spans (carry forward until next change)
    if (postureLog.length) {
      const spans = [];
      for (let i = 0; i < postureLog.length; i++) {
        spans.push({ start: postureLog[i].t, end: i + 1 < postureLog.length ? postureLog[i + 1].t : hr[hr.length - 1].t, posture: postureLog[i].posture });
      }
      summary.postureSpans = spans;
    }
    return summary;
  }

  // LRU cache for parsed full-session data. Auto-poll re-renders + day-view
  // rebuilds re-open the same files repeatedly; without a cache each open
  // re-runs readSessionText (IDB get) + parseCSV (string split + float parse
  // on a multi-MB CSV). For an overnight session that's 1-2 sec of main-
  // thread work per re-open. Cap is small because parsed sessions are heavy
  // (10-30 MB each in JS object form).
  const _SESSION_CACHE_MAX = 8;
  const _sessionCache = new Map(); // filename -> { hr, rmssd }
  function _sessionCacheTouch(filename, value) {
    if (_sessionCache.has(filename)) _sessionCache.delete(filename); // re-insert at tail
    _sessionCache.set(filename, value);
    while (_sessionCache.size > _SESSION_CACHE_MAX) {
      const oldest = _sessionCache.keys().next().value;
      _sessionCache.delete(oldest);
    }
    return value;
  }

  // Full per-beat data (only loaded when rendering session view)
  async function loadFullSession(filename) {
    // Virtual day sessions are pre-built by buildDaySession() and cached in
    // virtualSessions; skip the CSV read path entirely for those.
    if (virtualSessions[filename]) return virtualSessions[filename].data;
    if (_sessionCache.has(filename)) return _sessionCacheTouch(filename, _sessionCache.get(filename));
    const text = await readSessionText(filename);
    const { rows, header } = parseCSV(text);
    const idx = {};
    header.forEach((h, i) => idx[h.trim()] = i);
    const fileStartEpoch = deriveFileStartEpoch(filename);
    const hasEpochCol = idx.epoch_ms != null;
    const hr = [], rmssd = [], sdnnMatch = [], sdnn5min = [];
    const elapsedMin = rowElapsedMinFn(rows, idx);
    for (const r of rows) {
      const t = elapsedMin(r);
      if (isNaN(t)) continue;
      let ep = fileStartEpoch + t * 60000;
      if (hasEpochCol && r[idx.epoch_ms] !== '') {
        const parsed = parseFloat(r[idx.epoch_ms]);
        if (!isNaN(parsed)) ep = parsed;
      }
      if (r[idx.hr_bpm] !== '') hr.push({ x: t, y: parseFloat(r[idx.hr_bpm]), ep });
      if (r[idx.rmssd_ms] !== '') {
        const v = parseFloat(r[idx.rmssd_ms]);
        if (v > 0) rmssd.push({ x: t, y: v, ep });
      }
      if (idx.sdnn_match_ms != null && r[idx.sdnn_match_ms] !== '') {
        const v = parseFloat(r[idx.sdnn_match_ms]);
        if (!isNaN(v) && v > 0) sdnnMatch.push({ x: t, y: v, ep });
      }
      if (idx.sdnn_5min_ms != null && r[idx.sdnn_5min_ms] !== '') {
        const v = parseFloat(r[idx.sdnn_5min_ms]);
        if (!isNaN(v) && v > 0) sdnn5min.push({ x: t, y: v, ep });
      }
    }
    return _sessionCacheTouch(filename, { hr, rmssd, sdnnMatch, sdnn5min });
  }

  // Build a virtual "day session" that merges every session on a given date
  // into one timeline. Events, warnings, palps, flushes, etc. get their t
  // values shifted from session-relative to day-relative (minutes from local
  // midnight). Routed through renderSession so the chart, zoom slider, marker
  // filters, and autonomic panel all reuse their session-view code paths.
  // Session order is by start epoch; filenames mix UTC and local time.
  function fileStartEpoch(fn) {
    const s = sessionsIndex[fn];
    if (s && s.startEpoch) return s.startEpoch;
    const m = parseSessionFilename(fn);
    return m ? m.date.getTime() : 0;
  }
  function compareFilesByStart(a, b) {
    return (fileStartEpoch(a) - fileStartEpoch(b)) || (a < b ? -1 : a > b ? 1 : 0);
  }

  function dayFilesByStart(files) {
    const out = [];
    for (const fn of files) {
      const s = sessionsIndex[fn];
      const meta = parseSessionFilename(fn);
      if (!s || !meta) continue;
      out.push({ fn, s, start: sessionStartEpoch(s, meta) });
    }
    return out.sort((a, b) => a.start - b.start);
  }

  // A day rebuilds only when a recording's summary or data object, the thresholds or the marks change.
  const _dayMemo = new Map();
  async function buildDaySession(iso) {
    const files = (sessionsByDate[iso] || []).slice();
    if (!files.length) return null;
    const { start: startOfDay, end: dayEndMs } = dayWindow(iso);
    const DAY_MAX = (dayEndMs - startOfDay) / 60000;

    const raw = await Promise.all(files.map(async fn => {
      try { return await loadFullSession(fn); }
      catch (e) { console.warn('[buildDaySession] load failed', fn, e); return null; }
    }));
    const memoKey = [JSON.stringify(QUADRANT_THRESH), marksVersion];
    for (let i = 0; i < files.length; i++) memoKey.push(files[i], sessionsIndex[files[i]], raw[i]);
    const memo = _dayMemo.get(iso);
    if (memo && memo.key.length === memoKey.length && memo.key.every((k, i) => k === memoKey[i]) && virtualSessions['day:' + iso] === memo.entry) {
      return memo.entry.summary;
    }
    const loaded = files.map((fn, i) => {
      const d = raw[i];
      return d ? { fn, hr: d.hr || [], rmssd: d.rmssd || [], sdnnMatch: d.sdnnMatch || [], sdnn5min: d.sdnn5min || [] }
        : { fn, hr: [], rmssd: [], sdnnMatch: [], sdnn5min: [] };
    });

    // Match the shape loadFullSession returns: {x, y, ep}. The chart code and
    // several downstream helpers read .x / .y directly; using {t, v} silently
    // breaks chart rendering (the line never plots because points miss their x).
    // Clip to this day's window [0, DAY_MAX] minutes so midnight-crosser
    // sessions don't leak yesterday's or tomorrow's points into this day's
    // chart. Dedupe by epoch so dual-saves don't double-plot the same beat.
    // Stable sort by epoch, then keep the first point of each epoch (earliest
    // file wins, as before). A Map keyed on 58k epochs was the slow part.
    const dayPoints = (key) => {
      const all = [];
      for (const sd of loaded) {
        for (const p of sd[key]) {
          if (p.ep == null) continue;
          const x = (p.ep - startOfDay) / 60000;
          if (x < 0 || x > DAY_MAX) continue;
          all.push({ x, y: p.y, ep: p.ep });
        }
      }
      all.sort((a, b) => a.ep - b.ep);
      let n = 0;
      for (let i = 0; i < all.length; i++) {
        if (n && all[n - 1].ep === all[i].ep) continue;
        all[n++] = all[i];
      }
      all.length = n;
      return all;
    };
    const hr = dayPoints('hr');
    const rmssd = dayPoints('rmssd');
    const sdnnMatch = dayPoints('sdnnMatch');
    const sdnn5min = dayPoints('sdnn5min');

    // Walk each session's summary and shift its events into day-minute space,
    // then clip to [0, DAY_MAX] so cross-day sessions don't bleed markers into
    // adjacent days. Marker families fall into two shapes:
    //   point  — anchored on {t}: events. Drop entirely if anchor falls outside the day.
    //   range  — anchored on {start, end}: warnSegs/palpClusters/connGaps/hrDeltas/
    //            chillsWindows/postureSpans. Clip to [0, DAY_MAX]; drop if no overlap.
    //   flushes are range-primary with an additional peak {t}; clip the range, clamp t
    //   to within the clipped range, never delete on t-alone.
    const shiftPoint = (obj, off, anchor) => {
      const v = obj[anchor];
      if (typeof v !== 'number') return null;
      const shifted = v + off;
      if (shifted < 0 || shifted > DAY_MAX) return null;
      const r = { ...obj };
      r[anchor] = shifted;
      return r;
    };
    const shiftRange = (obj, off) => {
      const s0 = obj.start, e0 = obj.end;
      if (typeof s0 !== 'number' || typeof e0 !== 'number') return null;
      const start = Math.max(0, s0 + off);
      const end = Math.min(DAY_MAX, e0 + off);
      if (end <= start) return null;
      return { ...obj, start, end };
    };
    const shiftFlush = (obj, off) => {
      const r = shiftRange(obj, off);
      if (!r) return null;
      if (typeof obj.t === 'number') {
        const tShifted = obj.t + off;
        r.t = Math.max(r.start, Math.min(r.end, tShifted));
      }
      return r;
    };
    const events = [], warnSegs = [], palpClusters = [], connGaps = [];
    const hrDeltas = [], flushes = [], chillsWindows = [], postureSpans = [];
    let palpCount = 0;
    const pushIf = (arr, v) => { if (v) arr.push(v); };
    for (const fn of files) {
      const s = sessionsIndex[fn];
      const meta = parseSessionFilename(fn);
      if (!s || !meta) continue;
      const offset = (sessionStartEpoch(s, meta) - startOfDay) / 60000;
      for (const e of (s.events || [])) pushIf(events, shiftPoint(e, offset, 't'));
      for (const w of (s.warnSegs || [])) pushIf(warnSegs, shiftRange(w, offset));
      for (const p of (s.palpClusters || [])) pushIf(palpClusters, shiftRange(p, offset));
      for (const g of (s.connGaps || [])) pushIf(connGaps, shiftRange(g, offset));
      for (const d of (s.hrDeltas || [])) pushIf(hrDeltas, shiftRange(d, offset));
      for (const f of (s.flushes || [])) pushIf(flushes, shiftFlush(f, offset));
      for (const c of (s.chillsWindows || [])) pushIf(chillsWindows, shiftRange(c, offset));
      for (const ps of (s.postureSpans || [])) pushIf(postureSpans, shiftRange(ps, offset));
      palpCount += (s.palpCount || 0);
    }

    // Gaps inside recordings, before the time between recordings joins them.
    const recGaps = mergeGaps(connGaps);
    // Day boundaries between consecutive sessions count as connection gaps so
    // the chart line breaks instead of drawing a horizontal bridge across
    // strap-off time.
    const ordered = dayFilesByStart(files);
    for (let i = 0; i + 1 < ordered.length; i++) {
      const a = ordered[i], b = ordered[i + 1];
      const aEnd = (a.start - startOfDay) / 60000 + a.s.duration;
      const bStart = (b.start - startOfDay) / 60000;
      if (bStart > aEnd + 0.1) connGaps.push({ start: aEnd, end: bStart });
    }

    // Aggregate stats across the whole day. Data arrays use {x, y, ep}
    // (loadFullSession shape); summary fields use {t, v} (summarizeCSV
    // convention consumed by renderSession).
    const hrVals = hr.map(p => p.y);
    const rmssdVals = rmssd.map(p => p.y);
    // Skip null gap-marker points; null coerces to 0 in <comparisons and
    // would silently set hrMin to {v: null}, rendering as "null bpm".
    let hrMax = { t: 0, v: 0 }, hrMin = { t: 0, v: Infinity };
    for (const p of hr) {
      if (p.y == null) continue;
      if (p.y > hrMax.v) hrMax = { t: p.x, v: p.y };
      if (p.y < hrMin.v) hrMin = { t: p.x, v: p.y };
    }
    if (!isFinite(hrMin.v)) hrMin = { t: 0, v: 0 };
    let rmssdMax = { t: 0, v: 0 }, rmssdMin = { t: 0, v: Infinity };
    for (const p of rmssd) {
      if (p.y == null) continue;
      if (p.y > rmssdMax.v) rmssdMax = { t: p.x, v: p.y };
      if (p.y < rmssdMin.v) rmssdMin = { t: p.x, v: p.y };
    }
    if (!isFinite(rmssdMin.v)) rmssdMin = { t: 0, v: 0 };

    // duration: chart x-axis max (last data point in the day, in minutes
    //   from 00:00). activeDuration: union of session portions for the
    //   summary stat. Both are needed; renderSession reads activeDuration
    //   and falls back to duration for non-virtual sessions.
    const portionIntervals = [];
    for (const fn of files) {
      const s = sessionsIndex[fn];
      if (!s || !s.startEpoch || !s.duration) continue;
      const a = Math.max(s.startEpoch, startOfDay);
      const b = Math.min(s.startEpoch + s.duration * 60000, dayEndMs);
      if (b > a) portionIntervals.push([a, b]);
    }
    let activeDuration = 0;
    if (portionIntervals.length) {
      portionIntervals.sort((x, y) => x[0] - y[0]);
      let cs = portionIntervals[0][0], ce = portionIntervals[0][1];
      for (let i = 1; i < portionIntervals.length; i++) {
        if (portionIntervals[i][0] <= ce) ce = Math.max(ce, portionIntervals[i][1]);
        else { activeDuration += ce - cs; cs = portionIntervals[i][0]; ce = portionIntervals[i][1]; }
      }
      activeDuration += ce - cs;
      activeDuration = activeDuration / 60000;
    }
    // The whole day window (23, 24 or 25 h) for a virtual day, wherever the data sits in it.
    // activeDuration is the union of actual recorded minutes, shown as the recording total.
    const duration = DAY_MAX;
    connGaps.splice(0, connGaps.length, ...mergeGaps(connGaps));
    const gapTotalMin = connGaps.reduce((s, g) => s + Math.max(0, g.end - g.start), 0);
    const hrAvg = hrVals.length ? Math.round(hrVals.reduce((a, b) => a + b, 0) / hrVals.length) : 0;
    const rmssdAvg = rmssdVals.length ? Math.round(rmssdVals.reduce((a, b) => a + b, 0) / rmssdVals.length) : null;
    const sdnnMatchVals = sdnnMatch.map(p => p.y);
    const sdnn5minVals = sdnn5min.map(p => p.y);
    const sdnnMatchAvg = sdnnMatchVals.length ? Math.round(sdnnMatchVals.reduce((a, b) => a + b, 0) / sdnnMatchVals.length) : null;
    const sdnn5minAvg = sdnn5minVals.length ? Math.round(sdnn5minVals.reduce((a, b) => a + b, 0) / sdnn5minVals.length) : null;
    const tachyPct = hrVals.length ? Math.round(hrVals.filter(v => v > 100).length / hrVals.length * 100) : 0;
    const warnCount = warnSegs.length;

    const quadPct = { 'low-high': 0, 'high-high': 0, 'low-low': 0, 'high-low': 0 };
    if (rmssd.length && hr.length) {
      const t = QUADRANT_THRESH;
      const quadCounts = { 'low-high': 0, 'high-high': 0, 'low-low': 0, 'high-low': 0, 'neutral': 0 };
      let hrIdx = 0;
      for (const p of rmssd) {
        while (hrIdx + 1 < hr.length && Math.abs(hr[hrIdx + 1].x - p.x) <= Math.abs(hr[hrIdx].x - p.x)) hrIdx++;
        const hrVal = hr[hrIdx].y;
        const hrLow = hrVal < t.hrLow, hrHigh = hrVal > t.hrHigh;
        const rmLow = p.y < t.hrvLow, rmHigh = p.y > t.hrvHigh;
        let key = 'neutral';
        if (hrLow && rmHigh) key = 'low-high';
        else if (hrHigh && rmHigh) key = 'high-high';
        else if (hrLow && rmLow) key = 'low-low';
        else if (hrHigh && rmLow) key = 'high-low';
        quadCounts[key]++;
      }
      const total = rmssd.length;
      for (const k of Object.keys(quadPct)) quadPct[k] = Math.round((quadCounts[k] / total) * 100);
    }

    const summary = {
      filename: 'day:' + iso,
      duration,
      activeDuration,
      hrAvg, hrMax, hrMin,
      rmssdAvg, rmssdMax, rmssdMin,
      sdnnMatchAvg, sdnn5minAvg,
      sdnnFull: null,
      restingHR: null,
      palpCount, palpClusters,
      warnCount, warnSegs,
      events, connGaps, gapTotalMin, recGaps,
      tachyPct, hrDeltas,
      flushes, chillsWindows,
      quadPct,
      postureSpans: postureSpans.length ? postureSpans : undefined,
      __virtualDay: iso,
      __sourceFiles: files.slice(),
    };
    const entry = { summary, data: { hr, rmssd } };
    virtualSessions['day:' + iso] = entry;
    _dayMemo.set(iso, { key: memoKey, entry });
    return summary;
  }

  // ===== Router =====
  function parseHash() {
    const h = (location.hash || '#/index').replace(/^#\/?/, '');
    const parts = h.split('/');
    return { view: parts[0] || 'index', arg: parts[1] };
  }

  function setHash(path) { location.hash = '#/' + path; }

  async function route() {
    // Defensive: if the previous view left any annotation tooltip hovering,
    // clear it before rendering the next one. Otherwise a chart tooltip can
    // follow the user into a view that has no chart (e.g., Month / Day grid).
    try { hideAnnoTip(); clearMarkerItemHighlight(); } catch (e) {}
    // Ensure the sessions index is warm before any view renders. If neither a
    // local folder nor any Drive-cached sessions exist, fall through to empty.
    if (Object.keys(sessionsIndex).length === 0) {
      await loadSessions();
    }
    if (!dirHandle && Object.keys(sessionsIndex).length === 0) {
      showOnly('empty-state');
      return;
    }
    let { view, arg } = parseHash();
    // The full-day explorer is the Day view; its old route lands there.
    const oldDay = view === 'session' && /^day:(\d{4}-\d{2}-\d{2})$/.exec(decodeURIComponent(arg || ''));
    if (oldDay) {
      view = 'day'; arg = oldDay[1];
      history.replaceState(null, '', '#/day/' + arg);
    }
    if (view === 'day' && /^\d{4}-\d{2}-\d{2}$/.test(arg || '')) shownDay = arg;
    // Cancel any active auto-poll from a previous explorer. renderSession
    // restarts it if the next view is also an explorer.
    if (view !== 'session' && view !== 'day' && typeof clearAutoPoll === 'function') clearAutoPoll();
    if (view !== 'session' && view !== 'day' && markersSheet && !markersSheet.closed) markersSheet.close('route');
    if (view !== 'session' && view !== 'day' && layersSheet && !layersSheet.closed) layersSheet.close('route');
    switch (view) {
      case 'index': renderIndex(); showOnly('view-index'); break;
      case 'session': await renderSession(arg); showOnly('view-session'); break;
      case 'month': renderMonth(arg); showOnly('view-month'); break;
      case 'day': showOnly('view-day'); await renderDay(arg); break;
      case 'week': renderWeek(arg); showOnly('view-week'); break;
      case 'all': renderAll(); showOnly('view-all'); break;
      default: renderIndex(); showOnly('view-index');
    }
    syncBarNav(view, arg);
  }

  // The day the Day view last showed; Month and Week tabs open the period holding it.
  let shownDay = null;
  function barTabView(view, arg) {
    if (view === 'session') return /^day:/.test(decodeURIComponent(arg || '')) ? 'day' : 'index';
    return ['month', 'week', 'day', 'index', 'all'].includes(view) ? view : 'index';
  }
  function syncBarNav(view, arg) {
    const cur = barTabView(view, arg);
    document.querySelectorAll('.view-tabs a').forEach(a => {
      if (a.dataset.view === cur) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
      if (!shownDay) return;
      if (a.dataset.view === 'day') a.href = '#/day/' + shownDay;
      else if (a.dataset.view === 'week') a.href = '#/week/' + shownDay;
      else if (a.dataset.view === 'month') a.href = '#/month/' + shownDay.slice(0, 7);
    });
    const sel = document.getElementById('view-select');
    if (sel) sel.value = cur;
    fitBar();
  }
  // Large text: drop the Syncing word, the Share word, the wordmark text, then the logo, until the bar fits.
  function fitBar() {
    const bar = document.getElementById('app-bar');
    if (!bar) return;
    // Share is the primary button on the laptop bar and a ghost button among the phone bar's icons.
    const share = document.getElementById('export-report');
    if (share) {
      const phone = window.matchMedia('(max-width: 768px)').matches;
      share.classList.toggle('primary', !phone);
      share.classList.toggle('ghost', phone);
    }
    bar.classList.remove('tight-0', 'tight-1', 'tight-2', 'tight-3');
    for (const c of ['tight-0', 'tight-1', 'tight-2', 'tight-3']) {
      if (bar.scrollWidth <= bar.clientWidth + 1) break;
      if (c === 'tight-0' && !bar.classList.contains('syncing')) continue;
      bar.classList.add(c);
    }
  }

  function showOnly(id) {
    // Android WebView ignores window.print(), so the app shows Share only when the native PDF path is there.
    const exportBtn = document.getElementById('export-report');
    // isNativeApp here means the app without the PDF path.
    const isNativeApp = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) && !rptNativeOk();
    if (exportBtn) exportBtn.hidden = isNativeApp || id === 'empty-state';
    ['empty-state', 'view-index', 'view-session', 'view-month', 'view-day', 'view-week', 'view-all'].forEach(v => {
      const el = document.getElementById(v);
      if (el) el.classList.toggle('hidden', v !== id);
    });
    if (id === 'empty-state') document.getElementById('empty-state').style.display = 'flex';
    else { const es = document.getElementById('empty-state'); if (es) es.style.display = 'none'; }
  }

  // Index view state: sort + preset date range + pagination. Persisted so the
  // list remembers the user's setup across re-renders and tab changes.
  const indexState = {
    sort: localStorage.getItem('hrv_viewer_index_sort') || 'newest',
    range: localStorage.getItem('hrv_viewer_index_range') || 'all',
    page: 0,
    pageSize: 50,
  };
  const SORT_COMPARATORS = {
    newest:      (a, b) => compareFilesByStart(b, a),
    oldest:      (a, b) => compareFilesByStart(a, b),
    longest:     (a, b) => (sessionsIndex[b]?.duration || 0) - (sessionsIndex[a]?.duration || 0),
    shortest:    (a, b) => (sessionsIndex[a]?.duration || 0) - (sessionsIndex[b]?.duration || 0),
    'best-hrv':  (a, b) => (sessionsIndex[b]?.rmssdAvg || 0) - (sessionsIndex[a]?.rmssdAvg || 0),
    'worst-hrv': (a, b) => (sessionsIndex[a]?.rmssdAvg ?? 1e9) - (sessionsIndex[b]?.rmssdAvg ?? 1e9),
    'best-uptime':  (a, b) => (computeUptimePct(sessionsIndex[b]) ?? -1) - (computeUptimePct(sessionsIndex[a]) ?? -1),
    'worst-uptime': (a, b) => (computeUptimePct(sessionsIndex[a]) ?? 101) - (computeUptimePct(sessionsIndex[b]) ?? 101),
  };
  const RANGE_OPTIONS = [
    ['all', 'All time'],
    ['7', 'Last 7 days'],
    ['30', 'Last 30 days'],
    ['90', 'Last 90 days'],
    ['365', 'Last year'],
    ['month', 'This month'],
  ];
  function rangeCutoffISO(range) {
    if (range === 'all' || !range) return null;
    const now = new Date();
    if (range === 'month') {
      const d = new Date(now.getFullYear(), now.getMonth(), 1);
      return localDateLabel(d.getTime());
    }
    const days = parseInt(range, 10);
    if (!isFinite(days)) return null;
    const d = new Date(now);
    d.setDate(d.getDate() - days);
    return localDateLabel(d.getTime());
  }
  function applyIndexFilterSort(allFilenames) {
    let list = allFilenames.slice();
    const cutoff = rangeCutoffISO(indexState.range);
    if (cutoff) {
      list = list.filter(fn => {
        const s = sessionsIndex[fn];
        const m = parseSessionFilename(fn);
        const key = sessionLocalDateKey(s, m);
        return key >= cutoff;
      });
    }
    list.sort(SORT_COMPARATORS[indexState.sort] || SORT_COMPARATORS.newest);
    return list;
  }

  // ===== Index / sessions-list view (temporary landing page) =====
  function renderIndex() {
    const el = document.getElementById('view-index');
    const allFilenames = Object.keys(sessionsIndex);
    if (!allFilenames.length) {
      el.innerHTML = `
        <div class="stub-panel">
          <div style="font-size: 16px; margin-bottom: 8px;">No sessions yet</div>
          <div style="font-size: 13px;">Run your live HR monitor with auto-save enabled to start building a history.</div>
        </div>`;
      return;
    }
    const filtered = applyIndexFilterSort(allFilenames);
    const total = filtered.length;
    const totalAll = allFilenames.length;
    const pageSize = indexState.pageSize;
    const pageCount = Math.max(1, Math.ceil(total / pageSize));
    if (indexState.page >= pageCount) indexState.page = pageCount - 1;
    if (indexState.page < 0) indexState.page = 0;
    const start = indexState.page * pageSize;
    const pageSlice = filtered.slice(start, start + pageSize);

    const cards = pageSlice.map(fn => {
      const s = sessionsIndex[fn];
      const meta = parseSessionFilename(fn);
      const dur = formatDuration(s.duration);
      const hrStage = getHRStage(s.hrAvg);
      const upPct = computeUptimePct(s);
      return `
        <div class="session-card" data-filename="${encodeURIComponent(fn)}">
          ${sessionCardActions(encodeURIComponent(fn))}
          <div class="session-card-time" title="${meta && meta.tooltip ? escape(meta.tooltip) : ''}">${escape(sessionLocalDateKey(s, meta) || fn)}</div>
          <div class="session-card-date">${meta && meta.date ? `${formatClockRange(sessionStartEpoch(s, meta), s.duration)} <span class="session-card-dur">(${dur})</span>` : `${dur} session`}</div>
          <div class="session-card-stats">
            <div class="session-card-stat">
              <span class="session-card-stat-label">Avg HR</span>
              <span class="session-card-stat-value ${hrStage}">${s.hrAvg}</span>
            </div>
            <div class="session-card-stat">
              <span class="session-card-stat-label">Avg HRV</span>
              <span class="session-card-stat-value" style="color: var(--hrv);">${s.rmssdAvg ?? '—'}</span>
            </div>
            <div class="session-card-stat">
              <span class="session-card-stat-label">Palps</span>
              <span class="session-card-stat-value" style="color: ${s.palpCount ? 'var(--warn-palp)' : 'var(--text-dim)'};">${s.palpCount}</span>
            </div>
            <div class="session-card-stat">
              <span class="session-card-stat-label">Warn</span>
              <span class="session-card-stat-value" style="color: ${s.warnCount ? 'var(--warn-crash)' : 'var(--text-dim)'};">${s.warnCount}</span>
            </div>
            <div class="session-card-stat" title="Share of session time with live HR data. Low numbers mean the strap dropped beats, so averages are less reliable.">
              <span class="session-card-stat-label">Uptime</span>
              <span class="session-card-stat-value" style="color: ${uptimeColor(upPct)};">${upPct != null ? upPct + '%' : '—'}</span>
            </div>
          </div>
        </div>`;
    }).join('');

    const sortOptions = [
      ['newest', 'Newest first'],
      ['oldest', 'Oldest first'],
      ['longest', 'Longest duration'],
      ['shortest', 'Shortest duration'],
      ['best-hrv', 'Highest HRV'],
      ['worst-hrv', 'Lowest HRV'],
      ['best-uptime', 'Best uptime'],
      ['worst-uptime', 'Worst uptime'],
    ].map(([v, l]) => `<option value="${v}"${v === indexState.sort ? ' selected' : ''}>${l}</option>`).join('');
    const rangeOptionsHtml = RANGE_OPTIONS
      .map(([v, l]) => `<option value="${v}"${v === indexState.range ? ' selected' : ''}>${l}</option>`)
      .join('');

    const showing = total === 0 ? '0' : `${start + 1}–${Math.min(start + pageSize, total)}`;
    const countLabel = total === totalAll
      ? `${total} session${total === 1 ? '' : 's'}`
      : `${total} of ${totalAll}`;

    const pager = pageCount > 1 ? `
      <div class="index-pager ui">
        <button class="btn index-pager-btn" type="button" data-page="prev"${indexState.page === 0 ? ' disabled' : ''}>${UI.icon('prev')}Prev</button>
        <span class="index-pager-info">Page ${indexState.page + 1} of ${pageCount} · showing ${showing}</span>
        <button class="btn index-pager-btn" type="button" data-page="next"${indexState.page >= pageCount - 1 ? ' disabled' : ''}>Next${UI.icon('next')}</button>
      </div>` : '';

    el.innerHTML = `
      <div class="index-head ui">
        <div class="section-head" style="margin: 0;">All sessions · ${countLabel}</div>
        <div class="index-controls">
          <span class="field"><span class="select"><select id="index-range" aria-label="Date range">${rangeOptionsHtml}</select></span></span>
          <span class="field"><span class="select"><select id="index-sort" aria-label="Sort order">${sortOptions}</select></span></span>
        </div>
      </div>
      <div class="sessions-grid">${cards || '<div class="stub-panel">No sessions in this range.</div>'}</div>
      ${pager}
    `;

    el.querySelectorAll('.session-card').forEach(c => {
      c.addEventListener('click', () => setHash('session/' + c.dataset.filename));
    });
    wireSessionCardKebabs(el, { onDeleted: () => renderIndex() });
    const rangeEl = document.getElementById('index-range');
    if (rangeEl) rangeEl.addEventListener('change', () => {
      indexState.range = rangeEl.value;
      try { localStorage.setItem('hrv_viewer_index_range', indexState.range); } catch (e) {}
      indexState.page = 0;
      renderIndex();
    });
    const sortEl = document.getElementById('index-sort');
    if (sortEl) sortEl.addEventListener('change', () => {
      indexState.sort = sortEl.value;
      try { localStorage.setItem('hrv_viewer_index_sort', indexState.sort); } catch (e) {}
      indexState.page = 0;
      renderIndex();
    });
    el.querySelectorAll('.index-pager-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.page === 'prev') indexState.page = Math.max(0, indexState.page - 1);
        else indexState.page = Math.min(pageCount - 1, indexState.page + 1);
        renderIndex();
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // Uptime = % of session time with live HR data. Flags sessions whose
  // averages are less trustworthy because the strap dropped beats.
  // Cached summaries from earlier builds can carry gaps where end < start
  // (open gaps past the last HR sample), which produces nonsense uptime like
  // 226%. Recompute per-gap from connGaps with a floor, and clamp the result.
  function computeUptimePct(s) {
    if (!s || !s.duration || s.duration <= 0) return null;
    let gap = 0;
    if (Array.isArray(s.connGaps)) {
      for (const g of s.connGaps) gap += Math.max(0, (g?.end || 0) - (g?.start || 0));
    } else {
      gap = Math.max(0, s.gapTotalMin || 0);
    }
    const up = Math.max(0, s.duration - gap);
    return Math.min(100, Math.round(100 * up / s.duration));
  }
  function uptimeColor(pct) {
    if (pct == null) return 'var(--text-dim)';
    if (pct >= 95) return '#B8D97E';
    if (pct >= 80) return 'var(--text)';
    return 'var(--warn-crash)';
  }

  // ===== Headline metric selector (Month + Week) =====
  // POTS-friendly metrics — flat "avg HR" mixes lying + standing HR which is
  // meaningless. Swap between resting baseline (calmest 5-min window), tachycardia
  // burden (% time HR > 100), HR range (max-min reactivity), and plain average.
  let headlineMetric = localStorage.getItem('hrv_viewer_headline_metric') || 'rest';

  // Aggregate a metric across a day's sessions. Returns { value, label, unit, stage, color }.
  // `iso` (YYYY-MM-DD) is the calendar day being rendered: when a session spans
  // midnight, prefer s.byDay[iso] over file-wide stats so each day reports its
  // own slice (a 39-hour session shows its 1.5-hr Saturday slice on Saturday's
  // cell, not the full-file 14% tachy).
  function computeHeadline(metric, files, iso) {
    if (!files || !files.length) return { value: null, label: '', unit: '', stage: 'stage-normal', color: STAGE_COLORS['stage-normal'] };
    let totalDur = 0, weightedHR = 0, weightedTachy = 0, minRest = null, maxHR = null, minHR = null;
    for (const fn of files) {
      const s = sessionsIndex[fn];
      if (!s) continue;
      const slice = (iso && s.byDay && s.byDay[iso]) ? s.byDay[iso] : null;
      const dur = slice ? slice.durationMin : s.duration;
      const hrAvg = slice ? slice.hrAvg : s.hrAvg;
      const tachyPct = slice ? slice.tachyPct : (s.tachyPct || 0);
      const sliceMax = slice ? slice.hrMax : (s.hrMax && s.hrMax.v);
      const sliceMin = slice ? slice.hrMin : (s.hrMin && s.hrMin.v);
      if (!dur) continue;
      totalDur += dur;
      weightedHR += hrAvg * dur;
      weightedTachy += tachyPct * dur;
      // restingHR isn't easily sliced per-day yet; fall back to file-wide
      // value. For multi-day sessions this slightly over-reports rest on
      // continuation days, but it's the same number on every day so the
      // user can tell it's the session's calmest window.
      if (s.restingHR != null && (minRest == null || s.restingHR < minRest)) minRest = s.restingHR;
      if (sliceMax != null && (maxHR == null || sliceMax > maxHR)) maxHR = sliceMax;
      if (sliceMin != null && (minHR == null || sliceMin < minHR)) minHR = sliceMin;
    }
    if (totalDur === 0) return { value: null, label: '', unit: '', stage: 'stage-normal', color: STAGE_COLORS['stage-normal'] };
    if (metric === 'avg') {
      const v = Math.round(weightedHR / totalDur);
      const stage = getHRStage(v);
      return { value: v, label: 'Avg HR', unit: 'bpm', stage, color: STAGE_COLORS[stage] };
    }
    if (metric === 'rest') {
      const stage = getHRStage(minRest);
      return { value: minRest, label: 'Resting', unit: 'bpm', stage, color: STAGE_COLORS[stage] };
    }
    if (metric === 'tachy') {
      const v = Math.round(weightedTachy / totalDur);
      // Tachy burden color bands: <10 green, <20 yellow, <40 orange, ≥40 red
      let stage = 'stage-low', color;
      if (v < 10) { stage = 'stage-normal'; color = STAGE_COLORS['stage-normal']; }
      else if (v < 20) { stage = 'stage-elevated'; color = STAGE_COLORS['stage-elevated']; }
      else if (v < 40) { stage = 'stage-high'; color = STAGE_COLORS['stage-high']; }
      else { stage = 'stage-critical'; color = STAGE_COLORS['stage-critical']; }
      return { value: v, label: 'Tachy', unit: '%', stage, color };
    }
    if (metric === 'range') {
      const v = (maxHR != null && minHR != null) ? (maxHR - minHR) : null;
      // HR range color bands: <20 good, <35 ok, <55 concerning, ≥55 POTS-flare-likely
      let color = STAGE_COLORS['stage-normal'];
      if (v == null) color = STAGE_COLORS['stage-normal'];
      else if (v < 20) color = STAGE_COLORS['stage-normal'];
      else if (v < 35) color = STAGE_COLORS['stage-elevated'];
      else if (v < 55) color = STAGE_COLORS['stage-high'];
      else color = STAGE_COLORS['stage-critical'];
      return { value: v, label: 'HR Range', unit: 'Δbpm', stage: 'stage-normal', color };
    }
    return { value: null, label: '', unit: '', stage: 'stage-normal', color: STAGE_COLORS['stage-normal'] };
  }

  function metricSwitchHTML() {
    const metrics = [
      ['rest', 'Rest'],
      ['avg', 'Avg'],
      ['tachy', 'Tachy %'],
      ['range', 'Range'],
    ];
    return `<div class="segmented metric-switch" role="group" aria-label="Headline">${metrics.map(([k, lbl]) =>
      `<button type="button" data-metric="${k}" aria-pressed="${headlineMetric === k}">${lbl}</button>`
    ).join('')}</div>`;
  }

  function wireMetricSwitch(container, onChange) {
    container.querySelectorAll('.metric-switch button').forEach(btn => {
      btn.addEventListener('click', () => {
        headlineMetric = btn.dataset.metric;
        try { localStorage.setItem('hrv_viewer_headline_metric', headlineMetric); } catch (e) {}
        onChange();
      });
    });
  }

  // ===== Date nav: one component for Day, Week and Month =====
  // Carets sit at the row ends around a fixed title track; the title opens a jump picker.
  function dateNavHTML(view, o) {
    const off = (b) => b ? ' disabled' : '';
    return `
        <div class="datenav ui" data-view="${view}">
          <button class="btn icon" id="${view}-prev" type="button" aria-label="${o.prevLabel}"${off(o.prevOff)}>${UI.icon('prev')}</button>
          <h1 class="datenav-h${o.cls ? ' ' + o.cls : ''}"><button class="btn ghost datenav-title" id="${view}-pick" type="button" aria-haspopup="dialog">${o.title}${UI.icon('chevron').replace('class="ico"', 'class="ico datenav-open" aria-hidden="true"')}</button></h1>
          <button class="btn icon" id="${view}-next" type="button" aria-label="${o.nextLabel}"${off(o.nextOff)}>${UI.icon('next')}</button>
        </div>`;
  }
  // A re-render replaces the nav; the control that had focus gets it back.
  let dateNavFocus = null;
  document.addEventListener('focusin', (e) => { dateNavFocus = e.target && e.target.closest && e.target.closest('.datenav') ? e.target.id : null; });
  function wireDateNav(view, o) {
    const g = (s) => document.getElementById(view + s);
    g('-prev').addEventListener('click', o.prev);
    g('-next').addEventListener('click', o.next);
    g('-pick').addEventListener('click', (e) => openDatePick(view, e.currentTarget, o.shown));
    const back = dateNavFocus && dateNavFocus.startsWith(view + '-') && document.getElementById(dateNavFocus);
    if (back && !back.disabled && (document.activeElement === document.body || !document.activeElement)) {
      try { back.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  const DP_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dpIso = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  let datePick = null;
  // view 'day' or 'week': a month of days; 'month': the year's months. shown is the iso day or YYYY-MM in view.
  function openDatePick(view, anchor, shown) {
    if (datePick && !datePick.closed) datePick.close('reopen');
    const byMonth = view === 'month';
    const today = localDateKeyToday();
    const shownIso = byMonth ? shown + '-01' : shown;
    let y = +shownIso.slice(0, 4), m = +shownIso.slice(5, 7) - 1;
    const weekOf = (iso) => { const d = new Date(iso + 'T12:00:00'); return isoAddDays(iso, -d.getDay()); }; // date-label
    const shownWeek = view === 'week' ? weekOf(shownIso) : null;
    const monthDays = {};
    for (const k of Object.keys(sessionsByDate)) monthDays[k.slice(0, 7)] = (monthDays[k.slice(0, 7)] || 0) + 1;
    const body = document.createElement('div');
    body.className = 'dp';
    const unit = byMonth ? 'year' : 'month';
    body.innerHTML = `
      <div class="dp-head">
        <button class="btn icon dp-step" type="button" data-step="-1" aria-label="Previous ${unit}">${UI.icon('prev')}</button>
        <span class="dp-label" aria-live="polite"></span>
        <button class="btn icon dp-step" type="button" data-step="1" aria-label="Next ${unit}">${UI.icon('next')}</button>
      </div>
      ${byMonth ? '' : `<div class="dp-dow" aria-hidden="true">${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((d) => `<span>${d}</span>`).join('')}</div>`}
      <div class="dp-grid${byMonth ? ' dp-months' : ''}"></div>`;
    const label = body.querySelector('.dp-label');
    const grid = body.querySelector('.dp-grid');
    const draw = (focusKey) => {
      let html = '';
      if (byMonth) {
        label.textContent = String(y);
        for (let i = 0; i < 12; i++) {
          const key = `${y}-${String(i + 1).padStart(2, '0')}`;
          const n = monthDays[key] || 0;
          const cls = ['btn', key === shown ? 'primary' : 'ghost', 'dp-cell', n ? 'has' : '', key === today.slice(0, 7) ? 'today' : '', key === shown ? 'shown' : ''].filter(Boolean).join(' ');
          html += `<button class="${cls}" type="button" data-key="${key}" tabindex="-1" aria-label="${DP_MONTHS[i]} ${y}${n ? `, ${n} day${n === 1 ? '' : 's'} recorded` : ''}"${key === shown ? ' aria-current="true"' : ''}>${DP_MONTHS[i].slice(0, 3)}</button>`;
        }
      } else {
        label.textContent = `${DP_MONTHS[m]} ${y}`;
        const first = new Date(y, m, 1);
        for (let i = 0; i < 42; i++) {
          const d = new Date(y, m, 1 - first.getDay() + i, 12);
          const key = dpIso(d.getFullYear(), d.getMonth(), d.getDate());
          const n = (sessionsByDate[key] || []).length;
          const inWeek = shownWeek && weekOf(key) === shownWeek;
          const isShown = view === 'day' && key === shown;
          if (d.getMonth() !== m) { html += '<span class="dp-cell out" aria-hidden="true"></span>'; continue; }
          const cls = ['btn', isShown ? 'primary' : 'ghost', 'dp-cell', n ? 'has' : '', key === today ? 'today' : '', isShown ? 'shown' : '', inWeek ? 'inweek' : ''].filter(Boolean).join(' ');
          const name = d.toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
          html += `<button class="${cls}" type="button" data-key="${key}" tabindex="-1" aria-label="${name}${n ? `, ${n} recording${n === 1 ? '' : 's'}` : ''}"${isShown || inWeek ? ' aria-current="true"' : ''}>${d.getDate()}</button>`;
        }
      }
      grid.innerHTML = html;
      const cells = [...grid.querySelectorAll('button.dp-cell')];
      const target = cells.find((c) => c.dataset.key === focusKey)
        || cells.find((c) => c.classList.contains('shown') || c.classList.contains('inweek'))
        || cells.find((c) => c.classList.contains('today'))
        || cells[0];
      target.tabIndex = 0;
      return target;
    };
    const step = (n) => {
      if (byMonth) y += n;
      else { const d = new Date(y, m + n, 1); y = d.getFullYear(); m = d.getMonth(); }
    };
    // Moves focus by days (or months), turning the page when it leaves the one shown.
    const move = (from, by) => {
      let key;
      if (byMonth) {
        const d = new Date(+from.slice(0, 4), +from.slice(5, 7) - 1 + by, 1);
        key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        y = d.getFullYear();
      } else {
        key = isoAddDays(from, by);
        y = +key.slice(0, 4); m = +key.slice(5, 7) - 1;
      }
      draw(key).focus();
    };
    const pick = (key) => {
      sheet.close('pick');
      if (key === shown) return;
      if (view === 'month') setHash('month/' + key);
      else setHash(view + '/' + key);
    };
    body.addEventListener('click', (e) => {
      const st = e.target.closest('.dp-step');
      if (st) { step(+st.dataset.step); draw(); return; }
      const c = e.target.closest('.dp-cell');
      if (c) pick(c.dataset.key);
    });
    body.addEventListener('keydown', (e) => {
      const c = e.target.closest && e.target.closest('.dp-cell');
      const keys = byMonth ? { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 } : { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.stopPropagation();
      if (c && keys[e.key]) { e.preventDefault(); move(c.dataset.key, keys[e.key]); return; }
      if (c && (e.key === 'PageUp' || e.key === 'PageDown')) {
        e.preventDefault();
        const by = e.key === 'PageUp' ? -1 : 1;
        if (byMonth) move(c.dataset.key, by * 12);
        else { const day = +c.dataset.key.slice(8); step(by); draw(dpIso(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()))).focus(); }
      }
    });
    const phone = !window.matchMedia('(min-width: 600px)').matches;
    try { anchor.focus({ preventScroll: true }); } catch (e) {}
    const title = byMonth ? 'Jump to a month' : view === 'week' ? 'Jump to a week' : 'Jump to a day';
    const sheet = UI.sheet({ title, body, className: 'date-pick' + (phone ? '' : ' date-pop'), onClose: () => anchor.setAttribute('aria-expanded', 'false') });
    anchor.setAttribute('aria-expanded', 'true');
    datePick = sheet;
    const first = draw();
    if (!phone) {
      const r = anchor.getBoundingClientRect();
      const w = sheet.sheet.offsetWidth;
      sheet.sheet.style.left = Math.round(Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8)) + 'px';
      sheet.sheet.style.top = Math.round(Math.max(8, Math.min(r.bottom + 6, window.innerHeight - sheet.sheet.offsetHeight - 8))) + 'px';
    }
    try { first.focus({ preventScroll: true }); } catch (e) {}
  }

  // ===== Month calendar =====
  function renderMonth(ymArg) {
    const el = document.getElementById('view-month');
    // Default to the month of the newest session, else today
    let year, month;
    if (/^\d{4}-\d{2}$/.test(ymArg || '')) {
      [year, month] = ymArg.split('-').map(Number);
      month -= 1;
    } else {
      const dates = Object.keys(sessionsByDate).sort();
      const pick = dates.length ? new Date(dates[dates.length - 1] + 'T00:00:00') : new Date(); // date-label
      year = pick.getFullYear();
      month = pick.getMonth();
    }
    const first = new Date(year, month, 1);
    const monthName = first.toLocaleString(undefined, { month: 'long', year: 'numeric' });
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dowStart = first.getDay(); // 0=Sun
    const todayStr = localDateKeyToday();

    // Compute bounds for color scaling: use each day's morning HR across ALL sessions.
    // We color with the stage colors (same vocabulary as live app).
    const dayStats = {}; // 'YYYY-MM-DD' -> { avgHR, restingHR, ... }
    // Per-day events filtered by absolute timestamp: a multi-day session's
    // palpitations / flushes / chills land on the day they happened, not on
    // every day the session spans.
    function eventsInDayRange(s, dateStr, eventArr, tField) {
      if (!eventArr || !eventArr.length || !s.startEpoch) return 0;
      const { start: dayStart, end: dayEnd } = dayWindow(dateStr);
      let n = 0;
      for (const e of eventArr) {
        const t = e[tField || 't'];
        if (t == null) continue;
        const ep = s.startEpoch + t * 60000;
        if (ep >= dayStart && ep < dayEnd) n++;
      }
      return n;
    }
    for (const [dateStr, files] of Object.entries(sessionsByDate)) {
      let weightedHR = 0, totalDur = 0, lowestRest = null;
      let palp = 0, warn = 0, flush = 0, chills = 0;
      for (const fn of files) {
        const ss = sessionsIndex[fn];
        if (!ss) continue;
        const slice = ss.byDay && ss.byDay[dateStr];
        const dur = slice ? slice.durationMin : ss.duration;
        const hrAvg = slice ? slice.hrAvg : ss.hrAvg;
        if (dur > 0) {
          weightedHR += hrAvg * dur;
          totalDur += dur;
        }
        if (ss.restingHR != null && (lowestRest == null || ss.restingHR < lowestRest)) lowestRest = ss.restingHR;
        palp += slice ? (slice.palpCount || 0) : ss.palpCount;
        warn += eventsInDayRange(ss, dateStr, ss.warnSegs, 'start');
        flush += eventsInDayRange(ss, dateStr, ss.flushes, 'start');
        chills += eventsInDayRange(ss, dateStr, ss.chillsWindows, 'start');
      }
      const avgHR = totalDur > 0 ? Math.round(weightedHR / totalDur) : null;
      dayStats[dateStr] = { avgHR, restingHR: lowestRest, sessionCount: files.length, palpCount: palp, warnCount: warn, flushCount: flush, chillsCount: chills, firstFile: files[0] };
    }

    const dowNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let cells = '';
    for (const d of dowNames) cells += `<div class="cal-dow">${d}</div>`;
    // Pad leading empty days
    for (let i = 0; i < dowStart; i++) cells += `<div class="cal-cell empty-month"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const stats = dayStats[iso];
      const isToday = iso === todayStr;
      if (!stats) {
        cells += `<div class="cal-cell ${isToday ? 'today' : ''}"><div class="cal-day-num">${d}</div></div>`;
        continue;
      }
      const headline = computeHeadline(headlineMetric, sessionsByDate[iso], iso);
      const palpBadge = stats.palpCount > 0 ? `<span class="cal-badge palp" title="${stats.palpCount} palpitation beats"><span class="cal-badge-dot"></span>${stats.palpCount}</span>` : '';
      const warnBadge = stats.warnCount > 0 ? `<span class="cal-badge warn" title="${stats.warnCount} threshold warnings"><span class="cal-badge-dot"></span>${stats.warnCount}</span>` : '';
      const flushBadge = stats.flushCount > 0 ? `<span class="cal-badge flush" title="${stats.flushCount} sympathetic flush events"><span class="cal-badge-dot"></span>${stats.flushCount}</span>` : '';
      const chillsBadge = stats.chillsCount > 0 ? `<span class="cal-badge chills" title="${stats.chillsCount} chills / volatility windows"><span class="cal-badge-dot"></span>${stats.chillsCount}</span>` : '';
      cells += `
        <div class="cal-cell strip has-sessions ${isToday ? 'today' : ''}" data-date="${iso}" style="--strip-c: ${headline.color};">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="cal-day-num">${d}</span>
            <span class="cal-session-count">${stats.sessionCount} session${stats.sessionCount === 1 ? '' : 's'}</span>
          </div>
          <div>
            <div class="cal-hr" style="color: ${headline.color};">${headline.value ?? '—'}${headline.unit === '%' ? '<span style="font-size: 16px;">%</span>' : ''}</div>
            <div class="cal-hr-unit">${headline.label}${headlineMetric === 'rest' && stats.avgHR != null ? ` · avg ${stats.avgHR}` : ''}</div>
          </div>
          <div class="cal-badges">${palpBadge}${warnBadge}${flushBadge}${chillsBadge}</div>
        </div>`;
    }

    // Legend for cell colors
    const legend = `
      <div class="cal-legend-strip">
        <div class="chart-legend-item"><span class="legend-swatch" style="background: #7DB8E8;"></span>Low</div>
        <div class="chart-legend-item"><span class="legend-swatch" style="background: #B8D97E;"></span>Normal</div>
        <div class="chart-legend-item"><span class="legend-swatch" style="background: #F0C75E;"></span>Elevated</div>
        <div class="chart-legend-item"><span class="legend-swatch" style="background: #E89858;"></span>High</div>
        <div class="chart-legend-item"><span class="legend-swatch" style="background: #E24B4A;"></span>Critical</div>
      </div>`;

    // Collect every session filename that falls inside this month for the
    // aggregate report.
    const monthFiles = [];
    for (const [dateStr, dateFiles] of Object.entries(sessionsByDate)) {
      const [yy, mm] = dateStr.split('-').map(Number);
      if (yy === year && mm - 1 === month) monthFiles.push(...dateFiles);
    }

    el.innerHTML = `
      <div class="cal-header ui">
        ${dateNavHTML('month', { title: `<span class="t-long">${monthName}</span><span class="t-short">${first.toLocaleString(undefined, { month: 'short', year: 'numeric' })}</span>`, cls: 'month-title', prevLabel: 'Previous month', nextLabel: 'Next month' })}
        <button class="btn cal-today-btn" id="cal-today" type="button">Today</button>
        ${metricSwitchHTML()}
        ${legend}
      </div>
      ${buildAggregateReport('Monthly', monthFiles)}
      <div class="cal-grid">${cells}</div>
    `;

    wireAggregateReport(el);
    wireMetricSwitch(el, () => renderMonth(ymArg));

    // Nav handlers
    const monthHash = (n) => { const d = new Date(year, month + n, 1); setHash(`month/${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); };
    wireDateNav('month', { prev: () => monthHash(-1), next: () => monthHash(1), shown: `${year}-${String(month + 1).padStart(2, '0')}` });
    document.getElementById('cal-today').addEventListener('click', () => {
      const n = new Date();
      setHash(`month/${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`);
    });

    // Cell click → day view always. Even a single-file day routes through
    // buildDaySession so multi-day sessions get clipped to that day's
    // 24-hour window (00:00 → 23:59) instead of opening the raw 39-hour
    // file. User can still drill into the underlying session from the
    // day view's session list.
    el.querySelectorAll('.cal-cell.has-sessions').forEach(cell => {
      cell.addEventListener('click', () => {
        setHash('day/' + cell.dataset.date);
      });
    });
  }

  // ===== Day view: single date, 24-hr strip + session cards =====
  // Day view: the full-day explorer for one date, then that day's recordings.
  let renderDayToken = 0;
  async function renderDay(dateArg) {
    const tok = ++renderDayToken;
    const el = document.getElementById('view-day');
    let iso = /^\d{4}-\d{2}-\d{2}$/.test(dateArg || '') ? dateArg : null;
    if (!iso) {
      const dates = Object.keys(sessionsByDate).sort();
      iso = dates.length ? dates[dates.length - 1] : localDateKeyToday();
    }
    const date = new Date(iso + 'T00:00:00'); // date-label
    const title = date.toLocaleString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const titleShort = date.toLocaleString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    const files = sessionsByDate[iso] || [];
    // Arrows stop only on dates with recordings.
    const dateKeys = Object.keys(sessionsByDate).sort();
    let prevDate = null, nextDate = null;
    for (const k of dateKeys) {
      if (k < iso) prevDate = k;
      else if (k > iso) { nextDate = k; break; }
    }
    shownDay = iso;
    // The gaps line sits under the chart.
    const gapsNoteHtml = (gaps) => {
      const gapMin = gaps.reduce((a, g) => a + Math.max(0, g.end - g.start), 0);
      return gaps.length
        ? `<p class="gaps-note">${gaps.length} gap${gaps.length === 1 ? '' : 's'} · ${formatMinutesShort(gapMin)} missing</p>`
        : '';
    };
    const headHtml = (gaps) => `
      <div class="day-header" data-gaps="${gaps.length}">
        ${dateNavHTML('day', { title: `<span class="t-long">${title}</span><span class="t-short">${titleShort}</span>`, cls: 'day-title', prevLabel: 'Previous day', nextLabel: 'Next day', prevOff: !prevDate, nextOff: !nextDate })}
      </div>`;
    const wireNav = () => wireDateNav('day', { prev: () => { if (prevDate) setHash('day/' + prevDate); }, next: () => { if (nextDate) setHash('day/' + nextDate); }, shown: iso });
    // A different day shows its date at once while its recordings load; a reload of the same day keeps the page.
    if (el.dataset.iso !== iso) {
      clearExplorer();

  // Short duration for running text: "45 s", "18 min", "1 h 54 min".

  // ===== Week view =====
  function renderWeek(weekArg) {

      anchor = dates.length ? new Date(dates[dates.length - 1] + 'T00:00:00') : new Date(); // date-label

    const weekStartStr = localDateLabel(weekStart.getTime());
    const weekEndStr = localDateLabel(weekEnd.getTime());
    const dowNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);

      // west of UTC the Sunday-midnight-local date serialises to Saturday's
