  // Summary-bar KPI customization. localStorage stores the set of HIDDEN
  // stat keys. When nothing's saved we fall back to SUMMARY_DEFAULTS_HIDDEN
  // so the bar isn't crowded by SDNN variants users haven't asked for.
  const SUMMARY_STAT_KEYS = ['date','duration','hrAvg','hrMax','hrMin','rmssdAvg','sdnnMatchAvg','sdnn5minAvg','sdnnFull','palpCount','warnCount','uptime','tachyPct'];
  const SUMMARY_DEFAULTS_HIDDEN = ['sdnn5minAvg','sdnnFull'];
  function getSummaryHiddenSet() {
    try {
      const raw = localStorage.getItem('hrv_summary_hidden');
      if (!raw) return new Set(SUMMARY_DEFAULTS_HIDDEN);
      const arr = JSON.parse(raw);
      return new Set(Array.isArray(arr) ? arr.filter(k => SUMMARY_STAT_KEYS.includes(k)) : SUMMARY_DEFAULTS_HIDDEN);
    } catch (e) { return new Set(SUMMARY_DEFAULTS_HIDDEN); }
  }
  function saveSummaryHiddenSet(set) {
    try { localStorage.setItem('hrv_summary_hidden', JSON.stringify(Array.from(set))); } catch (e) {}
  }
  function applySummaryStatVisibility() {
    const hidden = getSummaryHiddenSet();
    document.querySelectorAll('#summary-bar .summary-stat[data-stat]').forEach(el => {
      el.style.display = hidden.has(el.getAttribute('data-stat')) ? 'none' : '';
    });
    fitSummaryStats();
  }
  // Sizes the stat columns to the widest visible stat, so a long Duration never runs into its neighbour.
  function fitSummaryStats() {
    const grid = document.querySelector('#summary-bar .summary-grid');
    if (!grid) return;
    const stats = [...grid.children].filter((e) => e.offsetParent !== null);
    stats.forEach((e) => { e.style.width = 'max-content'; });
    const w = stats.reduce((a, e) => Math.max(a, e.getBoundingClientRect().width), 0);
    stats.forEach((e) => { e.style.width = ''; });
    if (!w) return;
    const col = Math.ceil(w);
    grid.style.setProperty('--kpi-col', col + 'px');
    // Balanced rows: 10 stats that fit 8 across become 5 and 5, never 8 and 2.
    const gap = parseFloat(getComputedStyle(grid).columnGap) || 0;
    const fit = Math.max(1, Math.floor((grid.clientWidth + gap) / (col + gap)));
    const cols = Math.ceil(stats.length / Math.ceil(stats.length / fit));
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(min(${col}px, 100%), 1fr))`;
  }
  let fitStatsQueued = false;
  window.addEventListener('resize', () => {
    if (fitStatsQueued) return;
    fitStatsQueued = true;
    requestAnimationFrame(() => { fitStatsQueued = false; fitSummaryStats(); });
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSummaryStats);
  function wireSummaryBarKebab() {
    const btn = document.getElementById('summary-bar-kebab');
    const menu = document.getElementById('summary-bar-menu');
    if (!btn || !menu) return;
    const hidden = getSummaryHiddenSet();
    menu.querySelectorAll('input[type="checkbox"][data-stat]').forEach(cb => {
      cb.checked = !hidden.has(cb.getAttribute('data-stat'));
    });
    const close = () => {
      menu.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    };
    const open = () => {
      menu.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
    };
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (menu.hidden) open(); else close();
    });
    menu.addEventListener('click', (e) => { e.stopPropagation(); });
    menu.addEventListener('change', (e) => {
      const cb = e.target.closest('input[type="checkbox"][data-stat]');
      if (!cb) return;
      const key = cb.getAttribute('data-stat');
      const set = getSummaryHiddenSet();
      if (cb.checked) set.delete(key); else set.add(key);
      saveSummaryHiddenSet(set);
      applySummaryStatVisibility();
    });
    const reset = document.getElementById('summary-bar-menu-reset');
    if (reset) {
      reset.addEventListener('click', (e) => {
        e.stopPropagation();
        const defaults = new Set(SUMMARY_DEFAULTS_HIDDEN);
        saveSummaryHiddenSet(defaults);
        menu.querySelectorAll('input[type="checkbox"][data-stat]').forEach(cb => {
          cb.checked = !defaults.has(cb.getAttribute('data-stat'));
        });
        applySummaryStatVisibility();
      });
    }
    if (!wireSummaryBarKebab._docBound) {
      wireSummaryBarKebab._docBound = true;
      document.addEventListener('click', (e) => {
        const m = document.getElementById('summary-bar-menu');
        const b = document.getElementById('summary-bar-kebab');
        if (!m || m.hidden) return;
        if (e.target.closest('#summary-bar-menu')) return;
        if (e.target.closest('#summary-bar-kebab')) return;
        m.hidden = true;
        if (b) b.setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const m = document.getElementById('summary-bar-menu');
        const b = document.getElementById('summary-bar-kebab');
        if (!m || m.hidden) return;
        m.hidden = true;
        if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); }
      });
    }
  }

  // Floating tooltip used for annotation hover (warning bands, gaps, events)
  function getAnnoTip() {
    let tip = document.getElementById('anno-tip');
    if (!tip) {
      tip = document.createElement('div');
      tip.id = 'anno-tip';
      document.body.appendChild(tip);
    }
    return tip;
  }
  function showAnnoTip(text, evt) {
    const tip = getAnnoTip();
    tip.innerHTML = text;
    tip.style.display = 'block';
    // On the session view, anchor ABOVE the chart as a banner so it doesn't
    // cover the first row of data (which is often where the marker the user
    // just hovered lives). Fall back to below the chart if there's no space
    // above (happens mid-scroll on mobile when the chart is pushed to the top).
    const chart = currentChart;
    const canvas = chart && chart.canvas;
    const sessionViewVisible = (() => {
      const v = canvas && canvas.closest('.view');
      return v && !v.classList.contains('hidden');
    })();
    const isSessionChartContext = !!canvas && document.body.contains(canvas) && sessionViewVisible;
    if (isSessionChartContext) {
      const rect = canvas.getBoundingClientRect();
      const tipW = tip.offsetWidth;
      const tipH = tip.offsetHeight;
      tip.style.left = Math.max(8, Math.min(window.innerWidth - tipW - 8, rect.left + rect.width / 2 - tipW / 2)) + 'px';
      const aboveTop = rect.top - tipH - 8;
      tip.style.top = (aboveTop >= 8 ? aboveTop : Math.min(window.innerHeight - tipH - 8, rect.bottom + 8)) + 'px';
    } else {
      const e = evt && evt.native ? evt.native : evt;
      const cx = (e && e.clientX) || 0;
      const cy = (e && e.clientY) || 0;
      tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, cx + 14) + 'px';
      tip.style.top = Math.max(8, cy - tip.offsetHeight - 8) + 'px';
    }
  }

  // Touch devices don't fire mouseleave, so a tap on a marker leaves the
  // tooltip stuck. Hide on any touch outside the chart canvas.
  document.addEventListener('touchstart', (e) => {
    const tip = document.getElementById('anno-tip');
    if (!tip || tip.style.display === 'none') return;
    const canvas = currentChart && currentChart.canvas;
    if (canvas && canvas.contains(e.target)) return;
    hideAnnoTip();
  }, { passive: true });
  window.addEventListener('scroll', () => { hideAnnoTip(); }, { passive: true });
  function hideAnnoTip() {
    const tip = document.getElementById('anno-tip');
    if (tip) tip.style.display = 'none';
  }

  // Reflect activeFilters + filterAvailability onto every UI element that
  // represents a filter. Called after any filter change OR after renderSession
  // rebuilds the DOM, so the UI and state can't drift apart. Unavailable types
  // (no data this session) get a 'disabled' class; their clicks are ignored.
  function syncFilterUI() {
    document.querySelectorAll('.filter-chip[data-type], .layer-chip[data-layer]').forEach(chip => {
      const t = chip.dataset.type || chip.dataset.layer;
      const avail = !!filterAvailability[t];
      const on = !!activeFilters[t];
      chip.setAttribute('aria-pressed', String(on && avail));
      chip.disabled = !avail;
      if (!avail) chip.title = 'None here';
      else chip.removeAttribute('title');
    });
    const n = document.querySelector('#markers-open .n');
    if (n) n.textContent = ' · ' + Object.keys(activeFilters).filter((t) => activeFilters[t] && filterAvailability[t]).length;
  }

  function setFilter(type, on) {
    if (!(type in activeFilters)) return;
    if (!filterAvailability[type]) return; // can't toggle something with no data
    activeFilters[type] = !!on;
    syncFilterUI();
    if (currentSummary) {
      renderMarkerList(currentSummary);
      drawSessionChart(currentSummary, currentData);
    }
  }


  // Custom batching plugin for box overlays. Replaces the per-overlay walk
  // in chartjs-plugin-annotation for the bulk static set (warning bands,
  // BLE gaps, posture, sleep, deltas, flushes, chills, quadrants). On a
  // day-stitched session this drops chart.update() cost from ~30-50ms to
  // single-digit ms. Keeps pixel-identical output (same rgba fills, same
  // border widths, same float coords). Hover detection is one mousemove
  // hit-test against the cached pixel array.
  //
  // Overlays are passed via plugin options: { hrOverlays: { overlays: [...] } }.
  // Each overlay: { xMin, xMax, fill, border, borderWidth, borderDash, t, html }.
  const HR_OVERLAY_PLUGIN = {
    id: 'hrOverlays',
    afterUpdate(chart) {
      // The raw config: the resolved plugin options wrap every overlay in an option proxy.
      const raw = chart.config.options.plugins.hrOverlays;
      const overlays = (raw && raw.overlays) || [];
      if (!overlays.length) {
        chart._hrOvCache = null;
        chart._hrOvCacheKey = null;
        return;
      }
      const xs = chart.scales.x;
      const ca = chart.chartArea;
      if (!xs || !ca) return;
      const cacheKey = xs.min + '_' + xs.max + '_' + ca.left + '_' + ca.right + '_' + ca.top + '_' + ca.bottom + '_' + overlays.length;
      if (chart._hrOvCacheKey === cacheKey && chart._hrOvCache) return;
      chart._hrOvCacheKey = cacheKey;
      const out = new Array(overlays.length);
      for (let i = 0; i < overlays.length; i++) {
        const o = overlays[i];
        out[i] = {
          left: xs.getPixelForValue(o.xMin),
          right: xs.getPixelForValue(o.xMax),
          top: ca.top,
          bottom: ca.bottom,
          fill: o.fill,
          border: o.border,
          borderWidth: o.borderWidth || 0,
          borderDash: o.borderDash || null,
          t: o.t,
          html: o.html,
        };
      }
      chart._hrOvCache = out;
    },
    beforeDatasetsDraw(chart) {
      const cache = chart._hrOvCache;
      if (!cache || !cache.length) return;
      const ctx = chart.ctx;
      const ca = chart.chartArea;
      ctx.save();
      ctx.beginPath();
      ctx.rect(ca.left, ca.top, ca.right - ca.left, ca.bottom - ca.top);
      ctx.clip();
      // Pass 1: fills, batched by colour to amortise fillStyle swaps.
      let lastFill = null;
      for (let i = 0; i < cache.length; i++) {
        const o = cache[i];
        if (!o.fill) continue;
        if (o.fill !== lastFill) { ctx.fillStyle = o.fill; lastFill = o.fill; }
        ctx.fillRect(o.left, o.top, o.right - o.left, o.bottom - o.top);
      }
      // Pass 2: borders, batched by stroke + width + dash.
      let lastStroke = null, lastWidth = null, lastDash = '';
      for (let i = 0; i < cache.length; i++) {
        const o = cache[i];
        if (!o.border || !o.borderWidth) continue;
        if (o.border !== lastStroke) { ctx.strokeStyle = o.border; lastStroke = o.border; }
        if (o.borderWidth !== lastWidth) { ctx.lineWidth = o.borderWidth; lastWidth = o.borderWidth; }
        const dashStr = o.borderDash ? o.borderDash.join(',') : '';
        if (dashStr !== lastDash) { ctx.setLineDash(o.borderDash || []); lastDash = dashStr; }
        ctx.strokeRect(o.left, o.top, o.right - o.left, o.bottom - o.top);
      }
      ctx.setLineDash([]);
      ctx.restore();
    },
    afterEvent(chart, args) {
      const e = args.event;
      if (!e) return;
      const cache = chart._hrOvCache;
      if (e.type === 'mouseout') {
        if (chart._hrOvHoverIdx != null) {
          chart._hrOvHoverIdx = null;
          if (typeof annoLeave === 'function') annoLeave();
        }
        return;
      }
      if (e.type !== 'mousemove') return;
      if (!cache) return;
      const x = e.x, y = e.y;
      // Topmost rect under cursor — later entries draw on top.
      let hit = -1;
      for (let i = 0; i < cache.length; i++) {
        const o = cache[i];
        if (x >= o.left && x <= o.right && y >= o.top && y <= o.bottom) hit = i;
      }
      if (hit !== chart._hrOvHoverIdx) {
        chart._hrOvHoverIdx = hit;
        if (hit >= 0) annoEnter(cache[hit].t, cache[hit].html, e.native || e);
        else annoLeave();
      }
    },
  };

  // Mark labels left to right: a label that would run into the one before drops a row; past three rows it hides.
  function markLabelRows(marks) {
    let key = '', rows = [], halves = null;
    const order = marks.map((m, i) => i).sort((i, j) => marks[i].t - marks[j].t);
    return (chart) => {
      const x = chart.scales.x, a = chart.chartArea;
      const k = x.min + '|' + x.max + '|' + a.left + '|' + a.right;
      if (k === key) return rows;
      key = k;
      if (!halves) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '600 12px ' + Chart.defaults.font.family;
        halves = marks.map((m) => (ctx.measureText(m.text).width + 8) / 2);
        ctx.restore();
      }
      const ends = [-Infinity, -Infinity, -Infinity];
      rows = new Array(marks.length).fill(0);
      for (const i of order) {
        const px = x.getPixelForValue(marks[i].t);
        const half = halves[i];
        if (px + half < a.left || px - half > a.right) continue;
        let r = ends.findIndex((end) => px - half > end + 4);
        if (r < 0) r = 3;
        else ends[r] = px + half;
        rows[i] = r;
      }
      return rows;
    };
  }
  // Mark lines, labels and diamonds, drawn as chartjs-plugin-annotation drew them (same order, geometry and
  // canvas calls) from positions cached per x range and chart area; an update resolves nothing per mark.
  // marks: { ev_N: line, mk_N: diamond } in draw order; rowsOf: markLabelRows(...). Hover: the nearest mark whose
  // line or label covers the pointer x.
  function marksPlugin(marks, rowsOf) {
    let list = null;
    const plugin = {
    id: 'hrMarks',
    beforeInit(chart) { chart.$marks = marks; },
    _layout(chart) {
      const xs = chart.scales.x, ys = chart.scales.y, a = chart.chartArea;
      const key = xs.min + '_' + xs.max + '_' + a.left + '_' + a.right + '_' + a.top + '_' + a.bottom;
      if (chart._hrMkKey === key && chart._hrMk) return chart._hrMk;
      chart._hrMkKey = key;
      const H = Chart.helpers, ctx = chart.ctx;
      if (!list) list = Object.values(marks);
      const rows = rowsOf(chart);
      const topPx = ys ? ys.getPixelForValue(ys.max) : a.top;
      const out = [];
      let li = 0;
      for (const m of list) {
        if (m.type === 'point') {
          const px = xs.getPixelForValue(m.xValue);
          if (px >= a.left - 8 && px <= a.right + 8) out.push({ m, kind: 'dia', px, py: topPx + m.yAdjust });
          continue;
        }
        const r = rows[li++] || 0;
        m.label.display = r < 3;
        m.label.yAdjust = 18 + 20 * r;
        const px = xs.getPixelForValue(m.xMin);
        if (!(px >= a.left && px <= a.right)) continue;
        const it = { m, kind: 'line', px, lab: null };
        if (m.label.display) {
          if (!m._font) {
            m._font = H.toFont(m.label.font);
            ctx.save(); ctx.font = m._font.string; m._tw = ctx.measureText(m.label.content).width; ctx.restore();
          }
          const pad = m.label.padding, w = m._tw + 2 * pad, h = m._font.lineHeight + 2 * pad;
          let cx = px;
          if (w > a.right - a.left) cx = (a.right + a.left) / 2;
          else {
            if (a.left >= cx - pad - w / 2) cx = a.left + pad + w / 2;
            if (a.right <= cx + pad + w / 2) cx = a.right - pad - w / 2;
          }
          const cy = a.top + pad + h / 2 + m.label.yAdjust;
          it.lab = { x: cx - w / 2, y: cy - h / 2, w, h, cx };
        }
        out.push(it);
      }
      chart._hrMk = out;
      return out;
    },
    _draw(chart) {
      const items = this._layout(chart);
      if (!items.length) return;
      const H = Chart.helpers, ctx = chart.ctx, a = chart.chartArea;
      // One save for the pass; each item sets every state it draws with.
      H.clipArea(ctx, a);
      ctx.lineDashOffset = 0;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      let dash = null;
      for (const it of items) {
        const m = it.m;
        if (it.kind === 'dia') {
          const r = m.radius, x = it.px, y = it.py;
          if (dash !== '') { ctx.setLineDash([]); dash = ''; }
          ctx.fillStyle = m.backgroundColor;
          ctx.lineWidth = m.borderWidth;
          ctx.strokeStyle = m.borderColor;
          ctx.beginPath();
          ctx.moveTo(x - r, y);
          ctx.lineTo(x, y - r);
          ctx.lineTo(x + r, y);
          ctx.lineTo(x, y + r);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          continue;
        }
        const d = m.borderDash ? m.borderDash.join(',') : '';
        if (d !== dash) { ctx.setLineDash(m.borderDash || []); dash = d; }
        ctx.lineWidth = m.borderWidth;
        ctx.strokeStyle = m.borderColor;
        ctx.beginPath();
        ctx.moveTo(it.px, a.bottom);
        ctx.lineTo(it.px, a.top);
        ctx.stroke();
        const L = it.lab;
        if (!L) continue;
        const lo = m.label, pad = lo.padding;
        ctx.fillStyle = lo.backgroundColor;
        ctx.beginPath();
        const rad = Math.min(6, Math.min(L.w, L.h) / 2);
        H.addRoundedRectPath(ctx, { x: L.x, y: L.y, w: L.w, h: L.h, radius: { topLeft: rad, topRight: rad, bottomLeft: rad, bottomRight: rad } });
        ctx.closePath();
        ctx.fill();
        ctx.font = m._font.string;
        ctx.fillStyle = lo.color;
        ctx.fillText(lo.content, L.x + pad + (L.w - 2 * pad) / 2, L.y + pad + m._font.lineHeight / 2);
      }
      H.unclipArea(ctx);
    },
    beforeEvent(chart, args) {
      const e = args.event;
      if (!e || (e.type !== 'mousemove' && e.type !== 'mouseout')) return;
      let hit = null;
      if (e.type === 'mousemove' && chart._hrMk) {
        let best = Infinity;
        for (const it of chart._hrMk) {
          if (it.kind !== 'line') continue;
          const L = it.lab, d = Math.abs(e.x - it.px);
          const covers = d <= it.m.borderWidth / 2 || (L && e.x >= L.x - 0.001 && e.x <= L.x + L.w + 0.001);
          if (covers && d <= best) { best = d; hit = it.m; }
        }
      }
      if (hit === (chart._hrMkHover || null)) return;
      if (chart._hrMkHover) annoLeave();
      chart._hrMkHover = hit;
      if (hit) annoEnter(hit.t, hit.html, e);
    },
    };
    return Object.assign(plugin, lastDatasetLayer('hrMarks', (chart) => plugin._draw(chart)));
  }

  const _gapBroken = new WeakMap();
  function drawSessionChart(s, data) {
    const ctx = document.getElementById('session-chart').getContext('2d');
    if (currentChart) currentChart.destroy();

    // On the Day view the lines break inside each gap between and within recordings.
    const breakAtGaps = (arr) => {
      if (!s.__virtualDay || !(s.connGaps || []).length) return arr;
      const hit = _gapBroken.get(arr);
      if (hit && hit.gaps === s.connGaps) return hit.out;
      const out = arr.concat(s.connGaps.map(g => ({ x: (g.start + g.end) / 2, y: null }))).sort((a, b) => a.x - b.x);
      _gapBroken.set(arr, { gaps: s.connGaps, out });
      return out;
    };
    const hr = breakAtGaps(data.hr);
    const rmssd = breakAtGaps(data.rmssd);
    // Session start epoch — lets the x-axis flip between MM:SS duration and
    // absolute wall-clock time. Prefer the CSV's epoch_ms column (s.startEpoch)
    // since the filename string is UTC for web-recorded sessions but LOCAL
    // for native Android — parsing it as UTC adds a timezone offset to every
    // clock-time tick. Falls back to filename only when there's no epoch_ms.
    const sessionMeta = parseSessionFilename(currentFilename);
    const sessionStartEpochMs = (s && s.startEpoch)
      || (sessionMeta && sessionMeta.date ? sessionMeta.date.getTime() : null);

    // Palpitation cluster dots (one dot per cluster, sized by count). Binary
    // search per cluster instead of a full reduce — was O(clusters × samples)
    // and dominated render time on day-stitched views (50 clusters × 21k
    // samples = 1M comparisons). data.hr is sorted by x.
    const palpDots = activeFilters.palp ? s.palpClusters.map(c => {
      const midT = (c.start + c.end) / 2;
      const hr = data.hr;
      let lo = 0, hi = hr.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (hr[mid].x < midT) lo = mid + 1;
        else hi = mid;
      }
      const cand = hr[lo];
      const prev = lo > 0 ? hr[lo - 1] : null;
      const near = (prev && Math.abs(prev.x - midT) < Math.abs(cand.x - midT)) ? prev : cand;
      return { x: midT, y: near.y, _count: c.count, _start: c.start, _end: c.end };
    }) : [];

    // Box overlays: HR_OVERLAY_PLUGIN; marks: marksPlugin; max and min: maxMinPlugin.
    const hrOverlays = [];
    const marks = {};
    let idCounter = 0;
    let markLayer = null;

    if (currentQuadRanges) {
      const QUAD_LABELS = {
        'low-high': 'Low HR · High HRV (rest/recovery)',
        'high-high': 'High HR · High HRV (rebound)',
        'low-low': 'Low HR · Low HRV (fatigue)',
        'high-low': 'High HR · Low HRV (sympathetic stress)',
      };
      for (const key of Object.keys(activeQuadrants)) {
        if (!activeQuadrants[key]) continue;
        const color = QUAD_OVERLAY_COLORS[key];
        const label = QUAD_LABELS[key];
        const ranges = currentQuadRanges[key] || [];
        for (const r of ranges) {
          hrOverlays.push({
            xMin: r.start, xMax: r.end,
            fill: color.fill,
            border: color.border,
            borderWidth: 1,
            t: r.start,
            html: `<b>${label}</b><br/>${formatDuration(r.start)} → ${formatDuration(r.end)} (${formatDuration(r.end - r.start)})`,
          });
        }
      }
    }

    if (activeFilters.warning) {
      for (const w of s.warnSegs) {
        const label = warnLabel(w.type);
        const dur = formatDuration(w.end - w.start);
        hrOverlays.push({
          xMin: w.start, xMax: w.end,
          fill: 'rgba(232,152,88,0.12)',
          border: 'rgba(232,152,88,0.45)',
          borderWidth: 1,
          t: w.start,
          html: `<b>${label}</b><br/>${formatDuration(w.start)} → ${formatDuration(w.end)} (${dur})`,
        });
      }
    }
    if (activeFilters.disconnect) {
      for (const g of s.connGaps) {
        const dur = formatDuration(g.end - g.start);
        hrOverlays.push({
          xMin: g.start, xMax: g.end,
          fill: 'rgba(120,120,120,0.30)',
          border: 'rgba(160,160,160,0.55)',
          borderWidth: 1,
          t: g.start,
          html: `<b>Recording gap</b><br/>${formatDuration(g.start)} → ${formatDuration(g.end)} (${dur})<br/><span style="color: var(--text-dim);">No HR data during this span.</span>`,
        });
      }
    }
    if (activeFilters.delta && s.hrDeltas) {
      for (const d of s.hrDeltas) {
        const arrow = d.direction === 'rise' ? '↑' : '↓';
        hrOverlays.push({
          xMin: d.start, xMax: d.end,
          fill: 'rgba(180,140,255,0.10)',
          border: 'rgba(180,140,255,0.35)',
          borderWidth: 1,
          t: d.start,
          html: `<b>HR shift ${arrow} ${Math.abs(d.delta)} bpm</b><br/>${d.startHR} → ${d.endHR} bpm over ${formatDuration(d.end - d.start)}<br/>${formatDuration(d.start)} → ${formatDuration(d.end)}`,
        });
      }
    }
    if (activeFilters.event) {
      const rootStyle = getComputedStyle(document.documentElement);
      const tickColour = rootStyle.getPropertyValue('--text-dim').trim() || 'grey';
      const markColour = rootStyle.getPropertyValue('--text').trim() || 'white';
      const bgColour = rootStyle.getPropertyValue('--bg').trim() || 'black';
      const labelRows = markLabelRows(viewMarks(s).events.map((e) => ({ t: e.t, text: parseMark(e.label).label })));
      markLayer = marksPlugin(marks, labelRows);
      viewMarks(s).events.forEach((e) => {
        const mark = parseMark(e.label);
        const eLabel = mark.label;
        const eTime = formatDuration(e.t);
        const tick = mark.kind === 'context';
        const label = tick
          ? { display: true, content: eLabel, position: 'end', yAdjust: 18, backgroundColor: bgColour, color: tickColour, font: { size: 12, weight: '500' }, padding: 4 }
          : { display: true, content: eLabel, position: 'end', yAdjust: 18, backgroundColor: bgColour, color: markColour, font: { size: 12, weight: '600' }, padding: 4 };
        marks['ev_' + idCounter++] = {
          type: 'line',
          xMin: e.t, xMax: e.t,
          markKind: mark.kind,
          borderColor: tick ? tickColour : markColour,
          borderWidth: tick ? 1 : 1.25,
          borderDash: tick ? [4, 4] : undefined,
          label,
          t: e.t,
          html: `<b>${tick ? 'Context' : mark.kind === 'symptom' ? 'Symptom' : 'Note'}</b><br/>${escape(eLabel)} at ${eTime}`,
        };
        // Diamond handle at the top of a user mark; the top follows the y axis, so it never widens it.
        if (!tick) {
          const handle = {
            type: 'point',
            xValue: e.t,
            yAdjust: 7,
            pointStyle: 'rectRot',
            radius: 6,
            backgroundColor: markColour,
            borderColor: bgColour,
            borderWidth: 1.5,
          };
          marks['mk_' + idCounter++] = handle;
        }
      });
    }
    if (activeFilters.flush && s.flushes) {
      for (const f of s.flushes) {
        const markerT = (f.t != null) ? f.t : f.start;
        hrOverlays.push({
          xMin: f.start, xMax: f.end,
          fill: 'rgba(232,168,88,0.12)',
          border: 'rgba(232,168,88,0.6)',
          borderWidth: 1,
          t: markerT,
          html: `<b>Sympathetic flush</b><br/>HR +${f.hrDelta} bpm in ${formatDuration(f.end - f.start)}<br/>RMSSD ↓${f.rmssdDropPct}%<br/><span style='color: var(--text-dim);'>Cold flush / sudden arousal signature</span>`,
        });
      }
    }
    const postureSpans = getEffectivePostureSpans(s);
    if (activeFilters.posture && postureSpans && postureSpans.length) {
      const POSTURE_COLORS = {
        'lying': { fill: 'rgba(125,184,232,0.08)', border: 'rgba(125,184,232,0.35)' },
        'sitting': { fill: 'rgba(184,217,126,0.05)', border: 'rgba(184,217,126,0.25)' },
        'standing': { fill: 'rgba(232,152,88,0.08)', border: 'rgba(232,152,88,0.35)' },
      };
      for (const sp of postureSpans) {
        const c = POSTURE_COLORS[sp.posture];
        if (!c) continue;
        hrOverlays.push({
          xMin: sp.start, xMax: sp.end,
          fill: c.fill,
          border: c.border,
          borderWidth: 0,
          t: sp.start,
          html: `<b>Posture: ${sp.posture}</b><br/>${formatDuration(sp.start)} → ${formatDuration(sp.end)} (${formatDuration(sp.end - sp.start)})`,
        });
      }
    }
    const sleepWindows = getEffectiveSleepWindows(s);
    if (activeFilters.sleep && sleepWindows && sleepWindows.length) {
      for (const w of sleepWindows) {
        hrOverlays.push({
          xMin: w.start, xMax: w.end,
          fill: 'rgba(110,140,200,0.10)',
          border: 'rgba(110,140,200,0.4)',
          borderWidth: 1,
          borderDash: [4, 4],
          t: w.start,
          html: `<b>Sleep window</b><br/>${formatDuration(w.start)} → ${formatDuration(w.end)} (${formatDuration(w.end - w.start)})`,
        });
      }
    }
    if (activeFilters.chills && s.chillsWindows) {
      for (const c of s.chillsWindows) {
        let body;
        if (c.kind === 'vagal' && c.peakRmssd != null && c.baseRmssd != null) {
          const mult = c.baseRmssd > 0 ? (c.peakRmssd / c.baseRmssd).toFixed(1) : '—';
          body = `<b>Vagal burst</b><br/>RMSSD spiked to ${Math.round(c.peakRmssd)} ms (${mult}× baseline)<br/><span style='color: var(--text-dim);'>Frisson, cold onset, or ectopic-driven vagal surge</span>`;
        } else {
          const std = typeof c.std === 'number' ? c.std.toFixed(1) : '—';
          const ratio = typeof c.ratio === 'number' ? c.ratio.toFixed(1) : '—';
          body = `<b>Chills signature</b><br/>High HR volatility (std ${std} bpm, ${ratio}× session baseline)<br/><span style='color: var(--text-dim);'>Possible shivering or thermoregulatory event</span>`;
        }
        hrOverlays.push({
          xMin: c.start, xMax: c.end,
          fill: 'rgba(133,183,235,0.12)',
          border: 'rgba(133,183,235,0.6)',
          borderWidth: 1,
          t: c.start,
          html: body,
        });
      }
    }
    const maxMin = activeFilters.maxmin === false ? null : maxMinPlugin([
      { t: s.hrMax.t, v: s.hrMax.v, text: `Max ${s.hrMax.v}`, colour: STAGE_COLORS[getHRStage(s.hrMax.v)],
        place: labelInPlot(s.hrMax.t, s.hrMax.v, `Max ${s.hrMax.v}`, false) },
      { t: s.hrMin.t, v: s.hrMin.v, text: `Min ${s.hrMin.v}`, colour: STAGE_COLORS[getHRStage(s.hrMin.v)],
        place: labelInPlot(s.hrMin.t, s.hrMin.v, `Min ${s.hrMin.v}`, true) },
    ]);

    // Kill stale tooltip when pointer leaves the canvas entirely. Also clears
    // the marker-list / highlight-line state so nothing lingers on the chart
    // or sidebar after the cursor moves off.
    const canvasEl = document.getElementById('session-chart');
    canvasEl.addEventListener('mouseleave', () => { hideAnnoTip(); unhighlightAtTime(); clearMarkerItemHighlight(); });
    currentChart = new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [
          { label: 'HR', data: hr, hidden: activeFilters.hr === false, borderColor: '#E89858', backgroundColor: 'rgba(232,152,88,0.06)', yAxisID: 'y', tension: 0, pointRadius: 0, borderWidth: 1.5, fill: true, spanGaps: false },
          { label: 'RMSSD', data: rmssd, hidden: activeFilters.rmssd === false, borderColor: '#5DCAA5', backgroundColor: 'transparent', yAxisID: 'y1', tension: 0, pointRadius: 0, borderWidth: 1.5, borderDash: [3, 3], spanGaps: false },
          { label: 'Palp', data: palpDots, borderColor: 'transparent', backgroundColor: '#D76CBA', yAxisID: 'y', showLine: false, pointRadius: (c) => Math.min(3 + ((c.raw && c.raw._count) || 0), 10), pointHoverRadius: 12, pointStyle: 'circle' },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        parsing: false,
        normalized: true,
        // 200 ms debounce on the responsive observer. Without this, dragging
        // the window edge or animating the sidebar fires resize at ~60 Hz,
        // and on day-stitched sessions each fire re-lays-out 100+ annotations.
        resizeDelay: 200,
        // Snap to the vertical column at the cursor (index mode) so a single
        // tooltip surfaces every series at that timestamp — HR, RMSSD, any
        // palp cluster or event nearby — instead of separate popups per line.
        interaction: { mode: 'index', intersect: false, axis: 'x' },
        plugins: {
          legend: false,
          tooltip: {
            mode: 'index',
            intersect: false,
            callbacks: {
              title: (items) => items.length ? makeTimeTickFormatter(sessionStartEpochMs)(items[0].parsed.x) : '',
              label: (ctx) => {
                if (ctx.dataset.label === 'Palp') {
                  const p = ctx.raw;
                  return p._count === 1 ? `Ectopic beat` : `${p._count} palps in ${formatDuration(p._end - p._start)}`;
                }
                if (ctx.dataset.label === 'HR') return `HR ${Math.round(ctx.parsed.y)} bpm`;
                if (ctx.dataset.label === 'RMSSD') return `RMSSD ${Math.round(ctx.parsed.y)} ms`;
                return '';
              },
              afterBody: (items) => {
                // Pull any session-wide extras (events, warnings) that land
                // near the hovered timestamp. Palp clusters already appear as
                // their own dataset so no separate pull is needed.
                if (!items.length) return [];
                const xAt = items[0].parsed.x;
                const extras = [];
                const d = currentData;
                if (d && Array.isArray(d.events)) {
                  d.events
                    .filter(e => Math.abs((e.t || 0) - xAt) < 10 / 60)
                    .forEach(e => extras.push('Mark: ' + (parseMark(e.label).label || 'none')));
                }
                if (d && Array.isArray(d.warnings)) {
                  d.warnings
                    .filter(w => Math.abs((w.t || 0) - xAt) < 10 / 60)
                    .forEach(w => extras.push('Warning: ' + (w.type || '—')));
                }
                return extras;
              },
            },
            backgroundColor: 'rgba(15,15,15,0.97)',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            titleColor: '#d8d8d8',
            bodyColor: '#d8d8d8',
            titleFont: { size: 13, weight: '700' },
            bodyFont: { size: 13 },
            padding: 10,
            boxPadding: 4,
          },
          hrOverlays: { overlays: hrOverlays },
          // DECIMATION_PLUGIN: min-max at every zoom over the visible range only (Chart.js otherwise updates every
          // element of the day on a range change).
          decimation: false,
        },
        scales: {
          x: {
            type: 'linear',
            min: brushMin !== null ? brushMin : 0,
            max: brushMax !== null ? brushMax : s.duration,
            ticks: { color: '#9a9a9a', font: { size: 12 }, callback: makeTimeTickFormatter(sessionStartEpochMs) },
            grid: { color: 'rgba(255,255,255,0.04)' },
          },
          y: {

    window.addEventListener('hashchange', route);
    if (demo) {
      document.querySelectorAll('#drive-pop .dp-actions, #drive-pop .fsa-only, #drive-email').forEach(el => el.hidden = true);
    } else {
      if (!window.showDirectoryPicker) {
        document.querySelectorAll('.fsa-only').forEach(el => el.hidden = true);
        const emptyPick = document.getElementById('empty-pick');
        if (emptyPick) emptyPick.hidden = true;
      } else {
        document.getElementById('folder-pick').addEventListener('click', pickFolder);
        document.getElementById('empty-pick').addEventListener('click', pickFolder);
      }
      document.getElementById('empty-drive').addEventListener('click', driveSignIn);
      document.getElementById('drive-signin').addEventListener('click', driveSignIn);
      document.getElementById('drive-signout').addEventListener('click', driveSignOut);
      document.getElementById('drive-sync').addEventListener('click', () => {
        driveSync()
          .then(async () => { if (await marksSyncPass()) route(); })
          .catch(e => { console.error(e); setDriveError('sync failed'); });
      });
    }
    const viewSel = document.getElementById('view-select');
    let selArrowAt = 0;
    viewSel.addEventListener('keydown', (e) => { if (/^Arrow|^Home$|^End$|^Page/.test(e.key)) selArrowAt = Date.now(); });
    viewSel.addEventListener('change', () => {
      const v = viewSel.value;
      if (v === 'monitor' && Date.now() - selArrowAt < 300) {
        const { view, arg } = parseHash();
        viewSel.value = barTabView(view, arg);
        return;
      }
      if (v === 'monitor') {
        const link = document.getElementById('monitor-link');
        const { view, arg } = parseHash();
        viewSel.value = barTabView(view, arg);
        if (link.target === '_blank') window.open(link.href, '_blank', 'noopener');
        else location.href = link.href;
        return;
      }
      const tab = document.querySelector('.view-tabs a[data-view="' + v + '"]');
      location.hash = tab ? tab.getAttribute('href') : '#/' + v;
    });
    const cloudBtn = document.getElementById('drive-cloud');
    const drivePop = document.getElementById('drive-pop');
    const setPop = (open) => {
      drivePop.hidden = !open;
      cloudBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    cloudBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const vs = document.getElementById('viewer-settings-popover');
      if (vs) vs.classList.remove('open');
      setPop(drivePop.hidden);
    });
    document.addEventListener('click', (e) => {
      if (drivePop.hidden || drivePop.contains(e.target)) return;
      setPop(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !drivePop.hidden) { setPop(false); cloudBtn.focus(); }
    });
    window.addEventListener('resize', fitBar);
    paintCloud();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBar);
    applyAutonomicClass();
    document.getElementById('viewer-settings-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      setPop(false);
      const pop = document.getElementById('viewer-settings-popover');
      if (pop && pop.classList.contains('open')) {
        pop.classList.remove('open');
      } else {
        openViewerSettings(e.currentTarget);
      }
    });
    document.getElementById('export-report').addEventListener('click', () => { rptOpenMenu().catch(e => console.warn('[report] menu failed', e)); });
    // Summary-bar collapse toggle (mobile only). Same pattern as the
    // section/insight carets in this file: tap anywhere on the bar to
    // toggle. Delegated because the bar is re-rendered inside
    // renderSession each navigation. Persist the choice across reloads.
    document.addEventListener('click', (e) => {
      const bar = e.target.closest && e.target.closest('#summary-bar');
      if (!bar) return;
      if (e.target.closest('#summary-bar-kebab')) return;
      if (e.target.closest('#summary-bar-menu')) return;
      const collapsed = bar.classList.toggle('collapsed');
      fitSummaryStats();
      try { localStorage.setItem('hrv_summary_collapsed', collapsed ? '1' : '0'); } catch (err) {}
    });
    setupKeyboardNav();
    window.addEventListener('afterprint', () => {
      rptAfterPrint();
      document.body.classList.remove('printing');
      resizeAllViewerCharts();
    });
  }

  function showLoader(current, total, label) {
    const banner = document.getElementById('viewer-loading');
    const fill = document.getElementById('viewer-loading-fill');
    const text = document.getElementById('viewer-loading-text');
    if (!banner) return;
    if (total <= 0) { banner.classList.remove('shown'); return; }
    banner.classList.add('shown');
    if (fill) fill.style.width = (total > 0 ? (current / total * 100) : 0) + '%';
    const lab = label || 'Parsing sessions';
    if (text) text.textContent = current >= total ? 'Done' : `${lab}… ${current} of ${total}`;
  }
  function showSyncLoader(current, total) {
    if (!Object.keys(sessionsIndex).length) showLoader(current, total, 'Syncing with Drive');
    cloud.loader = total > 0 && current < total;
    if (total > 0) cloud.frac = current / total;
    paintCloud();
  }
  function hideLoader() {
    const banner = document.getElementById('viewer-loading');
    if (banner) banner.classList.remove('shown');
    if (cloud.loader) { cloud.loader = false; paintCloud(); }
  }

  // The native restore overlay belongs to the monitor; the viewer never shows it.
  function hideRestoreOverlay() {
    try { if (window.HRMRestoreOverlay) window.HRMRestoreOverlay.hide(); } catch (e) {}
  }

  async function init() {
    hideRestoreOverlay();
    // Native shows the overlay on every resume while recording, sometimes just after this page wakes, so a single
    // hide can land first and the overlay then sits until its 60 s fence (Khal 2026-10-12). Hide again briefly after.
    const hideAfterResume = () => { hideRestoreOverlay(); [250, 750, 1500, 3000].forEach((ms) => setTimeout(hideRestoreOverlay, ms)); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') hideAfterResume(); });
    window.addEventListener('focus', hideAfterResume);
    window.addEventListener('pageshow', hideAfterResume);
    const demo = isDemoMode();
    bindUiHandlers(demo);
    if (!location.hash) setHash('day');
    let painted = false;
    if (demo) {
      const es = document.getElementById('empty-state');
      if (es) es.style.display = 'none';
      showDemoBanner();
    } else {
      await restoreFolder();
      driveLoadMeta();
      driveUpdateUI();
      updateWatchLiveUI();
      marksInit();
      if (!dirHandle && await paintFromCache()) painted = true;
      initDriveUI();
    }
    // Initial paint, empty-state if nothing's loaded yet.
    if (!painted) route();
    try {
      if (demo) {
        await loadDemoSessions();
      } else if (painted) {
        // initDriveUI started the sync when a token is cached; the guard makes this call a no-op then.
        const signedIn = !!(window.aortiAuth && typeof window.aortiAuth.isSignedIn === 'function' && window.aortiAuth.isSignedIn());
        if (signedIn) ensureFolderSyncAndRender().catch(e => console.error('[init] drive sync failed:', e));
      } else if (dirHandle) {
        const perm = await dirHandle.queryPermission({ mode: 'read' });
        if (perm === 'granted') await loadSessions({ onProgress: showLoader });
      } else {
        // Drive-only context. Await the load synchronously here so init's
        // final route() at the end of this function sees freshly-pulled
        // data. The previous fire-and-forget pattern (initDriveUI's auth-
        // change callback firing ensureFolderSyncAndRender async) left
        // init finishing with an empty sessionsIndex on F5, so the user
        // saw "no sessions yet" until the async chain completed — and
        // sometimes the eventual re-render never landed.
        const isAuthed = !!(window.aortiAuth && typeof window.aortiAuth.isSignedIn === 'function' && window.aortiAuth.isSignedIn());
        if (isAuthed) {
          try { await ensureFolderSyncAndRender(); }
          catch (e) { console.error('[init] drive sync failed:', e); }
        } else {
          await loadSessions({ onProgress: showSyncLoader });
        }
      }
    } catch (e) {
      console.error('[init] load failed', e);
    } finally {
      hideLoader();
    }
    // Re-render now that data is in.
    if (!painted) route();
  }
  init();
})();
</script>
</body>
</html>
