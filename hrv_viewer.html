  }
  window.__aortiReport = { prepare: (iso) => rptPrepare(iso || rptDayIso()), pageCount: async (iso) => rptPageCount(await rptModel(iso || rptDayIso())), dayIso: () => rptDayIso(), clear: rptClear, share: (iso) => rptShare(iso || rptDayIso(), 'share'), save: (iso) => rptShare(iso || rptDayIso(), 'save') };
  // ===== Day report (S44) END =====

  // ===== Keyboard nav: ← / → move between adjacent sessions or days =====
  function setupKeyboardNav() {
    document.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const { view, arg } = parseHash();
      const dir = e.key === 'ArrowLeft' ? -1 : 1;
      if (view === 'session') {
        const all = Object.keys(sessionsIndex).sort(compareFilesByStart);
        const idx = all.indexOf(decodeURIComponent(arg || ''));
        if (idx < 0) return;
        const next = idx + dir;
        if (next >= 0 && next < all.length) setHash('session/' + encodeURIComponent(all[next]));
      } else if (view === 'day' || view === 'month' || view === 'week') {
        const btn = document.getElementById(view + (dir < 0 ? '-prev' : '-next'));
        if (btn) btn.click();
      }
    });
  }

  // Aggregate report builder shared by Day / Week / Month views. Takes a list
  // of filenames and a scope label ('Daily', 'Weekly', 'Monthly'), walks the
  // session summaries, and renders an accordion-style report in the same
  // visual format as the session-level report. Keeps the viewer's reports
  // consistent so switching views doesn't change how findings are presented.
  function buildAggregateReport(scopeLabel, files, dayIso) {
    const autonomicOn = isAutonomicOn();
    if (!files || !files.length) return '';
    const summaries = files.map(fn => sessionsIndex[fn]).filter(Boolean);
    if (!summaries.length) return '';

    // For day-scoped aggregates, clip each session's contribution to the
    // portion that falls within that day. Otherwise an overnight session
    // counts its full duration on both start and continuation days.
    function effDuration(s) {
      if (!dayIso) return s.duration;
      const p = typeof sessionDayPortion === 'function' ? sessionDayPortion(s, dayIso) : null;
      return p && p.durationMin > 0 ? p.durationMin : s.duration;
    }

    // Day-scoped display duration uses interval UNION, not sum. When two
    // sessions overlap (dual-save dupes, rehydrate resume), summing
    // portions double-counts the overlap; a single 24h day can't contain
    // >24h of recording. Weighting divisions below still use the summed
    // portion durations, which stays consistent with how weighted sums
    // are accumulated per-session.
    function dayUnionDuration() {
      if (!dayIso) return summaries.reduce((s, x) => s + (x.duration || 0), 0);
      const { start: dayStart, end: dayEnd } = dayWindow(dayIso);
      const intervals = [];
      for (const s of summaries) {
        if (!s) continue;
        if (s.startEpoch && s.duration) {
          const a = Math.max(s.startEpoch, dayStart);
          const b = Math.min(s.startEpoch + s.duration * 60000, dayEnd);
          if (b > a) intervals.push([a, b]);
        }
      }
      if (!intervals.length) return 0;
      intervals.sort((x, y) => x[0] - y[0]);
      let total = 0, curStart = intervals[0][0], curEnd = intervals[0][1];
      for (let i = 1; i < intervals.length; i++) {
        if (intervals[i][0] <= curEnd) curEnd = Math.max(curEnd, intervals[i][1]);
        else { total += curEnd - curStart; curStart = intervals[i][0]; curEnd = intervals[i][1]; }
      }
      total += curEnd - curStart;
      return total / 60000;
    }

    let totalDur = 0;
    let weightedHR = 0, weightedRmssd = 0, rmssdDur = 0;
    let totalPalps = 0, totalShifts = 0, totalFlushes = 0, totalChills = 0;
    let totalWarnings = 0, totalGaps = 0, totalGapDur = 0;
    let weightedTachy = 0;
    let maxHR = 0, minHR = 9999;
    let longest = null, mostPalps = null, widestRange = null;
    const postureDur = { lying: 0, sitting: 0, standing: 0 };
    let sleepMin = 0;
    for (const s of summaries) {
      const dur = effDuration(s);
      totalDur += dur;
      weightedHR += (s.hrAvg || 0) * dur;
      if (s.rmssdAvg != null) { weightedRmssd += s.rmssdAvg * dur; rmssdDur += dur; }
      totalPalps += s.palpCount || 0;
      totalShifts += (s.hrDeltas || []).length;
      totalFlushes += (s.flushes || []).length;
      totalChills += (s.chillsWindows || []).length;
      totalWarnings += s.warnCount || 0;
      totalGaps += (s.connGaps || []).length;
      totalGapDur += (s.connGaps || []).reduce((sum, g) => sum + (g.end - g.start), 0);
      weightedTachy += (s.tachyPct || 0) * dur;
      if (s.hrMax && s.hrMax.v > maxHR) maxHR = s.hrMax.v;
      if (s.hrMin && s.hrMin.v < minHR) minHR = s.hrMin.v;
      if (!longest || s.duration > longest.duration) longest = s;
      if (!mostPalps || (s.palpCount || 0) > (mostPalps.palpCount || 0)) mostPalps = s;
      if (s.hrMax && s.hrMin) {
        const r = s.hrMax.v - s.hrMin.v;
        if (!widestRange || r > (widestRange.hrMax.v - widestRange.hrMin.v)) widestRange = s;
      }
      for (const sp of (getEffectivePostureSpans(s) || [])) {
        postureDur[sp.posture] = (postureDur[sp.posture] || 0) + (sp.end - sp.start);
      }
      for (const w of (getEffectiveSleepWindows(s) || [])) sleepMin += (w.end - w.start);
    }
    const avgHR = totalDur > 0 ? Math.round(weightedHR / totalDur) : null;
    const avgRmssd = rmssdDur > 0 ? Math.round(weightedRmssd / rmssdDur) : null;
    const avgTachy = totalDur > 0 ? Math.round(weightedTachy / totalDur) : 0;

    const displayDur = dayIso ? dayUnionDuration() : totalDur;

    const sections = [];
    // Overview — always present.
    {
      const lines = [];
      lines.push({ text: `${summaries.length} session${summaries.length === 1 ? '' : 's'}`, sub: `${formatDuration(displayDur)} total recorded` });
      if (avgHR != null) lines.push({ text: `Average HR: ${avgHR} bpm`, sub: `range across all sessions ${minHR}–${maxHR} bpm` });
      if (avgRmssd != null) lines.push({ text: `Average HRV (RMSSD): ${avgRmssd} ms`,
        what: 'HRV is how much the gap between heartbeats changes from beat to beat. Higher usually means relaxed or recovered. Lower can mean stressed, tired, or fighting off something. Most adults sit between 20 and 90 ms at rest.' });
      if (avgTachy > 0) lines.push({ text: `${avgTachy}% of recorded time above 100 bpm`, sub: 'tachycardia range' });
      sections.push({ key: 'overview', title: 'Overview', lines });
    }

    // Notable sessions — highlights worth clicking into. Each line carries an
    // `open` hint (filename) so the render path can turn the timestamp into a
    // click-through button.
    if (summaries.length > 1) {
      const lines = [];
      if (longest) {
        const meta = parseSessionFilename(longest.filename);
        lines.push({
          text: `Longest session: ${formatDuration(longest.duration)}`,
          sub: `avg ${longest.hrAvg} bpm${longest.rmssdAvg != null ? `, HRV ${longest.rmssdAvg} ms` : ''}${meta ? `, ${meta.isoDate} ${meta.isoTime}` : ''}`,
          open: longest.filename,
        });
      }
      if (widestRange) {
        const r = widestRange.hrMax.v - widestRange.hrMin.v;
        const meta = parseSessionFilename(widestRange.filename);
        lines.push({
          text: `Widest HR range: Δ ${r} bpm`,
          sub: `${widestRange.hrMin.v} → ${widestRange.hrMax.v} bpm${meta ? ` on ${meta.isoDate} ${meta.isoTime}` : ''}`,
          open: widestRange.filename,
        });
      }
      if (mostPalps && mostPalps.palpCount > 0) {
        const meta = parseSessionFilename(mostPalps.filename);
        lines.push({
          text: `Most palpitations in a session: ${mostPalps.palpCount}`,
          sub: `${(mostPalps.palpClusters || []).length} cluster${(mostPalps.palpClusters || []).length === 1 ? '' : 's'}${meta ? ` on ${meta.isoDate} ${meta.isoTime}` : ''}`,
          open: mostPalps.filename,
        });
      }
      if (lines.length) sections.push({
        key: 'notable',
        title: 'Notable sessions',
        desc: 'Quick callouts across every session in this period. Good places to click in if you\'re hunting for patterns. The longest session gives the most statistical weight; the widest HR range tends to mark orthostatic or activity-heavy sessions; the heaviest palp session is worth reviewing in detail.',
        lines,
      });
    }

    // Palpitations aggregate
    if (totalPalps > 0) {
      sections.push({
        key: 'palps',
        title: 'Palpitations',
        desc: 'Total ectopic beats across this period. A few per session is routine for most people; frequent clusters or palps that track a specific trigger (standing, breath-holding, post-meal) are the ones worth paying attention to.',
        count: totalPalps,
        lines: [{ text: `${totalPalps} ectopic beat${totalPalps === 1 ? '' : 's'} detected`, sub: `across ${summaries.length} session${summaries.length === 1 ? '' : 's'}` }],
      });
    }

    // HR shifts aggregate
    if (totalShifts > 0) {
      sections.push({
        key: 'shifts',
        title: 'HR shifts',
        desc: 'Count of qualifying HR jumps across this period. Threshold and window are configurable via the gear icon at the top right; default is the clinical POTS criterion (30 bpm within 10 minutes).',
        count: totalShifts,
        lines: [{ text: `${totalShifts} shift${totalShifts === 1 ? '' : 's'} detected` }],
      });
    }

    if (autonomicOn && totalFlushes > 0) {
      sections.push({
        key: 'flushes',
        title: 'Sympathetic flushes',
        desc: 'Count of quick HR-spike-plus-HRV-drop patterns across the period. Each one marks a short sympathetic activation burst; trigger-tracking tends to be more useful than raw count.',
        count: totalFlushes,
        lines: [{ text: `${totalFlushes} flush${totalFlushes === 1 ? '' : 'es'} across all sessions` }],
      });
    }
    if (autonomicOn && totalChills > 0) {
      sections.push({
        key: 'chills',
        title: 'Chills / high volatility',
        desc: 'Stretches where the beat-to-beat HR jittered more than baseline across this period. Often literal chills (muscle tremor leaks into the strap signal); can also show up during bigger autonomic waves.',
        count: totalChills,
        lines: [{ text: `${totalChills} high-volatility window${totalChills === 1 ? '' : 's'}` }],
      });
    }

    // Posture & sleep
    {
      const lines = [];
      if (sleepMin > 0) lines.push({ text: `Sleep windows: ${formatDuration(sleepMin)} total`, sub: 'auto-detected from low HR + high HRV stretches' });
      const postureParts = [];
      if (postureDur.lying > 0) postureParts.push(`${formatDuration(postureDur.lying)} lying`);
      if (postureDur.sitting > 0) postureParts.push(`${formatDuration(postureDur.sitting)} sitting`);
      if (postureDur.standing > 0) postureParts.push(`${formatDuration(postureDur.standing)} standing`);
      if (postureParts.length) lines.push({ text: 'Posture time', sub: postureParts.join(' · ') });
      if (lines.length) sections.push({
        key: 'posture',
        title: 'Posture & sleep',
        desc: 'Sleep comes from the auto-detector; posture from whatever you tagged in the live monitor. Tagging posture consistently improves the accuracy of every other stat here because HR changes dramatically with position.',
        lines,
      });
    }

    // Warnings & connection
    if (totalWarnings > 0 || totalGaps > 0) {
      const lines = [];
      if (totalWarnings > 0) lines.push({ text: `${totalWarnings} warning segment${totalWarnings === 1 ? '' : 's'}`, sub: 'threshold crossings you configured in the live monitor' });
      if (totalGaps > 0) lines.push({ text: `${totalGaps} recording gap${totalGaps === 1 ? '' : 's'}`, sub: `${formatDuration(totalGapDur)} with no data recorded` });
      sections.push({
        key: 'connection',
        title: 'Warnings & connection',
        desc: 'Warnings are the threshold crossings you set in the live monitor (HR high/low, HRV crash, palps elevated). Recording gaps are stretches with no data. The strap lost contact, Bluetooth dropped, or the phone stopped the app.',
        lines,
      });
    }

    // Render using the same DOM structure as session-level reports.
    const chevron = `<svg class="insight-chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
    const childChevron = `<svg class="insight-child-chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
    const summaryBits = [];
    if (avgHR != null) summaryBits.push(`avg ${avgHR} bpm`);
    summaryBits.push(`${summaries.length} session${summaries.length === 1 ? '' : 's'}`);
    if (totalPalps > 0) summaryBits.push(`${totalPalps} palp${totalPalps === 1 ? '' : 's'}`);
    const summaryText = summaryBits.join(' · ');
    const bodyHtml = sections.map(sec => {
      const countHtml = sec.count != null ? `<span class="insight-count">${sec.count}</span>` : '';
      const descHtml = sec.desc ? `<div class="insight-desc">${escape(sec.desc)}</div>` : '';
      const listHtml = sec.lines.map(l => {
        const subParts = [];
        if (l.sub) subParts.push(`<span>${escape(l.sub)}</span>`);
        if (l.open) subParts.push(`<button class="ui btn ghost insight-jump" type="button" data-open="${encodeURIComponent(l.open)}">Open session</button>`);
        const subHtml = subParts.length ? `<div class="insight-sub">${subParts.join(' · ')}</div>` : '';
        const whatHtml = (autonomicOn && l.what) ? `<div class="insight-what">${escape(l.what)}</div>` : '';
        return `<li><div>${escape(l.text)}</div>${subHtml}${whatHtml}</li>`;
      }).join('');
      const collapsedCls = sec.key === 'overview' ? '' : ' collapsed';
      return `<div class="insight-section${collapsedCls}" data-key="${sec.key}">
        <div class="insight-section-title">${childChevron}<span>${escape(sec.title)}</span>${countHtml}</div>
        <div class="insight-section-body">${descHtml}<ul>${listHtml}</ul></div>
      </div>`;
    }).join('');
    return `<div class="insight-box collapsed aggregate-report">
      <div class="insight-master-head">
        ${chevron}
        <span>${escape(scopeLabel)} report</span>
        <span class="insight-master-summary">${escape(summaryText)}</span>
      </div>
      <div class="insight-body">${bodyHtml}</div>
    </div>`;
  }
  function wireAggregateReport(viewEl) {
    const scope = viewEl || document;
    const box = scope.querySelector('.aggregate-report');
    if (!box) return;
    const head = box.querySelector('.insight-master-head');
    head.addEventListener('click', () => { box.classList.toggle('collapsed'); });
    box.querySelectorAll('.insight-section[data-key]').forEach(sec => {
      const title = sec.querySelector('.insight-section-title');
      title.addEventListener('click', () => sec.classList.toggle('collapsed'));
    });
    // Notable-session "open session" buttons — jump straight to the session
    // view for whichever session the aggregate callout was about.
    box.querySelectorAll('.insight-jump[data-open]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const fn = btn.dataset.open;
        if (fn) setHash('session/' + fn);
      });
    });
  }

  function renderInsight(s) {
    // Build an ordered list of accordion sections. Each entry:
    //   { key, title, desc?, count?, lines: [{ text, sub?, at? }] }
    // - desc: one-line plain-English explanation of what the metric is
    // - lines[].at: optional { t, label } for a clickable timestamp that zooms
    //   the chart to that moment
    // Sections with no lines are skipped entirely. Interpretive sections (flush
    // / chills / quadrant) are only added when autonomic analysis is ON.
    const sections = [];
    const autonomicOn = isAutonomicOn();

    // 1. Overview — always shown, plain-English vitals. RMSSD gets an
    // explanation line so users can tell whether "28 ms" is good or bad.
    {
      const lines = [];
      lines.push({ text: `Duration: ${formatDuration(s.duration)}` });
      lines.push({
        text: `Average HR: ${s.hrAvg} bpm`,
        sub: `low ${s.hrMin.v} · peak ${s.hrMax.v}`,
        at: { t: s.hrMax.t, label: `peak @ ${formatDuration(s.hrMax.t)}` },
      });
      if (s.rmssdAvg != null) {
        const sub = s.rmssdMin ? `lowest ${Math.round(s.rmssdMin.v)} ms @ ${formatDuration(s.rmssdMin.t)}` : '';
        lines.push({
          text: `Average HRV (RMSSD): ${s.rmssdAvg} ms`,
          sub,
          what: 'HRV is how much the gap between heartbeats changes from beat to beat. Higher usually means relaxed or recovered. Lower can mean stressed, tired, or fighting off something. Most adults sit between 20 and 90 ms at rest.',
          at: s.rmssdMin ? { t: s.rmssdMin.t, label: `low @ ${formatDuration(s.rmssdMin.t)}` } : null,
        });
      }
      if (s.tachyPct > 20) {
        lines.push({
          text: `${s.tachyPct}% of session above 100 bpm`,
          sub: 'Tachycardia range',
          what: 'Tachycardia is an HR above 100 bpm. Normal during exercise or stress. Worth noticing if it happens while you are just sitting still.',
        });
      }
      sections.push({ key: 'overview', title: 'Overview', lines });
    }

    // 2. Noteworthy moments — windows where HR or HRV held a sustained departure
    // from this session's own median. Plain-English neutral phrasing so no one
    // reads it as a diagnosis. Autonomic ON adds a short pattern descriptor.
    if (s.noteworthy && s.noteworthy.length) {
      const lines = s.noteworthy.slice(0, 4).map(n => {
        const dur = formatDuration(n.end - n.start);
        const when = formatDuration(n.start) + ' to ' + formatDuration(n.end);
        const winMed = Math.round(n.windowMedian);
        const sessMed = Math.round(n.sessionMedian);
        const delta = Math.round(Math.abs(n.delta));
        let text, sub;
        if (n.kind === 'hr_low') {
          text = 'HR dipped to around ' + winMed + ' bpm for ' + dur + '.';
          sub = 'Roughly ' + delta + ' bpm below the rest of the session (typical ' + sessMed + ').';
        } else if (n.kind === 'hr_high') {
          text = 'HR climbed to around ' + winMed + ' bpm for ' + dur + '.';
          sub = 'Roughly ' + delta + ' bpm above the rest of the session (typical ' + sessMed + ').';
        } else if (n.kind === 'hrv_low') {
          text = 'HRV dropped to around ' + winMed + ' ms for ' + dur + '.';
          sub = 'Noticeably lower than your session median (' + sessMed + ' ms).';
        } else {
          text = 'HRV rose to around ' + winMed + ' ms for ' + dur + '.';
          sub = 'Noticeably higher than your session median (' + sessMed + ' ms).';
        }
        let what = null;
        if (autonomicOn) {
          if (n.kind === 'hr_low' || n.kind === 'hrv_high') {
            what = 'Low HR or rising HRV usually shows up during rest or recovery. The body is in a calmer, parasympathetic state.';
          } else {
            what = 'High HR or dropping HRV usually shows up during activity, stress, standing up, or an autonomic flare. The body is in a more activated, sympathetic state.';
          }
        }
        return { text, sub, what, at: { t: n.start, label: 'jump to ' + formatDuration(n.start) } };
      });
      sections.push({
        key: 'noteworthy',
        title: 'Noteworthy moments',
        desc: 'Stretches where your HR or HRV behaved noticeably differently from the rest of the session. Each callout is a window where the rolling-window median sat more than 1.5 MAD (a robust standard-deviation substitute) away from the session baseline, with a floor of 10 bpm for HR and 35% for HRV so small drifts don\'t trigger. These are pattern callouts based on your own data; they don\'t diagnose anything.',
        count: s.noteworthy.length,
        lines,
      });
    }

    // 3. Palpitations — neutral terminology (ectopic beat = a heartbeat that
    // fires off-rhythm). Always shown when present, no autonomic gating needed.
    if (s.palpCount > 0) {
      const lines = [];
      if (s.palpClusters.length === 1) {
        const c = s.palpClusters[0];
        lines.push({
          text: `${s.palpCount} ectopic beat${s.palpCount === 1 ? '' : 's'}`,
          sub: `1 cluster @ ${formatDuration(c.start)}`,
          at: { t: c.start, label: `jump to @ ${formatDuration(c.start)}` },
        });
      } else {
        lines.push({ text: `${s.palpCount} ectopic beats`, sub: `${s.palpClusters.length} clusters` });
        for (const c of s.palpClusters.slice(0, 3)) {
          lines.push({
            text: `Cluster @ ${formatDuration(c.start)}`,
            sub: `${c.count} beat${c.count === 1 ? '' : 's'} over ${formatDuration(c.end - c.start)}`,
            at: { t: c.start, label: `jump to @ ${formatDuration(c.start)}` },
          });
        }
      }
      sections.push({
        key: 'palps',
        title: 'Palpitations',
        desc: 'An ectopic beat is a heartbeat that fires off-rhythm. The interval between beats is noticeably longer or shorter than expected. A handful per session is routine for most people and rarely reflects anything wrong. Bigger clusters, or beats that track a specific trigger like standing or breath-holding, tend to be the ones worth paying attention to. What they feel like in the chest varies. Some people describe a flutter, a "skipped" beat, or a heavy thump.',
        count: s.palpCount,
        lines,
      });
    }

    // 3. HR shifts — purely descriptive. No autonomic framing here; just the
    // math (a sudden rise or drop). User can interpret it however they like.
    if (s.hrDeltas && s.hrDeltas.length > 0) {
      const rises = s.hrDeltas.filter(d => d.direction === 'rise');
      const drops = s.hrDeltas.filter(d => d.direction === 'drop');
      const biggest = s.hrDeltas.reduce((a, b) => Math.abs(b.delta) > Math.abs(a.delta) ? b : a);
      const arrow = biggest.direction === 'rise' ? '↑' : '↓';
      const lines = [
        { text: `${rises.length} rise · ${drops.length} drop`, sub: '≥20 bpm within 10 minutes' },
        {
          text: `Biggest shift: ${arrow}${Math.abs(biggest.delta)} bpm`,
          sub: `${biggest.startHR} → ${biggest.endHR} bpm in ${formatDuration(biggest.end - biggest.start)}`,
          at: { t: biggest.start, label: `jump to @ ${formatDuration(biggest.start)}` },
        },
      ];
      sections.push({
        key: 'shifts',
        title: 'HR shifts',
        desc: 'Big jumps in heart rate that happened quickly, rising or falling beyond the threshold you set in the viewer settings (gear icon, top right). Common triggers include standing up from seated, exercise, caffeine, a loud noise, or strong emotion. Default detection window is 10 minutes with a 30 bpm threshold, which matches the clinical POTS orthostatic criterion; a smaller threshold surfaces more ordinary everyday jumps.',
        count: s.hrDeltas.length,
        lines,
      });
    }

    // 4. Sympathetic flushes — INTERPRETIVE, only when autonomic on.
    if (autonomicOn && s.flushes && s.flushes.length > 0) {
      const lines = s.flushes.slice(0, 4).map(f => ({
        text: `+${f.hrDelta} bpm HR · ${f.rmssdDropPct}% HRV drop`,
        sub: `@ ${formatDuration(f.t != null ? f.t : f.start)} (${formatDuration(f.end - f.start)})`,
        at: { t: (f.t != null ? f.t : f.start), label: `jump @ ${formatDuration(f.t != null ? f.t : f.start)}` },
      }));
      sections.push({
        key: 'flushes',
        title: 'Sympathetic flushes',
        desc: 'A quick HR spike paired with a drop in HRV at the same time. That combination is the fingerprint of a short burst of fight-or-flight activation. In dysautonomia it often shows up as a cold flush, a sudden wave of warmth, or prickly skin. In everyday life the same pattern fires briefly when you stand up fast, hear a sudden noise, take a cold shower, feel a strong emotion, or get an unexpected adrenaline kick. Each callout below is one detected flush with its magnitude and timestamp.',
        count: s.flushes.length,
        lines,
      });
    }

    // 5. Chills signatures — INTERPRETIVE, only when autonomic on.
    // Events are tagged { kind: 'sympathetic' | 'vagal' } by detectChillsWindows.
    // Sympathetic carries `ratio` (std × baseline). Vagal carries `peakRmssd` +
    // `baseRmssd`. Rendering must be kind-aware or one branch blows up.
    if (autonomicOn && s.chillsWindows && s.chillsWindows.length > 0) {
      const total = s.chillsWindows.reduce((x, c) => x + (c.end - c.start), 0);
      const describe = (c) => {
        if (c.kind === 'vagal' && c.peakRmssd != null && c.baseRmssd != null) {
          const mult = c.baseRmssd > 0 ? (c.peakRmssd / c.baseRmssd) : null;
          const multStr = mult != null ? `${mult.toFixed(1)}× baseline HRV` : 'HRV spike';
          return `@ ${formatDuration(c.start)} · ${multStr} (vagal burst)`;
        }
        const ratio = typeof c.ratio === 'number' ? c.ratio.toFixed(1) + '× baseline volatility' : 'baseline volatility';
        return `@ ${formatDuration(c.start)} · ${ratio}`;
      };
      const lines = s.chillsWindows.slice(0, 3).map(c => ({
        text: `${formatDuration(c.end - c.start)} ${c.kind === 'vagal' ? 'vagal burst' : 'window'}`,
        sub: describe(c),
        at: { t: c.start, label: `jump @ ${formatDuration(c.start)}` },
      }));
      sections.push({
        key: 'chills',
        title: 'Chills / high volatility',
        desc: 'A stretch where the beat-to-beat HR jitters much more than the rest of the session. The rolling standard deviation sits at 2.5× or more of baseline. Literal chills are the most common cause; muscle tremor introduces noise into the strap signal. The same fingerprint also shows up during bigger autonomic waves that aren\'t quite full flushes. Each window below has its duration, start time, and how many times above baseline the volatility was running.',
        count: s.chillsWindows.length,
        lines: [{ text: `${formatDuration(total)} total across ${s.chillsWindows.length} window${s.chillsWindows.length === 1 ? '' : 's'}` }, ...lines],
      });
    }

    // 6. Posture & sleep — descriptive, shown when data exists.
    {
      const lines = [];
      const sleepForInsight = getEffectiveSleepWindows(s);
      if (sleepForInsight && sleepForInsight.length) {
        const w = sleepForInsight[0];
        lines.push({
          text: `Sleep window · ${formatDuration(w.end - w.start)}`,
          sub: `starts @ ${formatDuration(w.start)}`,
          at: { t: w.start, label: `jump @ ${formatDuration(w.start)}` },
        });
      }
      const postureForInsight = getEffectivePostureSpans(s);
      if (postureForInsight && postureForInsight.length) {
        const durByPos = { lying: 0, sitting: 0, standing: 0 };
        for (const p of postureForInsight) durByPos[p.posture] = (durByPos[p.posture] || 0) + (p.end - p.start);
        const parts2 = [];
        if (durByPos.lying > 0) parts2.push(`${formatDuration(durByPos.lying)} lying`);
        if (durByPos.sitting > 0) parts2.push(`${formatDuration(durByPos.sitting)} sitting`);
        if (durByPos.standing > 0) parts2.push(`${formatDuration(durByPos.standing)} standing`);
        if (parts2.length) lines.push({ text: 'Posture time', sub: parts2.join(' · ') });
      }
      if (lines.length) {
        sections.push({
          key: 'posture',
          title: 'Posture & sleep',
          desc: 'Sleep windows are detected automatically from stretches where your HR drifts toward its lowest values AND your HRV sits above the session median at the same time. That combination reliably shows up during actual sleep. Posture comes from the Lying, Sitting and Standing buttons in the live monitor. Since HR changes dramatically with posture, tagging it consistently improves the quality of every other stat in this report.',
          lines,
        });
      }
    }

    // 7. Warnings — physiological: HR/HRV crossed thresholds the user set.
    if (s.warnCount > 0) {
      const types = Array.from(new Set(s.warnSegs.map(w => w.type))).join(', ');
      const lines = [{ text: `${s.warnCount} warning ${s.warnCount === 1 ? 'segment' : 'segments'}`, sub: types }];
      const earliest = s.warnSegs.reduce((a, b) => a.start <= b.start ? a : b, s.warnSegs[0]);
      if (earliest) lines.push({
        text: `First: ${warnLabel(earliest.type)}`,
        sub: `@ ${formatDuration(earliest.start)} · ${formatDuration(earliest.end - earliest.start)}`,
        at: { t: earliest.start, label: `jump @ ${formatDuration(earliest.start)}` },
      });
      sections.push({
        key: 'warnings',
        title: 'Warnings',
        desc: 'Moments when your HR or HRV crossed one of the alert thresholds you configured in the live monitor\'s Thresholds tab. Four kinds get logged: HR high (above your ceiling), HR low (below your floor), HRV crash (below the RMSSD floor), and palpitations elevated (ectopic rate above your per-minute limit). Each warning segment below shows which kind fired and how long it lasted.',
        count: s.warnCount,
        lines,
      });
    }

    // 8. Connection gaps — technical: strap lost contact. Strictly a hardware
    // concern, kept separate from warnings so it doesn't look like a lumped-in
    // health event.
    if (s.connGaps.length > 0) {
      const longest = s.connGaps.reduce((a, b) => (b.end - b.start) > (a.end - a.start) ? b : a);
      const total = s.connGaps.reduce((sum, g) => sum + (g.end - g.start), 0);
      sections.push({
        key: 'connection',
        title: 'Connection gaps',
        desc: 'Short windows where the chest strap and the app briefly lost Bluetooth contact. No HR data is recorded during these stretches, so any analysis skips over them; the gaps aren\'t a sign of anything physiological. Usual culprits: the strap drifting out of range, the computer going to sleep briefly, another Bluetooth device hogging the radio, or low strap battery. If gaps cluster near the end of a session, charge the strap.',
        count: s.connGaps.length,
        lines: [
          { text: `${s.connGaps.length} gap${s.connGaps.length === 1 ? '' : 's'} · ${formatDuration(total)} total` },
          {
            text: `Longest: ${formatDuration(longest.end - longest.start)}`,
            sub: `@ ${formatDuration(longest.start)}`,
            at: { t: longest.start, label: `jump @ ${formatDuration(longest.start)}` },
          },
        ],
      });
    }

    const chevron = `<svg class="insight-chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;

    // One-line summary shown next to the caret when collapsed. Uses the
    // headline HR metric the user picked in Month/Week (Rest / Avg / Tachy % /
    // Range), plus the raw HR range delta (max − min) because that's a concrete
    // number rather than a vague "N findings" count.
    const summaryBits = [];
    const headline = currentFilename ? computeHeadline(headlineMetric, [currentFilename]) : null;
    if (headline && headline.value != null) {
      summaryBits.push(`${headline.label.toLowerCase()} ${headline.value}${headline.unit ? ' ' + headline.unit : ''}`);
    } else if (s.hrAvg != null) {
      summaryBits.push(`avg ${s.hrAvg} bpm`);
    }
    if (s.hrMax && s.hrMin) {
      summaryBits.push(`range ${s.hrMin.v} to ${s.hrMax.v} bpm`);
    }
    const summaryText = summaryBits.join(' · ');

    const childChevron = `<svg class="insight-child-chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
    const sectionCollapsed = getCollapsedSections();
    const bodyHtml = sections.length === 0
      ? '<div class="insight-empty">Nothing notable detected in this session.</div>'
      : sections.map(sec => {
          const countHtml = sec.count != null ? `<span class="insight-count">${sec.count}</span>` : '';
          const descHtml = sec.desc ? `<div class="insight-desc">${escape(sec.desc)}</div>` : '';
          const listHtml = sec.lines.map(l => {
            const atHtml = (l.at && isFinite(l.at.t))
              ? `<button class="ui btn ghost insight-jump" type="button" data-t="${l.at.t}" aria-label="Zoom to ${escape(l.at.label)}">${escape(l.at.label)}</button>`
              : '';
            const subParts = [];
            if (l.sub) subParts.push(`<span>${escape(l.sub)}</span>`);
            if (atHtml) subParts.push(atHtml);
            const subHtml = subParts.length ? `<div class="insight-sub">${subParts.join(' · ')}</div>` : '';
            // `what` inline explainers count as autonomic / educational overlay —
            // hidden when the toggle is OFF so the report becomes pure numbers.
            const whatHtml = (autonomicOn && l.what) ? `<div class="insight-what">${escape(l.what)}</div>` : '';
            return `<li><div>${escape(l.text)}</div>${subHtml}${whatHtml}</li>`;
          }).join('');
          // Every session open starts with Overview expanded and everything
          // else collapsed — keeps the report from overpowering the chart.
          // User toggles are session-local only (not persisted) so the next
          // open always starts clean.
          const collapsedCls = sec.key === 'overview' ? '' : ' collapsed';
          return `<div class="insight-section${collapsedCls}" data-key="${sec.key}">
            <div class="insight-section-title">${childChevron}<span>${escape(sec.title)}</span>${countHtml}</div>
            <div class="insight-section-body">${descHtml}<ul>${listHtml}</ul></div>
          </div>`;
        }).join('');

    const collapsed = isInsightCollapsed();
    const box = document.getElementById('insight-text');
    box.className = 'insight-box' + (collapsed ? ' collapsed' : '');
    box.innerHTML = `
      <div class="insight-master-head">
        ${chevron}
        <span>${s.__virtualDay ? 'Day report' : 'Session report'}</span>
        <span class="insight-master-summary">${escape(summaryText)}</span>
      </div>
      <div class="insight-body">${bodyHtml}</div>
    `;
    box.querySelector('.insight-master-head').addEventListener('click', () => {
      box.classList.toggle('collapsed');
      setInsightCollapsed(box.classList.contains('collapsed'));
    });
    // Each sub-section is independently collapsible. Clicking its title toggles
    // the section's `.collapsed` class and persists the per-section state.
    box.querySelectorAll('.insight-section[data-key]').forEach(sec => {
      const title = sec.querySelector('.insight-section-title');
      title.addEventListener('click', () => {
        sec.classList.toggle('collapsed');
        setSectionCollapsed(sec.dataset.key, sec.classList.contains('collapsed'));
      });
    });
    box.querySelectorAll('.insight-jump').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation(); // don't collapse the accordion via the wrapping section title
        const t = parseFloat(btn.dataset.t);
        if (isFinite(t) && typeof zoomTo === 'function') zoomTo(t);
        // Close the report and scroll the chart into view — otherwise on mobile
        // (and even on desktop in a tall session) the user clicks a moment and
        // then has to manually scroll back up to see what happened.
        const report = btn.closest('.insight-box');
        if (report) report.classList.add('collapsed');
        const chart = document.querySelector('.chart-wrap');
        if (chart) {
          requestAnimationFrame(() => chart.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        }
      });
    });
  }

  // Per-section collapsed state — map of sectionKey -> true. Shared across all
  // sessions so a user who always-closes e.g. "Connection gaps" stays closed.
  const LS_INSIGHT_SECTIONS = 'hrv_viewer_insight_sections_collapsed';
  function getCollapsedSections() {
    try { return JSON.parse(localStorage.getItem(LS_INSIGHT_SECTIONS) || '{}'); }
    catch (e) { return {}; }
  }
  function setSectionCollapsed(key, collapsed) {
    const map = getCollapsedSections();
    if (collapsed) map[key] = true; else delete map[key];
    try { localStorage.setItem(LS_INSIGHT_SECTIONS, JSON.stringify(map)); } catch (e) {}
  }

  // Master-caret state — always defaults closed per session open (does NOT
  // persist across session navigation so reports always start tiny). User can
  // still expand/collapse freely while viewing a session; that state just
  // resets when they move to a different session.
  const LS_INSIGHT_COLLAPSED = 'hrv_viewer_insight_collapsed_v2';
  function isInsightCollapsed() { return true; }
  function setInsightCollapsed(_collapsed) {}
  // One-time cleanup of the old persisted key so stale 'open' state doesn't
  // resurface for existing users who had it set.
  try { localStorage.removeItem(LS_INSIGHT_COLLAPSED); } catch (e) {}

  function renderMarkerList(s) {
    const items = [];
    const editable = marksEditable();
    if (activeFilters.event) {
      for (const e of viewMarks(s).events) {
        items.push({ type: 'event', t: e.t, label: parseMark(e.label).label, user: true,
          edit: editable && Number.isFinite(e.ep) ? { kind: 'tap', markId: e.markId || null, raw: e.label, ep: e.ep } : null });
      }
    }
    if (activeFilters.warning) {
      for (const w of s.warnSegs) items.push({ type: 'warning', t: w.start, end: w.end, label: warnLabel(w.type) + ' (' + formatDuration(w.end - w.start) + ')' });
    }
    if (activeFilters.palp) {
      for (const c of s.palpClusters) items.push({ type: 'palp', t: c.start, end: c.end, label: c.count === 1 ? 'Ectopic beat' : `${c.count} palpitations in ${formatDuration(c.end - c.start)}` });
    }
    if (activeFilters.disconnect) {
      for (const g of s.connGaps) items.push({ type: 'disconnect', t: g.start, end: g.end, label: `Recording gap · ${formatDuration(g.end - g.start)}` });
    }
    if (activeFilters.delta && s.hrDeltas) {
      for (const d of s.hrDeltas) {
        const word = d.direction === 'rise' ? 'Rise' : 'Drop';
        items.push({ type: 'delta', t: d.start, end: d.end, label: `${word} ${Math.abs(d.delta)} bpm in ${formatDuration(d.end - d.start)}, ${d.startHR} to ${d.endHR}` });
      }
    }
    if (activeFilters.flush && s.flushes) {
      for (const f of s.flushes) items.push({ type: 'flush', t: f.t, label: `Sympathetic flush · HR +${f.hrDelta} bpm, HRV down ${f.rmssdDropPct}%` });
    }
    if (activeFilters.chills && s.chillsWindows) {
      for (const c of s.chillsWindows) items.push({ type: 'chills', t: c.start, end: c.end, label: `Chills signature · ${formatDuration(c.end - c.start)} of high HR volatility` });
    }
    const postureSpansForList = getEffectivePostureSpans(s);
    if (activeFilters.posture && postureSpansForList) {
      for (const p of postureSpansForList) items.push({ type: 'posture', t: p.start, end: p.end, label: `Posture · ${p.posture} (${formatDuration(p.end - p.start)})` });
    }
    const sleepWindowsForList = getEffectiveSleepWindows(s);
    if (activeFilters.sleep && sleepWindowsForList) {
      for (const w of sleepWindowsForList) {
        const mine = !!(w.fromMark && w.markId);
        items.push({ type: 'sleep', t: w.start, end: w.end, user: mine,
          label: `${mine ? 'Sleep' : 'Sleep window'} · ${formatDuration(w.end - w.start)}`,
          edit: editable && mine ? { kind: 'sleep', markId: w.markId } : null });
      }
    }
    items.sort((a, b) => a.t - b.t);
    const el = document.getElementById('marker-list');
    _markerListByT.length = 0;
    const mn = document.querySelector('#markers-toggle .n');
    if (mn) mn.textContent = ' · ' + items.length;
    if (!items.length) { el.innerHTML = '<div style="color: var(--text-dim); font-size: 12px; padding: 8px;">No markers to show.</div>'; return; }
    el.innerHTML = items.map((i, n) => `
      <div class="marker-item type-${i.type}${i.user ? ' mine' : ''}" data-t="${i.t}"${i.end != null ? ` data-end="${i.end}"` : ''} data-i="${n}">
        <button class="row-btn mk-go" type="button">${markDiamond(i.user)}<span class="marker-time">${formatDuration(i.t)}</span><span class="marker-label">${escape(i.label)}</span></button>
        ${i.edit ? `<button class="btn ghost mk-edit" type="button" aria-label="Edit ${escape(i.label)} at ${formatDuration(i.t)}">Edit</button>` : ''}
      </div>`).join('');
    // Sorted [{t, el}] for the O(log N) hover lookup in highlightMarkerItemByT.
    el.querySelectorAll('.marker-item').forEach(mi => {
      const item = items[Number(mi.dataset.i)];
      const t = item.t;
      const labelText = mi.querySelector('.marker-label').textContent;
      const tLabel = mi.querySelector('.marker-time').textContent;
      _markerListByT.push({ t, el: mi });
      mi.addEventListener('click', (ev) => {
        if (ev.target.closest('.mk-edit')) return;
        focusMarker(item, mi);
      });
      const editBtn = mi.querySelector('.mk-edit');
      if (editBtn) editBtn.addEventListener('click', () => openMarkEditor(item, mi));
      if (pinnedMarkT != null && t === pinnedMarkT) mi.setAttribute('aria-current', 'true');
      mi.addEventListener('mouseenter', (e) => highlightMarker(t, labelText, tLabel, e));
      mi.addEventListener('mouseleave', unhighlightMarker);
    });
  }
  // User marks solid in the text colour; detected markers dim and dashed.
  function markDiamond(user) {
    return user
      ? '<svg class="mk-dia" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 13 7 7 13 1 7Z" fill="currentColor"/></svg>'
      : '<svg class="mk-dia detected" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6 12.4 7 7 12.4 1.6 7Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-dasharray="2.2 1.6"/></svg>';
  }

  // ---- Markers panel (S10b): select, ease, edit, delete with Undo, sleep marks ----
  let pinnedMarkT = null;
  let markersSheet = null, layersSheet = null;
  let _easeRaf = 0;
  function marksEditable() {
    return !!(marksPage && !isDemoMode() && !marksPage.drive.status().blocked);
  }
  // The chart window a marker eases to: 4 min around a point; a span plus 15% each side.
  function markWindow(item, dur) {
    let lo, hi;
    if (item.end != null && item.end - item.t > 0.01) {
      const pad = Math.max(0.5, (item.end - item.t) * 0.15);
      lo = item.t - pad; hi = item.end + pad;
    } else { lo = item.t - 2; hi = item.t + 2; }
    if (hi - lo < 4) { const c = (lo + hi) / 2; lo = c - 2; hi = c + 2; }
    if (hi - lo >= dur) return [0, dur];
    if (lo < 0) { hi -= lo; lo = 0; }
    if (hi > dur) { lo -= hi - dur; hi = dur; }
    return [lo, hi];
  }
  function cancelEase() {
    if (_easeRaf) cancelAnimationFrame(_easeRaf);
    _easeRaf = 0;
    if (_drawOwed && currentChart) { _drawOwed = false; requestChartDraw(currentChart); }
  }
  function easeBrushTo(lo, hi, done) {
    cancelEase();
    const a0 = brushMin == null ? 0 : brushMin, b0 = brushMax == null ? currentSummary.duration : brushMax;
    const t0 = performance.now(), MS = 240;
    const step = (now) => {
      _easeRaf = 0;
      if (!currentSummary) return;
      const k = Math.min(1, (now - t0) / MS);
      const e = 1 - Math.pow(1 - k, 3);

    const raw = String(item.edit.raw == null ? '' : item.edit.raw);
    const pm = parseMark(raw);

  function openSleepEditor(item, row) {

    const origin = marksScope(currentSummary).originEp;
    let from, to;
    if (rec) { from = rec.from; to = rec.to; }

  // Bidirectional-sync: find the marker-list row whose data-t is closest to t

  function highlightMarkerItemByT(t) {

  // series is sorted by x; a tie goes to the earlier point.
  function nearestY(series, t) {

      if (series[mid].x < t) lo = mid + 1;
      else hi = mid;
    }
    const prev = lo > 0 ? series[lo - 1] : null;
    return prev && Math.abs(prev.x - t) <= Math.abs(series[lo].x - t) ? prev.y : series[lo].y;

  function warnLabel(type) {

  // HR×HRV quadrant thresholds. Four bounds (not two) so each quadrant
  // owns its defining edges with a neutral middle zone between them. Two
  // presets: POTS (HR 80–100, HRV 20–35) and Typical (HR 65–85, HRV 30–50).
  const LS_QUADRANT_THRESH = 'hrv_viewer_quadrant_thresh_v2';
  const QUADRANT_DEFAULT_POTS    = { hrLow: 80, hrHigh: 100, hrvLow: 20, hrvHigh: 35 };
  const QUADRANT_DEFAULT_TYPICAL = { hrLow: 65, hrHigh: 85,  hrvLow: 30, hrvHigh: 50 };
  let QUADRANT_THRESH = {};
  function quadrantDefault() {
    return isAutonomicOn() ? QUADRANT_DEFAULT_POTS : QUADRANT_DEFAULT_TYPICAL;
  }
  function applyQuadrantThresh() {
    const d = quadrantDefault();
    QUADRANT_THRESH = Object.assign({}, d);
    try {
      const saved = JSON.parse(localStorage.getItem(LS_QUADRANT_THRESH) || 'null');
      if (saved && saved.customized) {
        // Merge saved values over defaults, one key at a time — users might
        // have only customized a subset.
        for (const k of ['hrLow', 'hrHigh', 'hrvLow', 'hrvHigh']) {
          if (Number.isFinite(saved[k])) QUADRANT_THRESH[k] = saved[k];
        }
      }
    } catch (e) {}
    // Safety: HR low must be below HR high, same for HRV, so the middle zone
    // never inverts. If user's saved values somehow crossed, swap them.
    if (QUADRANT_THRESH.hrLow >= QUADRANT_THRESH.hrHigh) {
      [QUADRANT_THRESH.hrLow, QUADRANT_THRESH.hrHigh] = [QUADRANT_THRESH.hrHigh, QUADRANT_THRESH.hrLow];
    }
    if (QUADRANT_THRESH.hrvLow >= QUADRANT_THRESH.hrvHigh) {
      [QUADRANT_THRESH.hrvLow, QUADRANT_THRESH.hrvHigh] = [QUADRANT_THRESH.hrvHigh, QUADRANT_THRESH.hrvLow];
    }
  }
  applyQuadrantThresh();
  function saveQuadrantThresh(overrides) {
    Object.assign(QUADRANT_THRESH, overrides);

  }

  function classifyQuadrant(hrAvg, rmssdAvg) {
    const t = QUADRANT_THRESH;
    const hrLow = hrAvg < t.hrLow;
    const hrHigh = hrAvg > t.hrHigh;
    const rmLow = rmssdAvg != null && rmssdAvg < t.hrvLow;
    const rmHigh = rmssdAvg != null && rmssdAvg > t.hrvHigh;
    if (hrLow && rmHigh) return { key: 'low-high', label: 'Low HR · High HRV', tone: 'Rest or recovery mode. Strong parasympathetic tone.' };
    if (hrHigh && rmHigh) return { key: 'high-high', label: 'High HR · High HRV', tone: 'Post-exertion rebound or regulated arousal.' };
    if (hrLow && rmLow) return { key: 'low-low', label: 'Low HR · Low HRV', tone: 'Fatigue or under-recovery pattern.' };
    if (hrHigh && rmLow) return { key: 'high-low', label: 'High HR · Low HRV', tone: 'Sympathetic stress. Classic flare or orthostatic pattern.' };
    // Neutral zone — session sits between the low and high cuts on one or both
    // axes. Honest "not clearly either way" result instead of forcing a bucket.
    return { key: 'neutral', label: 'Neutral', tone: 'Session sits in the middle zone. Neither clearly resting nor clearly activated.' };
  }

  function renderInterpretation(s) {
    const cur = document.getElementById('interp-current');
    const QUAD_LABELS = {
      'low-high': 'Low HR · High HRV', 'high-high': 'High HR · High HRV',
      'low-low': 'Low HR · Low HRV', 'high-low': 'High HR · Low HRV',
    };
    const totalSession = s.activeDuration || s.duration || 1;
    let dominant = null, dominantPct = 0;
    if (currentQuadRanges) {
      for (const key of Object.keys(QUAD_LABELS)) {
        const ranges = currentQuadRanges[key] || [];
        const min = ranges.reduce((x, r) => x + (r.end - r.start), 0);
        const pct = (min / totalSession) * 100;
        if (pct > dominantPct) { dominantPct = pct; dominant = key; }
      }
    }
    const q = s.rmssdAvg == null ? null : classifyQuadrant(s.hrAvg, s.rmssdAvg);
    const editKey = q && q.key !== 'neutral' ? q.key : (dominant || 'high-low');
    let html = `<div class="interp-line"><span class="interp-line-label">${s.__virtualDay ? 'Day average' : 'Recording average'}</span>` +
      (q ? `<span class="interp-line-value">${s.hrAvg} bpm · HRV ${s.rmssdAvg} ms · ${q.label}</span>`
         : `<span class="interp-line-value">${s.hrAvg} bpm · not enough HRV</span>`) + `</div>`;
    if (q && q.key === 'neutral' && dominant && dominantPct >= 25) {
      html += `<div class="interp-line"><span class="interp-line-label">Most time in</span>` +
        `<span class="interp-line-value">${QUAD_LABELS[dominant]} · ${Math.round(dominantPct)}%</span></div>`;
    }
    html += `<button class="btn interp-edit" id="interp-edit" type="button">Edit thresholds</button>`;
    cur.innerHTML = html;
    document.getElementById('interp-edit').addEventListener('click', (e) => {
      e.stopPropagation();
      openQuadrantThreshEditor(e.currentTarget, editKey);
    });
    // Each cell shows its share of the time and total duration; empty cells are not clickable.
    document.querySelectorAll('.interp-cell').forEach(cell => {
      const key = cell.dataset.quad;
      const ranges = (currentQuadRanges && currentQuadRanges[key]) || [];
      const titleEl = cell.querySelector('.interp-title');
      const oldBadge = titleEl.querySelector('.interp-empty-badge');
      if (oldBadge) oldBadge.remove();
      const badge = document.createElement('span');
      badge.className = 'interp-empty-badge';
      if (ranges.length === 0) {
        badge.textContent = 'None';
        cell.classList.add('empty');
        cell.classList.remove('on');
      } else {
        cell.classList.remove('empty');
        const totalMin = ranges.reduce((x, r) => x + (r.end - r.start), 0);
        badge.classList.add('has');
        badge.textContent = `${Math.round((totalMin / totalSession) * 100)}% · ${formatDuration(totalMin)}`;
      }
      titleEl.appendChild(badge);
    });
  }

  function wireQuadrantToggles() {
    document.querySelectorAll('.interp-cell').forEach(cell => {
      cell.addEventListener('click', (e) => {
        // Kebab clicks open the threshold editor; don't also fire the quadrant
        // overlay toggle for the same click.
        if (e.target.closest('.interp-kebab')) return;
        if (cell.classList.contains('empty')) return;
        const key = cell.dataset.quad;
        activeQuadrants[key] = !activeQuadrants[key];
        cell.classList.toggle('on', activeQuadrants[key]);
        if (currentSummary && currentData) drawSessionChart(currentSummary, currentData);
      });
    });
    document.querySelectorAll('.interp-kebab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cell = btn.closest('.interp-cell');
        if (cell && cell.dataset.quad) openQuadrantThreshEditor(btn, cell.dataset.quad);
      });
    });
  }

  // Maps each quadrant corner to the two threshold keys that define it.

  // card represents. Neighbouring cards share some keys (e.g., both low-HR
  // cards reference `hrLow`), so changing one affects both. The popover
  // explicitly calls this out.
  const QUAD_FIELDS = {
    'low-high':  { hr: 'hrLow',  hrv: 'hrvHigh', hrLabel: 'Low HR ceiling',  hrvLabel: 'High HRV floor',
                   hrHint: 'HR below this counts as Low.',
                   hrvHint: 'RMSSD above this counts as High.',
                   sharedNote: 'HR ceiling is shared with the Low HR · Low HRV card. HRV floor is shared with the High HR · High HRV card.' },
    'high-high': { hr: 'hrHigh', hrv: 'hrvHigh', hrLabel: 'High HR floor',   hrvLabel: 'High HRV floor',
                   hrHint: 'HR above this counts as High.',
                   hrvHint: 'RMSSD above this counts as High.',
                   sharedNote: 'HR floor is shared with the High HR · Low HRV card. HRV floor is shared with the Low HR · High HRV card.' },
    'low-low':   { hr: 'hrLow',  hrv: 'hrvLow',  hrLabel: 'Low HR ceiling',  hrvLabel: 'Low HRV ceiling',
                   hrHint: 'HR below this counts as Low.',
                   hrvHint: 'RMSSD below this counts as Low.',
                   sharedNote: 'HR ceiling is shared with the Low HR · High HRV card. HRV ceiling is shared with the High HR · Low HRV card.' },
    'high-low':  { hr: 'hrHigh', hrv: 'hrvLow',  hrLabel: 'High HR floor',   hrvLabel: 'Low HRV ceiling',
                   hrHint: 'HR above this counts as High.',
                   hrvHint: 'RMSSD below this counts as Low.',
                   sharedNote: 'HR floor is shared with the High HR · High HRV card. HRV ceiling is shared with the Low HR · Low HRV card.' },
  };

  function updateDefaultHint(pop, quadKey) {
    const hintEl = pop.querySelector('#thresh-default-hint');
    if (!hintEl) return;
    const d = quadrantDefault();
    const fields = QUAD_FIELDS[quadKey];
    const mode = isAutonomicOn() ? 'autonomic mode (calibrated for POTS)' : 'typical adult mode';
    hintEl.textContent = `Reset restores the ${mode} defaults: ${fields.hrLabel} ${d[fields.hr]}, ${fields.hrvLabel} ${d[fields.hrv]}.`;
  }

  // Per-card threshold editor popover. Lazily created once; its labels and
  // bindings are re-written each open based on which quadrant card's kebab
  // was clicked. Only exposes the TWO thresholds that define that quadrant
  // corner so the user doesn't have to think about the other two.
  function openQuadrantThreshEditor(anchorBtn, quadKey) {
    const fields = QUAD_FIELDS[quadKey];
    if (!fields) return;
    let pop = document.getElementById('quadrant-thresh-popover');
    if (!pop) {
      pop = document.createElement('div');
      pop.id = 'quadrant-thresh-popover';
      pop.className = 'ui popover thresh-pop';
      pop.setAttribute('role', 'dialog');
      pop.setAttribute('aria-labelledby', 'thresh-title');
      pop.innerHTML = `
        <h4 id="thresh-title"></h4>
        <div class="thresh-blurb" id="thresh-blurb"></div>
        <div class="thresh-row">
          <label id="thresh-hr-label" for="thresh-hr"></label>
          <span class="field"><input type="number" id="thresh-hr" min="40" max="200" step="1" /></span>
        </div>
        <div class="thresh-row">
          <label id="thresh-hrv-label" for="thresh-hrv"></label>
          <span class="field"><input type="number" id="thresh-hrv" min="5" max="200" step="1" /></span>
        </div>
        <div class="thresh-default-hint" id="thresh-default-hint"></div>
        <div class="action-row">
          <button class="btn ghost thresh-reset" id="thresh-reset" type="button">Reset</button>
          <span class="pair"><button class="btn" id="thresh-cancel" type="button">Cancel</button><button class="btn primary" id="thresh-save" type="button">Save</button></span>
        </div>
      `;
      document.body.appendChild(pop);
      // Dismiss handlers (wired once, work for every open).
      document.addEventListener('click', (e) => {
        if (!pop.classList.contains('open')) return;
        if (pop.contains(e.target) || e.target.closest('.interp-kebab, #interp-edit')) return;
        pop.classList.remove('open');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && pop.classList.contains('open')) pop.classList.remove('open');
      });
    }
    // Rebuild labels + bindings for this card's two thresholds.
    const title = pop.querySelector('#thresh-title');
    const blurb = pop.querySelector('#thresh-blurb');
    const hrLabel = pop.querySelector('#thresh-hr-label');
    const hrvLabel = pop.querySelector('#thresh-hrv-label');
    const hrInput = pop.querySelector('#thresh-hr');
    const hrvInput = pop.querySelector('#thresh-hrv');
    const cardTitleMap = {
      'low-high':  'Low HR · High HRV',
      'high-high': 'High HR · High HRV',
      'low-low':   'Low HR · Low HRV',
      'high-low':  'High HR · Low HRV',
    };
    title.textContent = 'Thresholds · ' + cardTitleMap[quadKey];
    blurb.textContent = fields.sharedNote;
    hrLabel.innerHTML = `${fields.hrLabel}<span class="thresh-hint">${fields.hrHint}</span>`;
    hrvLabel.innerHTML = `${fields.hrvLabel}<span class="thresh-hint">${fields.hrvHint}</span>`;
    hrInput.value = QUADRANT_THRESH[fields.hr];
    hrvInput.value = QUADRANT_THRESH[fields.hrv];

    // Clone-and-replace Save / Reset so stale closures from prior opens don't
    // fire (easier than tracking listener references).
    const oldSave = pop.querySelector('#thresh-save');
    const newSave = oldSave.cloneNode(true);
    oldSave.parentNode.replaceChild(newSave, oldSave);
    newSave.addEventListener('click', () => {
      const hrVal = parseInt(hrInput.value, 10);
      const hrvVal = parseInt(hrvInput.value, 10);
      const overrides = {};
      if (Number.isFinite(hrVal) && hrVal >= 40 && hrVal <= 200) overrides[fields.hr] = hrVal;
      if (Number.isFinite(hrvVal) && hrvVal >= 5 && hrvVal <= 200) overrides[fields.hrv] = hrvVal;
      saveQuadrantThresh(overrides);
      applyQuadrantThresh(); // re-run safety swap in case user crossed low/high
      invalidateQuadrantCache();
      pop.classList.remove('open');
      route();
    });
    const oldCancel = pop.querySelector('#thresh-cancel');
    const newCancel = oldCancel.cloneNode(true);
    oldCancel.parentNode.replaceChild(newCancel, oldCancel);
    newCancel.addEventListener('click', () => pop.classList.remove('open'));
    const oldReset = pop.querySelector('#thresh-reset');
    const newReset = oldReset.cloneNode(true);
    oldReset.parentNode.replaceChild(newReset, oldReset);
    newReset.addEventListener('click', () => {
      resetQuadrantThresh();
      hrInput.value = QUADRANT_THRESH[fields.hr];
      hrvInput.value = QUADRANT_THRESH[fields.hrv];
      updateDefaultHint(pop, quadKey);
      invalidateQuadrantCache();
    });

    updateDefaultHint(pop, quadKey);
    const rect = anchorBtn.getBoundingClientRect();
    pop.classList.add('open');
    const popW = pop.offsetWidth;
    const popH = pop.offsetHeight;
    let left = Math.max(8, rect.right - popW);
    let top = rect.bottom + 6;
    if (top + popH > window.innerHeight - 8) top = Math.max(8, rect.top - popH - 6);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function wireInterpToggle() {
    const panel = document.getElementById('interp-panel');
    const head = document.getElementById('interp-head');
    // Default collapsed state from localStorage
    const saved = localStorage.getItem('hrv_viewer_interp_collapsed') === 'true';
    panel.classList.toggle('collapsed', saved);
    head.setAttribute('aria-expanded', String(!saved));
    head.addEventListener('click', () => {
      const collapsed = panel.classList.toggle('collapsed');
