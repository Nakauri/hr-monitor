<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Mirror the compact #hr-widget styling from widget.css so the floating
     overlay reads as "the widget, smaller" rather than a separate
     re-skin. Self-contained — this file is loaded directly via
     file:///android_asset/ in a WebView and runs without any other assets. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #d8d8d8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }
  .widget {
    background: #0a0a0a;
    border: 1px solid #1f1f1f;
    border-radius: 16px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }
  .hr-block, .hrv-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #8a8a8a;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 2px;
  }
  .value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .hrv-block .value {
    font-size: 20px;
    color: #9adfc8;
  }
  #spark-wrap {
    display: flex;
    align-items: stretch;
    min-width: 70px;
    height: 36px;
  }
  #spark {
    width: 100%;
    height: 100%;
  }
  /* Mode classes drive what's visible. compact = HR only.
     card = HR + HRV. chart = HR + spark + HRV. */
  body.mode-compact .hrv-block,
  body.mode-compact #spark-wrap,
  body.mode-card #spark-wrap {
    display: none;
  }
  body.mode-compact .widget {
    grid-template-columns: auto;
  }
  body.mode-card .widget {
    grid-template-columns: auto auto;
  }
  body.mode-chart .widget {
    grid-template-columns: auto 1fr auto;
  }
</style>
</head>
<body class="mode-chart">
  <div class="widget">
    <div class="hr-block">
      <div class="label">BPM</div>
      <div class="value" id="bpm">—</div>
    </div>
    <div id="spark-wrap"><canvas id="spark"></canvas></div>
    <div class="hrv-block">
      <div class="label">RMSSD</div>
      <div class="value" id="hrv">—</div>
    </div>
  </div>
<script>
  const bpmHistory = [];
  const MAX_HISTORY = 60;
  const sparkCanvas = document.getElementById('spark');
  const sparkCtx = sparkCanvas.getContext('2d');
  let sparkW = 0, sparkH = 0;

  function resizeSpark() {
    const dpr = window.devicePixelRatio || 1;
    const rect = sparkCanvas.getBoundingClientRect();
    sparkW = Math.max(1, Math.round(rect.width));
    sparkH = Math.max(1, Math.round(rect.height));
    sparkCanvas.width = sparkW * dpr;
    sparkCanvas.height = sparkH * dpr;
    sparkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSpark();
  }

  function drawSpark() {
    sparkCtx.clearRect(0, 0, sparkW, sparkH);
    if (bpmHistory.length < 2) return;
    let min = Infinity, max = -Infinity;
    for (const v of bpmHistory) { if (v < min) min = v; if (v > max) max = v; }
    const range = Math.max(1, max - min);
    const padY = sparkH * 0.12;
    const usableH = sparkH - padY * 2;
    sparkCtx.strokeStyle = '#9adfc8';
    sparkCtx.lineWidth = 1.6;
    sparkCtx.lineJoin = 'round';
    sparkCtx.lineCap = 'round';
    sparkCtx.beginPath();
    const n = bpmHistory.length;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * sparkW;
      const y = padY + usableH - ((bpmHistory[i] - min) / range) * usableH;
      if (i === 0) sparkCtx.moveTo(x, y);
      else sparkCtx.lineTo(x, y);
    }
    sparkCtx.stroke();
  }

  window.updateHr = function (bpm, rmssd) {
    document.getElementById('bpm').textContent = bpm > 0 ? bpm : '—';
    document.getElementById('hrv').textContent = rmssd > 0 ? Math.round(rmssd) : '—';
    if (bpm > 0) {
      bpmHistory.push(bpm);
      if (bpmHistory.length > MAX_HISTORY) bpmHistory.shift();
      drawSpark();
    }
  };

  window.setMode = function (mode) {
    document.body.className = 'mode-' + (mode === 'chart' || mode === 'card' ? mode : 'compact');
    // Sparkline canvas dimensions change with the mode; resize after layout.
    requestAnimationFrame(resizeSpark);
  };

  window.addEventListener('resize', resizeSpark);
  requestAnimationFrame(resizeSpark);
</script>
</body>
</html>
