name: Check

# ./check on every push and pull request, whatever changed (api/, lib/, relay/ included).
# build-android.yml runs the same job before it publishes the APK.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # demo-synthetic.test.cjs reads an old commit, so the check needs full history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run ./check
        run: sh ./check

      # The browser tier needs the local ux-audit kit, but a stale CSP hash blocks a page's scripts on the live
      # site, so every push checks vercel.json against the pages with the same Chromium parser the pre-push hook uses.
      - name: Check the CSP hashes are current
        run: |
          mkdir -p "$RUNNER_TEMP/ux/kit" && cd "$RUNNER_TEMP/ux/kit"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.64.0 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cd "$GITHUB_WORKSPACE" && node scripts/csp-hashes.mjs --check --ux "$RUNNER_TEMP/ux"

      # The monitor's browser checks run on synthetic data only (scripts/fake-bridge.mjs, scripts/vendor/), so CI runs
      # them on every push; the viewer checks read real device recordings and stay on the pushing machine.
      - name: Monitor browser checks
        run: node scripts/browser-tier.mjs --only monitor-log,monitor-controls,monitor-consistency,monitor-sync,monitor-status,recorder-page,native-rmssd,strap-switch,strap-picker,signal-chip,ui-dialogs --ux "$RUNNER_TEMP/ux"
