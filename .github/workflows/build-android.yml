name: Build Android APK

# Capacitor Android build of the HR Monitor web app plus the native plugin in mobile/android-overlay/.
# On every push to main that touches the app: ./check, then a release APK (not debuggable, signed with
# the app keystore) published to the rolling "android-latest" GitHub Release at:
# https://github.com/Nakauri/hr-monitor/releases/latest/download/hr-monitor.apk

on:
  push:
    branches: [main]
    paths:
      - 'hr_monitor.html'
      - 'overlay.html'
      - 'hrv_viewer.html'
      - 'index.html'
      - 'widget.css'
      - 'widget.js'
      - 'app-home.html'
      - 'ui.css'
      - 'ui.js'
      - 'tokens.css'
      - 'diagnostics.js'
      - 'marks-store.js'
      - 'relay-link.js'
      - 'marks-drive.js'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The fast checks gate the public APK; .githooks/pre-push runs the same ./check before any push.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # demo-synthetic.test.cjs reads an old commit, so the check needs full history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run ./check
        run: sh ./check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Copy web files into mobile/www
        working-directory: mobile
        run: npm run copy-web

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Apply Android overlay
        working-directory: mobile
        run: |
          if [ -d android-overlay ]; then
            cp -rv android-overlay/. android/
            echo "[overlay] applied customizations from mobile/android-overlay/"
          fi

      - name: Inject server_client_id into Android strings
        working-directory: mobile/android
        run: |
          STRINGS_FILE="app/src/main/res/values/strings.xml"
          if ! grep -q "server_client_id" "$STRINGS_FILE"; then
            sed -i 's|</resources>|    <string name="server_client_id">103129946542-0ll0ojj36a38p52c20uebfl8jnu59ona.apps.googleusercontent.com</string>\n</resources>|' "$STRINGS_FILE"
          fi

      - name: Check for signing secret
        id: check-signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A push publishes to the public release; a debug-signed APK there would not update the installed app.
            echo "::error::ANDROID_KEYSTORE_BASE64 not set; refusing to publish a debug-signed APK."
            exit 1
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; pull request build uses the debug keystore and publishes nothing."
          fi

      - name: Configure release signing
        if: steps.check-signing.outputs.has_keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/release.keystore
          cat mobile/android-overlay/app/signing-append.gradle >> mobile/android/app/build.gradle

      - name: Append OkHttp dependency for NativeRelaySocketPlugin
        run: |
          # The native WebSocket plugin uses OkHttp directly. Capacitor 6
          # doesn't ship okhttp3 on the app module's classpath by default,
          # so we append a single-line dependencies block to the
          # Capacitor-generated app/build.gradle. Multiple dependencies
          # blocks in one Gradle file merge — no conflict with the auto-
          # generated one above.
          cat >> mobile/android/app/build.gradle <<'EOF'

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          # BuildConfig.TEST_HOOKS; the build step pins HRM_TEST_HOOKS to "0" so it is false here.
          cat mobile/android-overlay/app/test-hooks.gradle >> mobile/android/app/build.gradle

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Inject Android manifest additions
        working-directory: mobile
        run: node scripts/inject-manifest.js

      # The public APK is a release build: not debuggable, so USB access cannot read app files or
      # attach a debugger. Same keystore as local debug builds, so Google sign-in and upgrades work.
      # Without the keystore secret a release APK would be unsigned and uninstallable, so fall back.
      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HRM_TEST_HOOKS: "0"
        run: |
          if [ "${{ steps.check-signing.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename APK for release
        run: |
          mkdir -p release
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk release/hr-monitor.apk
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release/hr-monitor.apk
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > release/version.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "shortSha": "$SHORT_SHA",
            "builtAt": "$BUILD_DATE",
            "signed": "${{ steps.check-signing.outputs.has_keystore }}"
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hr-monitor-${{ github.sha }}
          path: release/hr-monitor.apk
          if-no-files-found: error
          retention-days: 30

      # Re-publish instead of swapping the asset, so the release shows this build's date (Khal 2026-10-12: the page
      # read "6 months ago"). Also drops the stale April native release. Both deletes are no-ops when absent.
      - name: Remove previous rolling releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release delete android-native-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish rolling GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: android-latest
          name: Android build (rolling latest)
          body: |
            Latest Capacitor build from `main`.

            Install from your phone's browser:
            https://github.com/${{ github.repository }}/releases/latest/download/hr-monitor.apk

            Built from commit ${{ github.sha }}.
            signed: ${{ steps.check-signing.outputs.has_keystore }}
          files: |
            release/hr-monitor.apk
            release/version.json
          prerelease: false
          make_latest: true
